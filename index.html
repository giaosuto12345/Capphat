<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Trắc nghiệm Cán bộ Đoàn 2026</title>
    
    <!-- Tải Tailwind CSS để làm đẹp giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tải FontAwesome cho các biểu tượng (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tải React và ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Tải Babel để dịch mã JSX trực tiếp trên trình duyệt -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Hiệu ứng mượt mà khi hiển thị */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        body { background-color: #f4f7fb; }
    </style>
</head>
<body>
    <!-- Nơi ứng dụng React sẽ hiển thị -->
    <div id="root"></div>

    <!-- Viết code React trong thẻ script có type="text/babel" -->
    <script type="text/babel">
        const { useState } = React;

        const initialQuestionsData = [
            { question: "Đồng chí cho biết từ khi thành lập đến nay, Đoàn TNCS Hồ Chí Minh đã bao nhiêu lần đổi tên?", options: ["A. 7 lần.", "B. 9 lần.", "C. 6 lần."], answer: 0 },
            { question: "Đồng chí cho biết tổ chức đoàn chính thức lấy tên Đoàn TNCS Hồ Chí Minh vào năm nào?", options: ["A. Năm 1931", "B. Năm 1945", "C. Năm 1976"], answer: 2 },
            { question: "Đồng chí hãy cho biết trong Đại hội đại biểu Đoàn TNCS Hồ Chí Minh Quân đội lần thứ XI, nhiệm kỳ 2025 - 2030 đã phát động phong trào thi đua nào?", options: ["A. Thanh niên Quân đội rèn đức luyện tài, xung kích sáng tạo xứng danh Bộ đội Cụ Hồ thời kỳ mới", "B. Phong trào “3 tiên phong Quyết thắng”", "C. Phong trào “Thanh niên tình nguyện”"], answer: 1 },
            { question: "Tên hai “Công trình Thanh niên Cộng sản” nổi bật nhất trong những năm giữa thập kỷ 80 của thế kỷ XX là gì?", options: ["A. Xây dựng nhà máy Thủy điện Hòa Bình và xây dựng nhà máy Nhiệt điện Phả Lại", "B. Xây dựng đường dây điện Bắc Nam và Xây dựng nhà máy Nhiệt điện Cẩm Phả", "C. Xây dựng nhà máy Thủy điện Thác Bà và Xây dựng nhà máy Thủy điện Phú Bình."], answer: 0 },
            { question: "Ngày 26/3/1931 được chọn là ngày thành lập Đoàn tại Đại hội Đoàn nào?", options: ["A. Đại hội Đoàn toàn quốc lần thứ I (2/1950).", "B. Đại hội Đoàn toàn quốc lần thứ II (11/1956).", "C. Đại hội Đoàn toàn quốc lần thứ III (3/1961)."], answer: 2 },
            { question: "Bốn câu thơ sau được Bác Hồ tặng đơn vị nào? ở đâu?\n“Không có việc gì khó; Chỉ sợ lòng không bền; Đào núi và lấp biển; Quyết chí ắt làm nên”", options: ["A. Liên đội 312 ở Nà Cù (Bắc Cạn)", "B. Đại đoàn 308, tại Đền Hùng (Phú Thọ)", "C. Đại đoàn 312, tại Chiến khu Việt Bắc (Tuyên Quang)"], answer: 0 },
            { question: "Hệ thống tổ chức của đoàn trong quân đội gồm mấy cấp?", options: ["A. Hai cấp.", "B. Ba cấp.", "C. Bốn cấp"], answer: 1 },
            { question: "Đồng chí cho biết phát biểu chỉ đạo Đại hội đại biểu Đoàn TNCS Hồ Chí Minh Quân đội lần thứ 11, nhiệm kỳ 2025-2030, thay mặt Quân ủy Trung ương, Bộ Quốc phòng, Đại tướng Phan Văn Giang yêu cầu tuổi trẻ toàn quân thực hiện tốt 2 nội dung nào?", options: ["A. “2 xung kích, 2 sẵn sàng”", "B. “2 đột phá, 2 xung kích”", "C. “2 dân chủ, 2 quyết thắng”"], answer: 0 },
            { question: "Hãy cho biết chủ đề phong trào thi đua quyết thắng năm 2026?", options: ["A. Đoàn kết, mẫu mực, sáng tạo, quyết thắng.", "B. Dân chủ, đoàn kết, kỷ cương, sáng tạo, quyết thắng", "C. Đoàn kết, kỷ cương, đột phá, sáng tạo, quyết thắng"], answer: 2 },
            { question: "Đồng chí cho biết câu nói “con đường của thanh niên chỉ có thể là con đường cách mạng...” là của ai?", options: ["A. Phạm Văn Đồng", "B. Lê Duẩn", "C. Lý Tự Trọng"], answer: 2 },
            { question: "Ủy viên ban chấp hành không tham gia họp BCH mà không có lý do chính đáng trong mấy kỳ liên tục thì bị xóa tên trong ban chấp hành?", options: ["A. 2 kỳ.", "B. 3 kỳ.", "C. 4 kỳ."], answer: 1 },
            { question: "Đồng chí hãy cho biết thời gian tổ chức đoàn đầu tiên được thành lập ở các đơn vị trực thuộc Cục Quân khí?", options: ["A. Năm 1951", "B. Năm 1952", "C. Năm 1955"], answer: 0 },
            { question: "Đồng chí cho biết câu nói “Quân đội ta trung với Đảng, hiếu với dân...” được Chủ tịch Hồ Chí Minh khái quát vào thời gian nào?", options: ["A. 22/12/1964.", "B. 22/12/1944.", "C. 22/12/1989."], answer: 0 },
            { question: "Đồng chí cho biết Đại hội Đoàn toàn quốc lần thứ mấy đã quyết định lấy ngày 26/3/1931 làm ngày thành lập Đoàn?", options: ["A. Đại hội lần thứ I; từ ngày 7 đến ngày 14/2/1950", "B. Đại hội lần thứ II; từ ngày 25/10 đến ngày 04/11/1956", "C. Đại hội lần thứ III; từ ngày 23 đến ngày 25/3/1961"], answer: 2 },
            { question: "Đại hội Đoàn TNCS Hồ Chí Minh Quân đội lần thứ XI diễn ra vào thời gian nào?", options: ["A. Từ ngày 9 đến ngày 10/12/2025", "B. Từ ngày 8 đến ngày 9/12/2025", "C. Từ ngày 7 đến ngày 8/12/2025"], answer: 2 },
            { question: "Điều lệ hiện hành của Đoàn TNCS Hồ Chí Minh bao gồm?", options: ["A. 11 chương, 38 điều", "B. 12 chương, 45 điều", "C. 12 chương, 54 điều"], answer: 0 },
            { question: "Đồng chí hãy cho biết khẩu hiệu hành động Đại hội đại biểu Đoàn TNCS Hồ Chí Minh Quân đội lần thứ XI, nhiệm kỳ 2025 - 2030:", options: ["A. “Thanh niên Quân đội - Bản lĩnh, tiên phong, đột phá, phát triển”", "B. “Thanh niên Quân đội - Trí tuệ, bản lĩnh, đột phá, phát triển”", "C. “Thanh niên Quân đội - Tự lực, tự cường, đột phá, phát triển”"], answer: 0 },
            { question: "Đoàn viên có mấy nhiệm vụ?", options: ["A. 3 nhiệm vụ.", "B. 4 nhiệm vụ.", "C. 5 nhiệm vụ."], answer: 0 },
            { question: "Đồng chí hãy cho biết độ tuổi để được xét kết nạp đoàn viên?", options: ["A. Thanh niên Việt Nam Từ 15 tuổi đến 30 tuổi", "B. Thanh niên Việt Nam Từ 16 tuổi đến 30 tuổi", "C. Cả 2 phương án trên đều đúng"], answer: 1 },
            { question: "Chi đoàn có bao nhiêu đoàn viên thì chỉ được bầu bí thư, phó bí thư?", options: ["A. Dưới 9 đoàn viên.", "B. Dưới 12 đoàn viên.", "C. Dưới 15 đoàn viên."], answer: 0 },
            { question: "Tại sao khi quá 30 tuổi, vẫn được tham gia sinh hoạt đoàn?", options: ["A. Có nguyện vọng tiếp tục sinh hoạt đoàn", "B. Làm công tác chuyên trách về đoàn", "C. Cả 2 phương án trên"], answer: 2 },
            { question: "Đại tướng Phan Văn Giang trao tặng bức tranh cho thanh niên Quân đội tại Đại hội XI mang dòng chữ nào?", options: ["A. “Trung thành, bản lĩnh, đột phá, sáng tạo, xung kích, kiên cường - Xứng danh “Bộ đội Cụ Hồ” thời kỳ mới”.", "B. “Trí tuệ, bản lĩnh, đột phá, sáng tạo, xung kích, kiên cường - Xứng danh “Bộ đội Cụ Hồ” trong kỷ nguyên mới”.", "C. “Trung thành, bản lĩnh, đổi mới, sáng tạo, xung kích, dũng cảm - Xứng danh “Bộ đội Cụ Hồ” thời kỳ mới”."], answer: 2 },
            { question: "Khẩu hiệu “Sống chiến đấu, lao động và học tập theo gương Bác Hồ vĩ đại” được chọn vào thời gian nào?", options: ["A. Tháng 12/1974", "B. Tháng 12/1975", "C. Tháng 12/1976"], answer: 2 },
            { question: "Đồng chí hãy cho biết phương châm Đại hội đại biểu Đảng bộ Quân đội lần thứ XII, nhiệm kỳ 2025-2030:", options: ["A. “Đoàn kết - Dân chủ - Kỷ cương - Kiên định - Đột phá - Phát triển”", "B. “Đoàn kết - Đột phá - Kỷ cương - Kiên định - Dân chủ - Phát triển”", "C. “Đoàn kết - Đột phá - Kỷ cương - Kiên định - Dân chủ - Quyết thắng”"], answer: 0 },
            { question: "Đồng chí hãy cho biết chủ đề Đại hội đại biểu Đoàn TNCS Hồ Chí Minh Quân đội lần thứ XI, nhiệm kỳ 2025 - 2030:", options: ["A. “Thanh niên Quân đội bản lĩnh, tiên phong, đột phá, phát triển, xứng danh Bộ đội Cụ Hồ, tự tin vững bước vào kỷ nguyên mới”", "B. “Thanh niên Quân đội bản lĩnh, trí tuệ, đột phá, phát triển, xứng danh Bộ đội Cụ Hồ, tự tin vững bước vào kỷ nguyên mới”", "C. “Thanh niên Quân đội bản lĩnh, tiên phong, tự tin, phát triển, xứng danh Bộ đội Cụ Hồ, tự tin vững bước vào kỷ nguyên mới”"], answer: 0 },
            { question: "Trong Đại hội đại biểu toàn quốc lần thứ XIV của Đảng đã bầu ra bao nhiêu đồng chí là Ủy viên Bộ Chính trị?", options: ["A. 17", "B. 18", "C. 19"], answer: 2 },
            { question: "Trong quân đội, trợ lý thanh niên và Ban công tác thanh niên được tổ chức từ cấp nào trở lên?", options: ["A. Cấp sư đoàn và tương đương trở lên", "B. Cấp trung đoàn, lữ đoàn và tương đương trở lên", "C. Cấp tiểu đoàn và tương đương trở lên"], answer: 1 },
            { question: "Người được kết nạp vào đoàn tối thiểu có trình độ học vấn:", options: ["A. Tiểu học.", "B. Vận dụng linh hoạt đối với thanh niên dân tộc thiểu số, vùng đặc biệt khó khăn.", "C. Cả 2 phương án trên"], answer: 2 },
            { question: "Giải thưởng Tuổi trẻ sáng tạo trong Quân đội được triển khai từ bao giờ?", options: ["A. Từ năm 1999", "B. Từ năm 2000", "C. Từ năm 2001"], answer: 1 },
            { question: "Đồng chí cho biết Ngày truyền thống Kho KV1?", options: ["A. 15/3/1951", "B. 15/3/1952", "C. 15/3/1953"], answer: 2 },
            { question: "Hãy cho biết nội dung “5 vững” theo phương châm của Tổng Bí thư Tô Lâm:", options: ["A. “Chính trị vững - Kỷ luật vững - Công nghệ vững - Nghệ thuật quân sự vững - Đời sống bộ đội vững”", "B. “Quân sự vững - Chính trị vững - Hậu cần vững - Kỹ thuật vững - Đời sống bộ đội vững”", "C. “Tâm lý vững - Kỷ luật vững - Chính trị vững - Nghệ thuật quân sự vững - Đời sống bộ đội vững”"], answer: 0 },
            { question: "Chi đoàn có bao nhiêu đoàn viên thì được bầu ban chấp hành?", options: ["A. Dưới 9 đoàn viên.", "B. Từ 9 đoàn viên trở lên", "C. Từ 5 đoàn viên"], answer: 1 },
            { question: "Hãy cho biết tác giả, thời gian ra đời mẫu Huy hiệu Đoàn TNCS Hồ Chí Minh?", options: ["A. Họa sĩ Tô Ngọc Vân; năm 1952", "B. Họa sĩ Huỳnh Văn Thuận; năm 1951", "C. Họa sĩ Nguyễn Tường Lân; năm 1954"], answer: 1 },
            { question: "Bí thư Trung ương Đoàn đầu tiên của Việt Nam là ai?", options: ["A. Đồng chí Nguyễn Lam.", "B. Đồng chí Lê Duẩn.", "C. Đồng chí Lý Tự Trọng."], answer: 0 },
            { question: "Ban Chấp hành chi đoàn, chi đoàn cơ sở và Đoàn cơ sở định kỳ bao lâu phải họp một lần?", options: ["A. Một tuần", "B. Một tháng", "C. Một quý"], answer: 1 },
            { question: "Đồng chí cho biết Cục Quân khí được thành lập vào thời gian nào?", options: ["A. 22/12/1944.", "B. 22/4/2003.", "C. 16/9/1951."], answer: 2 },
            { question: "Đơn vị có bao nhiêu đoàn viên trở lên được thành lập chi đoàn?", options: ["A. 3 đoàn viên", "B. 5 đoàn viên", "C. 9 đoàn viên"], answer: 0 },
            { question: "Bác Hồ nói câu “Nhiệm vụ của thanh niên không phải là đòi hỏi Nước nhà đã cho mình những gì...” vào ngày nào?", options: ["A. Ngày 26/03/1931.", "B. Ngày 02/09/1945.", "C. Ngày 19/01/1955."], answer: 2 },
            { question: "Câu nói “Đâu Đảng cần thanh niên có, việc gì khó thanh niên làm” được Bác Hồ căn dặn tại Đại hội Đoàn toàn quốc lần thứ mấy?", options: ["A. Lần thứ nhất", "B. Lần thứ hai", "C. Lần thứ ba"], answer: 2 },
            { question: "Chủ tịch Hồ Chí Minh đã đến dự Đại hội Đoàn toàn quốc lần thứ mấy?", options: ["A. Đại hội lần thứ I và lần III.", "B. Đại hội lần thứ II và lần thứ III", "C. Đại hội lần thứ II và lần thứ IV."], answer: 1 }
        ];

        function App() {
            const [questions, setQuestions] = useState(initialQuestionsData);
            const [view, setView] = useState('HOME'); 

            // --- THÊM TRẠNG THÁI CHỌN SỐ LƯỢNG CÂU ---
            const [quizLength, setQuizLength] = useState(40);

            const [activeQuestions, setActiveQuestions] = useState([]);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});

            const [showAddModal, setShowAddModal] = useState(false);
            const [newQuestionText, setNewQuestionText] = useState('');
            const [newOptions, setNewOptions] = useState(['', '', '']);
            const [newCorrectAnswer, setNewCorrectAnswer] = useState(0);

            const shuffleArray = (array) => {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            };

            const startQuiz = () => {
                const shuffled = shuffleArray(questions);
                // Bốc đúng số lượng câu hỏi người dùng đã chọn
                setActiveQuestions(shuffled.slice(0, quizLength));
                setCurrentQuestion(0);
                setScore(0);
                setUserAnswers({}); 
                setView('QUIZ');
            };

            const handleAnswerSelect = (index) => {
                setUserAnswers({ ...userAnswers, [currentQuestion]: index });
            };

            const handleNextQuestion = () => {
                if (currentQuestion < activeQuestions.length - 1) {
                setCurrentQuestion(currentQuestion + 1);
                }
            };

            const handlePrevQuestion = () => {
                if (currentQuestion > 0) {
                setCurrentQuestion(currentQuestion - 1);
                }
            };

            const submitQuiz = () => {
                const answeredCount = Object.keys(userAnswers).length;
                if (answeredCount < activeQuestions.length) {
                const confirmSubmit = window.confirm(`Đồng chí mới làm ${answeredCount}/${activeQuestions.length} câu. Có chắc chắn muốn nộp bài không?`);
                if (!confirmSubmit) return;
                }

                let finalScore = 0;
                activeQuestions.forEach((q, idx) => {
                if (userAnswers[idx] === q.answer) finalScore++;
                });
                setScore(finalScore);
                setView('RESULT');
            };

            const saveNewQuestion = () => {
                if (!newQuestionText.trim() || newOptions.some(opt => !opt.trim())) {
                alert("Vui lòng điền đầy đủ câu hỏi và các đáp án!");
                return;
                }
                const newQuestion = {
                question: newQuestionText,
                options: newOptions,
                answer: newCorrectAnswer
                };
                setQuestions([...questions, newQuestion]);
                
                setNewQuestionText('');
                setNewOptions(['', '', '']);
                setNewCorrectAnswer(0);
                setShowAddModal(false);
            };

            const deleteQuestion = (idx) => {
                if(window.confirm("Chắc chắn muốn xóa câu này?")) {
                    const newQs = [...questions];
                    newQs.splice(idx, 1);
                    setQuestions(newQs);
                }
            };

            const answeredCount = Object.keys(userAnswers).length;

            return (
                <div className="min-h-screen flex flex-col pb-20 sm:pb-0 font-sans text-slate-800">
                
                {/* Header PC */}
                <nav className="hidden sm:flex bg-white/80 backdrop-blur-xl border-b border-slate-200 sticky top-0 z-40">
                    <div className="max-w-5xl mx-auto px-6 h-16 w-full flex items-center justify-between">
                    <div className="flex items-center gap-2 font-bold text-lg cursor-pointer" onClick={() => setView('HOME')}>
                        <i className="fa-solid fa-award text-blue-600 text-xl"></i>
                        <span>Đoàn TNCS HCM 2026</span>
                    </div>
                    
                    <div className="flex items-center gap-2">
                        <button onClick={() => setView('HOME')} className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all ${['HOME', 'QUIZ', 'RESULT', 'REVIEW'].includes(view) ? 'bg-blue-100 text-blue-700' : 'hover:bg-slate-100'}`}>
                        <i className="fa-solid fa-home mr-2"></i> Trắc Nghiệm
                        </button>
                        <button onClick={() => setView('MANAGE')} className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all ${view === 'MANAGE' ? 'bg-blue-100 text-blue-700' : 'hover:bg-slate-100'}`}>
                        <i className="fa-solid fa-cog mr-2"></i> Cài Đặt
                        </button>
                    </div>
                    </div>
                </nav>

                <main className="flex-1 flex items-start justify-center p-4 py-6">
                    <div className="w-full max-w-3xl">
                    
                    {/* TRANG CHỦ */}
                    {view === 'HOME' && (
                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 text-center animate-fade-in mt-4">
                            <div className="w-24 h-24 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                                <i className="fa-solid fa-book-open text-4xl"></i>
                            </div>
                            <h2 className="text-2xl sm:text-4xl font-bold text-slate-800 mb-4">Kiến thức Cán bộ Đoàn</h2>
                            <p className="text-slate-500 mb-8 max-w-md mx-auto">
                                Bộ đề hiện có <b className="text-blue-600">{questions.length}</b> câu hỏi. Đề thi sẽ tự động xáo trộn mỗi lần bắt đầu.
                            </p>

                            {/* --- PHẦN SOẠN ĐỀ --- */}
                            <div className="mb-8 bg-slate-50/80 p-5 rounded-2xl border border-slate-100 max-w-md mx-auto shadow-sm">
                                <label className="block text-sm font-bold text-slate-700 mb-3 uppercase tracking-wider">
                                    <i className="fa-solid fa-sliders mr-2 text-blue-500"></i>Chọn số lượng câu hỏi:
                                </label>
                                <div className="flex justify-center gap-2 flex-wrap">
                                    {[10, 20, 30, questions.length].map(num => (
                                        <button
                                            key={num}
                                            onClick={() => setQuizLength(num)}
                                            className={`px-4 py-2.5 rounded-xl font-bold transition-all duration-300 ${quizLength === num ? 'bg-blue-600 text-white shadow-md transform scale-105' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'}`}
                                        >
                                            {num === questions.length ? 'Tất cả' : `${num} câu`}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <button onClick={startQuiz} className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-8 py-4 rounded-2xl font-bold text-lg hover:shadow-lg hover:shadow-blue-500/40 hover:-translate-y-1 transition-all duration-300 w-full sm:w-auto">
                                <i className="fa-solid fa-play-circle mr-2"></i> Bắt đầu thi ngay
                            </button>
                        </div>
                    )}

                    {/* QUIZ */}
                    {view === 'QUIZ' && (
                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in mt-2">
                            {/* --- THANH TIẾN ĐỘ CHẤM TRÒN --- */}
                            <div className="bg-slate-50 border-b border-slate-100 p-4 sm:p-6 shadow-sm z-10 relative">
                                <div className="flex justify-between items-center mb-4">
                                    <span className="font-bold text-slate-600 text-sm uppercase tracking-wider">
                                        <i className="fa-solid fa-list-check mr-2 text-blue-500"></i>Tiến độ ({answeredCount}/{activeQuestions.length})
                                    </span>
                                    <span className="bg-blue-100 text-blue-800 px-4 py-1.5 rounded-full font-bold text-sm border border-blue-200">
                                        Câu {currentQuestion + 1}
                                    </span>
                                </div>
                                <div className="flex gap-2.5 flex-wrap max-h-[120px] overflow-y-auto p-1 scrollbar-hide">
                                    {activeQuestions.map((_, idx) => {
                                        const isAnswered = userAnswers[idx] !== undefined;
                                        const isCurrent = idx === currentQuestion;
                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => setCurrentQuestion(idx)}
                                                title={`Đi tới câu ${idx + 1}`}
                                                className={`w-3.5 h-3.5 rounded-full transition-all duration-300 ${isAnswered ? 'bg-blue-600 shadow-sm shadow-blue-500/50' : 'bg-slate-300'} ${isCurrent ? 'ring-4 ring-blue-200 ring-offset-2 scale-125' : 'hover:scale-110'}`}
                                            />
                                        )
                                    })}
                                </div>
                                <div className="mt-4 flex gap-4 text-xs font-semibold text-slate-500 justify-end">
                                    <span className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-blue-600 shadow-sm"></div> Đã chọn</span>
                                    <span className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-slate-300"></div> Chưa chọn</span>
                                </div>
                            </div>
                            
                            <div className="p-6 sm:p-8">
                                <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mb-8 leading-relaxed">
                                    {activeQuestions[currentQuestion].question}
                                </h2>

                                <div className="space-y-4">
                                    {activeQuestions[currentQuestion].options.map((opt, idx) => {
                                        const isSelected = userAnswers[currentQuestion] === idx;
                                        return (
                                            <button key={idx} onClick={() => handleAnswerSelect(idx)} className={`w-full text-left p-4 sm:p-5 rounded-2xl border-2 transition-all duration-200 flex items-center group ${isSelected ? 'bg-blue-600 border-blue-600 text-white shadow-lg shadow-blue-500/25 transform scale-[1.01]' : 'bg-white border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-700'}`}>
                                                <div className={`w-6 h-6 rounded-full border-2 mr-4 flex items-center justify-center shrink-0 transition-colors ${isSelected ? 'border-white bg-blue-500' : 'border-slate-300 group-hover:border-blue-400'}`}>
                                                    {isSelected && <div className="w-2.5 h-2.5 rounded-full bg-white"></div>}
                                                </div>
                                                <span className="font-medium text-base sm:text-lg">{opt}</span>
                                            </button>
                                        )
                                    })}
                                </div>

                                <div className="flex justify-between mt-10 pt-6 border-t border-slate-100">
                                    <button onClick={handlePrevQuestion} disabled={currentQuestion === 0} className="px-5 py-3.5 rounded-xl font-bold bg-slate-100 text-slate-600 disabled:opacity-50 hover:bg-slate-200 transition-colors flex items-center">
                                        <i className="fa-solid fa-chevron-left mr-2"></i>Câu trước
                                    </button>
                                    
                                    {currentQuestion === activeQuestions.length - 1 ? (
                                        <button onClick={submitQuiz} className="px-6 py-3.5 rounded-xl font-bold bg-gradient-to-r from-green-500 to-emerald-600 text-white hover:shadow-lg hover:shadow-green-500/30 transition-all transform hover:-translate-y-0.5 flex items-center">
                                            Nộp bài<i className="fa-solid fa-paper-plane ml-2"></i>
                                        </button>
                                    ) : (
                                        <button onClick={handleNextQuestion} className="px-6 py-3.5 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-700 hover:shadow-lg hover:shadow-blue-600/30 transition-all transform hover:-translate-y-0.5 flex items-center">
                                            Câu tiếp<i className="fa-solid fa-chevron-right ml-2"></i>
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* RESULT */}
                    {view === 'RESULT' && (
                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 text-center animate-fade-in mt-4">
                            <i className="fa-solid fa-trophy text-6xl text-yellow-500 mb-4"></i>
                            <h2 className="text-3xl font-bold text-slate-800 mb-2">Đã hoàn thành!</h2>
                            <p className="text-slate-500 mb-6">Kết quả bài thi của bạn</p>
                            <div className="text-6xl font-black text-blue-600 mb-8">{score}<span className="text-3xl text-slate-400">/{activeQuestions.length}</span></div>
                            <div className="flex flex-col gap-3 max-w-xs mx-auto">
                                <button onClick={() => setView('REVIEW')} className="w-full py-3 bg-slate-100 text-slate-700 font-bold rounded-xl"><i className="fa-solid fa-eye mr-2"></i>Xem chi tiết bài làm</button>
                                <button onClick={startQuiz} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl"><i className="fa-solid fa-rotate-right mr-2"></i>Thi lại ngẫu nhiên</button>
                            </div>
                        </div>
                    )}

                    {/* REVIEW */}
                    {view === 'REVIEW' && (
                        <div className="animate-fade-in">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-xl font-bold">Chi tiết bài làm</h2>
                                <button onClick={() => setView('RESULT')} className="bg-slate-200 px-4 py-2 rounded-xl text-sm font-bold">Quay lại</button>
                            </div>
                            <div className="space-y-4">
                                {activeQuestions.map((q, idx) => {
                                    const uAns = userAnswers[idx];
                                    const isCorrect = uAns === q.answer;
                                    return (
                                        <div key={idx} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                            <h3 className="font-bold mb-4"><span className={`px-2 py-1 text-xs text-white rounded mr-2 ${isCorrect ? 'bg-green-500': 'bg-red-500'}`}>Q{idx+1}</span>{q.question}</h3>
                                            <div className="space-y-2">
                                                {q.options.map((opt, oIdx) => {
                                                    let style = "bg-slate-50 text-slate-600 opacity-60";
                                                    let icon = "";
                                                    if(oIdx === q.answer) {
                                                        style = "bg-green-100 text-green-800 font-bold border-green-300 border";
                                                        icon = <i className="fa-solid fa-check-circle text-green-600 float-right mt-1"></i>;
                                                    } else if(oIdx === uAns && !isCorrect) {
                                                        style = "bg-red-100 text-red-800 border-red-300 border";
                                                        icon = <i className="fa-solid fa-times-circle text-red-600 float-right mt-1"></i>;
                                                    }
                                                    return <div key={oIdx} className={`p-3 rounded-lg text-sm ${style}`}>{opt} {icon}</div>
                                                })}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    )}

                    {/* MANAGE (iOS Settings Style) */}
                    {view === 'MANAGE' && (
                        <div className="animate-fade-in space-y-6 max-w-2xl mx-auto mt-2">
                            <h2 className="text-3xl font-bold text-slate-800 px-2">Cài đặt</h2>
                            
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-4 flex items-center gap-4 border-b border-slate-100">
                                    <div className="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center"><i className="fa-solid fa-file-lines text-lg"></i></div>
                                    <div>
                                        <h3 className="font-bold">Tổng số câu hỏi</h3>
                                        <p className="text-sm text-slate-500">{questions.length} câu trong dữ liệu</p>
                                    </div>
                                </div>
                                <button onClick={() => setShowAddModal(true)} className="w-full p-4 flex items-center justify-between border-b border-slate-100 active:bg-slate-50">
                                    <div className="flex items-center gap-3 font-semibold text-blue-600"><i className="fa-solid fa-plus-circle text-lg"></i> Thêm câu hỏi mới</div>
                                    <i className="fa-solid fa-chevron-right text-slate-300"></i>
                                </button>
                                <button onClick={() => {if(window.confirm("Khôi phục 40 câu gốc?")) setQuestions(initialQuestionsData)}} className="w-full p-4 flex items-center justify-between active:bg-slate-50">
                                    <div className="flex items-center gap-3 font-semibold text-red-500"><i className="fa-solid fa-rotate-left text-lg"></i> Khôi phục đề gốc</div>
                                    <i className="fa-solid fa-chevron-right text-slate-300"></i>
                                </button>
                            </div>

                            <h3 className="font-bold text-slate-500 px-4 uppercase text-sm mt-6">Kho dữ liệu</h3>
                            <div className="space-y-3">
                                {questions.map((q, idx) => (
                                    <details key={idx} className="bg-white rounded-2xl shadow-sm border border-slate-200 group [&_summary::-webkit-details-marker]:hidden">
                                        <summary className="p-4 font-semibold text-slate-800 cursor-pointer flex items-start gap-3 outline-none">
                                            <span className="bg-slate-100 px-2 py-0.5 rounded text-sm text-slate-500 shrink-0">{idx + 1}</span>
                                            <span className="flex-1">{q.question}</span>
                                            <i className="fa-solid fa-chevron-down text-slate-400 group-open:rotate-180 transition mt-1"></i>
                                        </summary>
                                        <div className="p-4 border-t border-slate-100 space-y-2 text-sm bg-slate-50/50 rounded-b-2xl">
                                            {q.options.map((o, oIdx) => (
                                                <div key={oIdx} className={`p-2 rounded ${oIdx === q.answer ? 'text-green-700 font-bold bg-green-100' : 'text-slate-600'}`}>
                                                    {oIdx === q.answer && <i className="fa-solid fa-check mr-2"></i>}{o}
                                                </div>
                                            ))}
                                            <div className="pt-3 mt-3 border-t border-slate-200 flex justify-end">
                                                <button onClick={() => deleteQuestion(idx)} className="text-red-500 text-sm font-bold bg-red-50 px-4 py-2 rounded-lg hover:bg-red-100"><i className="fa-solid fa-trash-can mr-2"></i>Xóa câu này</button>
                                            </div>
                                        </div>
                                    </details>
                                ))}
                            </div>
                        </div>
                    )}

                    </div>
                </main>

                {/* Bottom Bar Mobile */}
                <nav className="sm:hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-slate-200 pb-safe z-40">
                    <div className="flex justify-around items-center h-16">
                    <button onClick={() => setView('HOME')} className={`flex flex-col items-center gap-1 w-full h-full justify-center ${['HOME', 'QUIZ', 'RESULT', 'REVIEW'].includes(view) ? 'text-blue-600' : 'text-slate-400'}`}>
                        <i className="fa-solid fa-home text-xl"></i>
                        <span className="text-[10px] font-bold">Trang chủ</span>
                    </button>
                    <button onClick={() => setView('MANAGE')} className={`flex flex-col items-center gap-1 w-full h-full justify-center ${view === 'MANAGE' ? 'text-blue-600' : 'text-slate-400'}`}>
                        <i className="fa-solid fa-cog text-xl"></i>
                        <span className="text-[10px] font-bold">Cài đặt</span>
                    </button>
                    </div>
                </nav>

                {/* Modal Add */}
                {showAddModal && (
                    <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-4">
                        <div className="bg-white w-full max-w-xl rounded-3xl p-6 sm:p-8 animate-fade-in relative">
                            <button onClick={() => setShowAddModal(false)} className="absolute top-4 right-4 text-slate-400 text-xl"><i className="fa-solid fa-times"></i></button>
                            <h2 className="text-xl font-bold mb-6">Thêm câu hỏi mới</h2>
                            <textarea value={newQuestionText} onChange={(e) => setNewQuestionText(e.target.value)} placeholder="Nhập câu hỏi..." className="w-full border-2 border-slate-200 rounded-xl p-3 mb-4 h-24 focus:border-blue-500 outline-none"></textarea>
                            <div className="space-y-3 mb-6">
                                {newOptions.map((opt, idx) => (
                                    <div key={idx} className="flex items-center gap-2">
                                        <input type="radio" checked={newCorrectAnswer === idx} onChange={() => setNewCorrectAnswer(idx)} className="w-5 h-5" />
                                        <input type="text" value={opt} onChange={(e) => {const newOpts=[...newOptions]; newOpts[idx]=e.target.value; setNewOptions(newOpts);}} placeholder={`Đáp án ${idx+1}`} className="flex-1 border border-slate-200 p-2 rounded-lg outline-none focus:border-blue-500"/>
                                    </div>
                                ))}
                            </div>
                            <button onClick={saveNewQuestion} className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700">Lưu vào bộ đề</button>
                        </div>
                    </div>
                )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
