<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Quản Lý Kho Đạn Chuyên Nghiệp</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f172a; margin: 0; overflow: hidden; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        input:focus, button:focus, select:focus { outline: none; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .light-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; }

        .blueprint-bg {
            background-color: #f8fafc;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .tab-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .wh-tab.active { background: #2563eb; color: white; border-bottom: 2px solid #60a5fa; }
        
        .panel-section { display: none; }
        .panel-section.active { display: flex; flex-direction: column; }
        
        .svg-container svg text { user-select: none; pointer-events: none; }
        
        /* Highlight chính xác hình */
        .lot-shape { fill: #f8fafc; transition: fill 0.2s ease; cursor: pointer; }
        .lot-shape.active { fill: #dbeafe !important; }
        
        .ziczac-shape { fill: transparent; transition: fill 0.2s ease; cursor: pointer; }
        .ziczac-shape.active { fill: #dbeafe !important; }
        
        .modal-overlay { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="flex flex-col h-screen text-sm">

    <!-- HEADER -->
    <header class="bg-[#1e293b] text-white h-[56px] shrink-0 flex justify-between items-center px-4 border-b border-[#334155] z-30 shadow-md">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-1.5 rounded-lg shadow-lg">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            </div>
            <h1 class="font-black text-sm md:text-base tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 m-0 uppercase">Ammo Planner</h1>
        </div>

        <div class="flex gap-2 items-center">
            <select id="viewMode" onchange="triggerRender()" class="bg-[#0f172a] border border-[#334155] text-blue-400 text-xs font-bold rounded px-2 py-1.5 outline-none cursor-pointer">
                <option value="1">Dạng 1: Mặt Bằng Khu</option>
                <option value="2">Dạng 2: Mặt Cắt Ziczac</option>
            </select>
            <button onclick="document.getElementById('excelUpload').click()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded font-bold flex items-center gap-1.5 transition-colors text-xs shadow-md">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <span class="hidden sm:inline">Nhập Excel</span>
            </button>
            <input type="file" id="excelUpload" accept=".xlsx, .xls" class="hidden" onchange="importExcel(event)">
        </div>
    </header>

    <!-- TABS NHÀ KHO -->
    <div class="bg-[#0f172a] border-b border-[#334155] flex overflow-x-auto light-scroll shrink-0" id="warehouseTabs"></div>

    <!-- MAIN APP -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- SIDEBAR -->
        <aside class="w-full md:w-[380px] bg-[#1e293b] border-r border-[#334155] flex flex-col absolute md:relative z-20 h-full transition-transform duration-300 shadow-2xl md:shadow-none" id="sidebar">
            
            <div class="flex p-2 gap-1 bg-[#0f172a] shrink-0 border-b border-[#334155]">
                <button onclick="switchPanel('data')" id="tabData" class="tab-btn active flex-1 py-2 rounded font-bold text-xs border border-transparent bg-[#1e293b] text-slate-400 transition-colors uppercase">📦 Danh sách Lô</button>
                <button onclick="switchPanel('settings')" id="tabSettings" class="tab-btn flex-1 py-2 rounded font-bold text-xs border border-transparent bg-[#1e293b] text-slate-400 transition-colors uppercase">⚙️ Thiết Lập</button>
            </div>

            <!-- PANEL 1: DATA COMPACT -->
            <div id="panelData" class="panel-section active flex-1 overflow-hidden">
                <div class="p-2 border-b border-[#334155] flex justify-between items-center bg-[#0f172a] shrink-0">
                    <div class="text-[10px] font-bold text-slate-400 flex gap-2">
                        <span>Lô: <b id="kpiLots" class="text-white">0</b></span>
                        <span>Hòm: <b id="kpiBoxes" class="text-blue-400">0</b></span>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="deleteAllItems()" class="bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-2 py-1 rounded text-[10px] font-bold transition-all border border-red-500/30">
                            🗑 XÓA
                        </button>
                        <button onclick="openModal(null)" class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1 rounded text-[10px] font-bold transition-all shadow-md">
                            + THÊM LÔ
                        </button>
                    </div>
                </div>
                
                <div class="flex-1 overflow-y-auto p-2 space-y-1.5 pb-20 md:pb-2" id="dataContainer" onclick="clearHighlight(event)" style="min-height:0;"></div>
            </div>

            <!-- PANEL 2: SETTINGS -->
            <div id="panelSettings" class="panel-section flex-1 overflow-y-auto p-4 pb-20 md:pb-4" style="min-height:0;">
                <div class="bg-[#0f172a] p-3 rounded-lg border border-[#334155] mb-4">
                    <h3 class="text-[11px] font-black text-blue-400 mb-3 uppercase flex items-center gap-1">📏 Thiết lập Nhà Kho hiện tại</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="text-[9px] text-slate-400 font-bold block mb-1">Ngang (Cột)</label>
                            <input type="number" id="cfgMaxCols" onchange="updateConfig()" class="w-full bg-[#1e293b] text-white font-bold text-sm p-1.5 rounded outline-none border border-[#334155] text-center">
                        </div>
                        <div>
                            <label class="text-[9px] text-slate-400 font-bold block mb-1">Dọc (Dãy)</label>
                            <input type="number" id="cfgMaxRows" onchange="updateConfig()" class="w-full bg-[#1e293b] text-white font-bold text-sm p-1.5 rounded outline-none border border-[#334155] text-center">
                        </div>
                        <div>
                            <label class="text-[9px] text-slate-400 font-bold block mb-1">Cao (Hòm)</label>
                            <input type="number" id="cfgMaxHeight" onchange="updateConfig()" class="w-full bg-[#1e293b] text-white font-bold text-sm p-1.5 rounded outline-none border border-[#334155] text-center">
                        </div>
                    </div>
                </div>

                <div class="bg-[#0f172a] p-3 rounded-lg border border-[#334155] mb-4">
                    <h3 class="text-[11px] font-black text-emerald-400 mb-2 uppercase">🧠 Thuật toán Xếp</h3>
                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-xs font-bold text-white">Xếp ghép Lô (Chung hòm)</span>
                        <div class="relative w-10 h-5 rounded-full transition-colors shrink-0" id="toggleBg">
                            <input type="checkbox" id="cfgAllowMix" onchange="updateConfig()" class="sr-only">
                            <div class="absolute left-1 top-1 bg-white w-3 h-3 rounded-full transition-transform" id="toggleDot"></div>
                        </div>
                    </label>
                </div>

                <div class="bg-[#0f172a] p-3 rounded-lg border border-[#334155] mb-4">
                    <h3 class="text-[11px] font-black text-purple-400 mb-2 uppercase">📦 Bao gói mặc định</h3>
                    <div class="flex gap-2">
                        <input type="number" id="cfgDefaultPack" onchange="updateConfig()" class="w-1/2 bg-[#1e293b] text-white font-bold p-1.5 rounded outline-none border border-[#334155] text-center text-sm">
                        <button onclick="applyPackToAll()" class="w-1/2 bg-purple-600 hover:bg-purple-500 text-white text-[10px] font-bold rounded transition-colors">ĐỒNG BỘ MỌI LÔ</button>
                    </div>
                </div>
                
                <button onclick="downloadTemplate()" class="w-full mt-2 bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded text-[11px] font-bold border border-slate-600 transition-colors">
                    ⬇️ Tải File Mẫu Excel
                </button>
            </div>

            <div class="md:hidden absolute bottom-0 left-0 right-0 p-2 bg-[#1e293b] border-t border-[#334155] flex gap-2">
                <button onclick="toggleMobileSidebar()" class="w-full bg-red-500 text-white font-bold py-2 rounded text-xs shadow-lg">ĐÓNG BẢNG ĐIỀU KHIỂN</button>
            </div>
        </aside>

        <!-- CANVAS RIGHT -->
        <main class="flex-1 blueprint-bg overflow-auto relative flex flex-col" id="canvasWrapper" onclick="clearHighlight(event)">
            <button onclick="toggleMobileSidebar()" class="md:hidden fixed bottom-4 right-4 bg-blue-600 text-white p-3 rounded-full shadow-[0_0_15px_rgba(37,99,235,0.6)] z-40">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <div class="flex-1 p-4 md:p-8 flex flex-col items-center">
                <div id="svgContainer" class="w-full flex flex-col items-center gap-12 pb-16">
                    <!-- RENDER HERE -->
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="itemModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center opacity-0 transition-opacity">
        <div class="bg-[#1e293b] border border-[#334155] rounded-xl shadow-2xl w-[90%] max-w-[320px] p-5 transform scale-95 transition-transform" id="modalContent">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-black text-white" id="modalTitle">THÊM LÔ ĐẠN</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <input type="hidden" id="modalId">
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Loại Đạn</label>
                    <input type="text" id="modalType" class="w-full bg-[#0f172a] text-white border border-[#334155] p-2 rounded text-sm outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Mã Lô</label>
                    <input type="text" id="modalLot" class="w-full bg-[#0f172a] text-[#38bdf8] font-bold border border-[#334155] p-2 rounded text-sm outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Số Lượng (V)</label>
                        <input type="number" id="modalQty" class="w-full bg-[#0f172a] text-emerald-400 font-bold border border-[#334155] p-2 rounded text-sm outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Viên/Hòm</label>
                        <input type="number" id="modalPack" class="w-full bg-[#0f172a] text-purple-400 font-bold border border-[#334155] p-2 rounded text-sm outline-none focus:border-purple-500">
                    </div>
                </div>
            </div>
            <div class="flex gap-2 mt-5">
                <button onclick="closeModal()" class="flex-1 bg-slate-700 text-white font-bold py-2 rounded text-xs">HỦY</button>
                <button onclick="saveModal()" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded text-xs">LƯU LẠI</button>
            </div>
        </div>
    </div>

    <!-- Thông báo -->
    <div id="toastMsg" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white px-4 py-2 rounded shadow-lg font-bold text-xs transition-all duration-300 opacity-0 pointer-events-none -translate-y-4 z-50">
        ✅ <span id="toastText">Thành công!</span>
    </div>

    <script>
        // --- STATE ---
        const state = {
            warehouses: [
                {
                    id: 1, name: "Nhà Kho 1",
                    config: { maxHeight: 20, maxCols: 8, maxRows: 5, defaultPack: 10, allowMix: true },
                    items: []
                }
            ],
            activeWhId: 1,
            activeLotId: null
        };

        function getActiveWH() { return state.warehouses.find(w => w.id === state.activeWhId); }

        // --- QUẢN LÝ NHÀ KHO ---
        function renderWarehouseTabs() {
            const container = document.getElementById('warehouseTabs');
            let html = '';
            state.warehouses.forEach(w => {
                const isActive = w.id === state.activeWhId;
                const cls = isActive ? 'wh-tab active' : 'wh-tab text-slate-400 hover:text-white hover:bg-[#1e293b]';
                html += `
                    <div class="flex items-center shrink-0 ${cls} transition-colors cursor-pointer" onclick="switchWarehouse(${w.id})">
                        <span class="px-4 py-2 text-xs font-bold uppercase tracking-wider">${w.name}</span>
                        ${state.warehouses.length > 1 ? `<button onclick="deleteWarehouse(event, ${w.id})" class="pr-3 text-slate-500 hover:text-red-400">✕</button>` : ''}
                    </div>
                `;
            });
            html += `<button onclick="addWarehouse()" class="px-4 py-2 text-xs font-bold text-blue-400 hover:text-white hover:bg-blue-600 transition-colors uppercase">+ Thêm Nhà</button>`;
            container.innerHTML = html;
        }

        function switchWarehouse(id) {
            state.activeWhId = id; state.activeLotId = null;
            syncConfigToUI(); triggerRender();
        }

        function addWarehouse() {
            const newId = Date.now();
            state.warehouses.push({
                id: newId, name: `Nhà Kho ${state.warehouses.length + 1}`,
                config: { maxHeight: 20, maxCols: 8, maxRows: 5, defaultPack: 10, allowMix: true },
                items: []
            });
            switchWarehouse(newId);
        }

        function deleteWarehouse(e, id) {
            e.stopPropagation();
            if(confirm("Xóa nhà kho này và toàn bộ lô đạn bên trong?")) {
                state.warehouses = state.warehouses.filter(w => w.id !== id);
                if (state.activeWhId === id) state.activeWhId = state.warehouses[0].id;
                syncConfigToUI(); triggerRender();
            }
        }

        function syncConfigToUI() {
            const wh = getActiveWH(); if(!wh) return;
            document.getElementById('cfgMaxHeight').value = wh.config.maxHeight;
            document.getElementById('cfgMaxCols').value = wh.config.maxCols;
            document.getElementById('cfgMaxRows').value = wh.config.maxRows;
            document.getElementById('cfgDefaultPack').value = wh.config.defaultPack;
            document.getElementById('cfgAllowMix').checked = wh.config.allowMix;

            const toggleBg = document.getElementById('toggleBg');
            const toggleDot = document.getElementById('toggleDot');
            if (wh.config.allowMix) {
                toggleBg.classList.replace('bg-slate-600', 'bg-emerald-500');
                toggleDot.classList.replace('translate-x-1', 'translate-x-5');
            } else {
                toggleBg.classList.replace('bg-emerald-500', 'bg-slate-600');
                toggleDot.classList.replace('translate-x-5', 'translate-x-1');
            }
        }

        function updateConfig() {
            const wh = getActiveWH(); if(!wh) return;
            wh.config.maxHeight = Math.max(1, Number(document.getElementById('cfgMaxHeight').value));
            wh.config.maxCols = Math.max(1, Number(document.getElementById('cfgMaxCols').value));
            wh.config.maxRows = Math.max(1, Number(document.getElementById('cfgMaxRows').value));
            wh.config.defaultPack = Math.max(1, Number(document.getElementById('cfgDefaultPack').value));
            wh.config.allowMix = document.getElementById('cfgAllowMix').checked;
            syncConfigToUI(); triggerRender();
        }

        // --- ALGORITHM TÍNH TOÁN XẾP HÒM ĐÃ FIX ---
        function calculateStacks(wh) {
            const stacks = [];
            let curStack = []; 
            let curHeight = 0;
            const maxH = wh.config.maxHeight;

            wh.items.forEach(item => {
                let qty = Number(item.qty) || 0;
                let pack = Number(item.pack) || 1;
                if (qty <= 0) return;

                let fullBoxes = Math.floor(qty / pack);
                let leftover = qty % pack;
                let boxesToPlace = fullBoxes + (leftover > 0 ? 1 : 0);

                while (boxesToPlace > 0) {
                    if (curHeight >= maxH || (!wh.config.allowMix && curHeight > 0) || (curHeight > 0 && curStack.length >= 2)) {
                        stacks.push([...curStack]);
                        curStack = [];
                        curHeight = 0;
                    }

                    let spaceLeft = maxH - curHeight;
                    let take = Math.min(boxesToPlace, spaceLeft);
                    let leftToRecord = (leftover > 0 && boxesToPlace === take) ? leftover : 0;

                    curStack.push({ item: item, boxes: take, leftover: leftToRecord });
                    curHeight += take;
                    boxesToPlace -= take;
                }
            });
            if (curStack.length > 0) stacks.push([...curStack]);

            // Trả về cấu trúc cũ để render
            return stacks.map(stk => {
                let s = { i1: null, q1: 0, l1: 0, i2: null, q2: 0, l2: 0 };
                if (stk[0]) { s.i1 = stk[0].item; s.q1 = stk[0].boxes; s.l1 = stk[0].leftover; }
                if (stk[1]) { s.i2 = stk[1].item; s.q2 = stk[1].boxes; s.l2 = stk[1].leftover; }
                return s;
            });
        }

        // --- RENDER DANH SÁCH & CÔNG THỨC (CỘT TRÁI) ---
        function renderInputPanel() {
            const wh = getActiveWH();
            const container = document.getElementById('dataContainer');
            let html = '';

            if (!wh || wh.items.length === 0) {
                container.innerHTML = `<div class="text-center p-6 text-slate-500 text-xs italic border border-dashed border-[#334155] rounded mx-1 mt-4">Kho đang trống.<br>Bấm THÊM LÔ hoặc NHẬP EXCEL.</div>`;
                return;
            }

            wh.items.forEach((item, idx) => {
                const pck = Number(item.pack) || 1;
                const qty = Number(item.qty) || 0;
                
                const fullB = Math.floor(qty / pck);
                const left = qty % pck;
                
                let eqStr = `SL: ${qty} = ${fullB}h`;
                if (left > 0) eqStr += ` + ${left}`;

                const isActive = state.activeLotId === item.id;
                const activeClass = isActive ? "bg-blue-600/30 border-blue-400" : "bg-[#1e293b] border-[#334155] hover:border-slate-400";

                html += `
                    <div class="flex items-start gap-2 ${activeClass} border rounded p-2 transition-all cursor-pointer group shadow-sm" onclick="highlightLot(event, ${item.id})" ondblclick="openModal(${item.id})">
                        <div class="w-5 h-5 bg-slate-700 text-white rounded flex items-center justify-center text-[9px] font-bold shrink-0 mt-1">${idx + 1}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-baseline mb-1">
                                <span class="text-xs font-bold text-white truncate pr-2">${item.type}</span>
                                <span class="text-[10px] font-black text-[#38bdf8] truncate">${item.lot}</span>
                            </div>
                            <div class="text-[10.5px] text-slate-400 bg-[#0f172a] px-1.5 py-1 rounded inline-block border border-[#1e293b]">
                                <span class="text-slate-300 font-mono font-bold">${eqStr}</span>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="openModal(${item.id}); event.stopPropagation();" class="text-slate-400 hover:text-blue-400 p-0.5">✏️</button>
                            <button onclick="removeItem(${item.id}); event.stopPropagation();" class="text-slate-400 hover:text-red-400 p-0.5">🗑</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Tạo chuỗi công thức cho Overlay trên Bản Vẽ
        function generateLotEquation(lotId, houseStacks, maxH) {
            let counts = {};
            let totalBoxes = 0;
            let leftover = 0;
            houseStacks.forEach(stack => {
                if (stack.i1 && stack.i1.id === lotId) {
                    counts[stack.q1] = (counts[stack.q1] || 0) + 1;
                    totalBoxes += stack.q1;
                    if (stack.l1) leftover += stack.l1;
                }
                if (stack.i2 && stack.i2.id === lotId) {
                    counts[stack.q2] = (counts[stack.q2] || 0) + 1;
                    totalBoxes += stack.q2;
                    if (stack.l2) leftover += stack.l2;
                }
            });

            let parts = [];
            Object.keys(counts).sort((a,b)=>b-a).forEach(q => {
                if (counts[q] > 1) parts.push(`(${counts[q]}x${q})`);
                else parts.push(`${q}`);
            });
            
            let eq = parts.join('+');
            if (eq === `${totalBoxes}`) eq = ''; else eq = `${eq}=`;
            let lStr = leftover > 0 ? ` (+lẻ ${leftover}v)` : '';
            return `SL: ${eq}${totalBoxes}h${lStr}`;
        }

        // Vẽ Vòng tròn text
        function drawCircle(cx, cy, boxes, leftover, isTopRight=false, isMuted=false) {
            let stroke = isMuted ? "#94a3b8" : "#0f172a";
            let fill = isMuted ? "#94a3b8" : "#0f172a";
            let fw = isMuted ? "normal" : "900";
            
            let res = `<circle cx="${cx}" cy="${cy}" r="15" fill="white" stroke="${stroke}" stroke-width="1.5" />`;
            res += `<text x="${cx}" y="${cy+5}" font-size="14" font-weight="${fw}" text-anchor="middle" fill="${fill}">${boxes}</text>`;
            if (leftover > 0) {
                let tx = isTopRight ? cx - 18 : cx + 18;
                let ty = isTopRight ? cy - 8 : cy + 12;
                res += `<text x="${tx}" y="${ty}" font-size="11" font-weight="bold" font-style="italic" fill="#dc2626" text-anchor="${isTopRight?'end':'start'}">lẻ ${leftover}</text>`;
            }
            return res;
        }

        // --- RENDER CANVAS ---
        function renderDiagram() {
            const wh = getActiveWH();
            const container = document.getElementById('svgContainer');
            const viewMode = document.getElementById('viewMode').value;
            
            if (!wh || wh.items.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-lg shadow-sm border border-slate-200 text-slate-400 text-center flex flex-col items-center justify-center text-xs mt-10"><span class="text-4xl mb-2">📐</span>Khu vực bản vẽ trống.</div>`;
                return;
            }

            const maxC = wh.config.maxCols, maxR = wh.config.maxRows, maxH = wh.config.maxHeight;
            const stacks = calculateStacks(wh);
            let html = '';

            // ====== DẠNG 1: MẶT BẰNG LƯỚI ======
            if (viewMode === "1") {
                const CELL_W = 120, CELL_H = 80;
                const svgW = maxC * CELL_W, svgH = maxR * CELL_H;
                const capacity = maxC * maxR;
                const chunks = [];
                for(let i=0; i<stacks.length; i+=capacity) chunks.push(stacks.slice(i, i+capacity));

                chunks.forEach((chunk, chunkIdx) => {
                    let grid = Array(maxR).fill().map(() => Array(maxC).fill(null));
                    chunk.forEach((stk, idx) => {
                        let r = Math.floor(idx / maxC), c = idx % maxC;
                        if (r < maxR) grid[r][c] = {
                            topId: stk.i2 ? stk.i2.id : (stk.i1 ? stk.i1.id : null),
                            botId: stk.i1 ? stk.i1.id : null,
                            leftId: stk.i1 ? stk.i1.id : null,
                            rightId: stk.i2 ? stk.i2.id : (stk.i1 ? stk.i1.id : null),
                            stk: stk
                        };
                    });

                    let svgHtml = `<div class="relative bg-white shadow-xl rounded border border-slate-300 p-0 overflow-hidden w-max mx-auto mb-10">
                                    <div class="bg-slate-100 text-slate-600 text-center py-2 font-bold text-[10px] uppercase border-b border-slate-200">${wh.name} - Khu ${chunkIdx + 1}</div>
                                    <svg width="${svgW}" height="${svgH}" style="font-family: Arial, sans-serif;">`;
                    
                    // Lưới nét đứt mỏng tất cả các ô
                    svgHtml += `<g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3">`;
                    for (let c = 0; c <= maxC; c++) svgHtml += `<line x1="${c * CELL_W}" y1="0" x2="${c * CELL_W}" y2="${svgH}" />`;
                    for (let r = 0; r <= maxR; r++) svgHtml += `<line x1="0" y1="${r * CELL_H}" x2="${svgW}" y2="${r * CELL_H}" />`;
                    svgHtml += `</g>`;

                    // 1. Vẽ Fill Hình dáng Lô đạn
                    for (let r = 0; r < maxR; r++) {
                        for (let c = 0; c < maxC; c++) {
                            let cell = grid[r][c];
                            if (cell) {
                                let x = c * CELL_W, y = r * CELL_H;
                                let hl1 = state.activeLotId === cell.botId ? "active" : "";
                                let hl2 = state.activeLotId === cell.topId ? "active" : "";

                                if (cell.stk.i2) {
                                    // Polygon Trái Dưới
                                    svgHtml += `<polygon points="${x},${y} ${x},${y+CELL_H} ${x+CELL_W},${y+CELL_H}" class="lot-shape lot-${cell.botId} ${hl1}" onclick="highlightLot(event, ${cell.botId})" />`;
                                    // Polygon Phải Trên
                                    svgHtml += `<polygon points="${x},${y} ${x+CELL_W},${y} ${x+CELL_W},${y+CELL_H}" class="lot-shape lot-${cell.topId} ${hl2}" onclick="highlightLot(event, ${cell.topId})" />`;
                                } else {
                                    svgHtml += `<rect x="${x}" y="${y}" width="${CELL_W}" height="${CELL_H}" class="lot-shape lot-${cell.botId} ${hl1}" onclick="highlightLot(event, ${cell.botId})" />`;
                                }
                            }
                        }
                    }

                    // 2. Vẽ NÉT VIỀN ĐẬM PHÂN KHOẢNH LÔ
                    svgHtml += `<g stroke="#0f172a" stroke-width="3" stroke-linecap="square">`;
                    for (let r = 0; r < maxR; r++) {
                        for (let c = 0; c < maxC; c++) {
                            let cell = grid[r][c];
                            if (cell) {
                                let x = c * CELL_W, y = r * CELL_H;
                                
                                // Top
                                let topCell = r > 0 ? grid[r-1][c] : null;
                                if (!topCell || topCell.botId !== cell.topId) svgHtml += `<line x1="${x}" y1="${y}" x2="${x+CELL_W}" y2="${y}" />`;
                                
                                // Bottom
                                let botCell = r < maxR - 1 ? grid[r+1][c] : null;
                                if (!botCell || botCell.topId !== cell.botId) svgHtml += `<line x1="${x}" y1="${y+CELL_H}" x2="${x+CELL_W}" y2="${y+CELL_H}" />`;
                                
                                // Left
                                let leftCell = c > 0 ? grid[r][c-1] : null;
                                if (!leftCell || leftCell.rightId !== cell.leftId) svgHtml += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y+CELL_H}" />`;
                                
                                // Right
                                let rightCell = c < maxC - 1 ? grid[r][c+1] : null;
                                if (!rightCell || rightCell.leftId !== cell.rightId) svgHtml += `<line x1="${x+CELL_W}" y1="${y}" x2="${x+CELL_W}" y2="${y+CELL_H}" />`;
                                
                                // Chéo (Nếu 2 lô khác nhau)
                                if (cell.stk.i2 && cell.botId !== cell.topId) {
                                    svgHtml += `<line x1="${x}" y1="${y}" x2="${x+CELL_W}" y2="${y+CELL_H}" stroke-width="2" />`;
                                }
                            }
                        }
                    }
                    svgHtml += `</g>`;

                    // 3. Vẽ Số liệu vào Vòng tròn
                    for (let r = 0; r < maxR; r++) {
                        for (let c = 0; c < maxC; c++) {
                            let cell = grid[r][c];
                            if (cell) {
                                let stk = cell.stk;
                                let x = c * CELL_W, y = r * CELL_H;

                                if (stk.i2) {
                                    svgHtml += drawCircle(x + CELL_W*0.3, y + CELL_H*0.7, stk.q1, stk.l1, false);
                                    svgHtml += drawCircle(x + CELL_W*0.7, y + CELL_H*0.3, stk.q2, stk.l2, true);
                                } else {
                                    let isFull = (stk.q1 === maxH && stk.l1 === 0);
                                    svgHtml += drawCircle(x + CELL_W/2, y + CELL_H/2, stk.q1, stk.l1, false, isFull);
                                }
                            }
                        }
                    }

                    // 4. OVERLAY BẢNG THÔNG TIN LÔ
                    const lotBounds = {};
                    chunk.forEach((s, idx) => {
                        let r = Math.floor(idx / maxC), c = idx % maxC;
                        const proc = (i) => {
                            if(!i) return;
                            if(!lotBounds[i.id]) lotBounds[i.id] = { i, minR:99, maxR:-1, minC:99, maxC:-1 };
                            let b = lotBounds[i.id];
                            if(r<b.minR) b.minR=r; if(r>b.maxR) b.maxR=r; if(c<b.minC) b.minC=c; if(c>b.maxC) b.maxC=c;
                        };
                        proc(s.i1); proc(s.i2);
                    });

                    Object.values(lotBounds).forEach(b => {
                        let cx = (b.minC + b.maxC + 1)/2 * CELL_W;
                        let cy = (b.minR + b.maxR + 1)/2 * CELL_H;
                        
                        let eqStr = generateLotEquation(b.i.id, chunk, maxH);
                        let hlClass = state.activeLotId === b.i.id ? "border-blue-600 bg-blue-50/95" : "border-slate-800 bg-white/95";

                        svgHtml += `
                            <foreignObject x="${cx - 110}" y="${cy - 30}" width="220" height="60" class="pointer-events-none">
                                <div style="display:flex; justify-content:center; align-items:center; width:100%; height:100%;">
                                    <div class="${hlClass} transition-colors" style="border-width:1.5px; border-style:solid; padding:4px 8px; border-radius:6px; text-align:center; box-shadow:0 4px 6px rgba(0,0,0,0.1); max-width:95%;">
                                        <div style="font-size:11px; font-weight:bold; color:#1e293b; display:inline;">${b.i.type}</div>
                                        <div style="font-size:12px; font-weight:900; color:#2563eb; display:inline; margin-left:4px;">${b.i.lot}</div>
                                        <div style="font-size:10px; color:#475569; margin-top:2px;">${eqStr}</div>
                                    </div>
                                </div>
                            </foreignObject>
                        `;
                    });

                    svgHtml += `</svg></div>`;
                    html += svgHtml;
                });
            } 
            // ====== DẠNG 2: MẶT CẮT ZICZAC ======
            else {
                const COL_W = 100, MAX_COL_H = 260, BOX_H = MAX_COL_H / maxH, TOP_M = 40;
                const chunks = [];
                for(let i=0; i<stacks.length; i+=maxC) chunks.push(stacks.slice(i, i+maxC));

                chunks.forEach((chunk, chunkIdx) => {
                    const svgW = maxC * COL_W;
                    const svgH = TOP_M + MAX_COL_H + 90; // Khoảng trống cho bảng dưới

                    let svgHtml = `<div class="relative bg-white shadow-xl rounded border border-slate-300 p-0 overflow-hidden w-max mx-auto mb-10">
                                    <div class="bg-slate-100 text-slate-600 px-3 py-1.5 font-bold text-[10px] uppercase border-b border-slate-200">${wh.name} - Dãy ${chunkIdx + 1}</div>
                                    <svg width="${svgW}" height="${svgH}" style="font-family: Arial, sans-serif;">`;
                    
                    // Lưới ngang
                    svgHtml += `<g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3">`;
                    for (let i = 0; i <= 5; i++) svgHtml += `<line x1="0" y1="${TOP_M + (i * (MAX_COL_H/5))}" x2="${maxC * COL_W}" y2="${TOP_M + (i * (MAX_COL_H/5))}" />`;
                    svgHtml += `</g>`;

                    // 1. Highlight Box
                    chunk.forEach((col, i) => {
                        let x = i * COL_W;
                        let y = TOP_M + MAX_COL_H - ((col.q1+col.q2) * BOX_H);
                        let hlClass1 = state.activeLotId === col.i1?.id ? "active" : "";
                        let hlClass2 = state.activeLotId === col.i2?.id ? "active" : "";
                        let baseClass = (hlClass1 || hlClass2) ? "active" : "";
                        
                        svgHtml += `<rect x="${x}" y="${y}" width="${COL_W}" height="${(col.q1+col.q2)*BOX_H}" class="ziczac-shape ${baseClass}" onclick="highlightLot(event, ${col.i1?.id})" />`;
                    });

                    // 2. Đường Ziczac Mép ngoài
                    let profilePath = `M 0 ${TOP_M + MAX_COL_H}`;
                    chunk.forEach((col, i) => {
                        const y = TOP_M + MAX_COL_H - ((col.q1+col.q2) * BOX_H);
                        profilePath += ` L ${i*COL_W} ${y} L ${(i+1)*COL_W} ${y}`;
                    });
                    profilePath += ` L ${chunk.length*COL_W} ${TOP_M+MAX_COL_H} L ${maxC*COL_W} ${TOP_M+MAX_COL_H}`;
                    svgHtml += `<path d="${profilePath}" fill="transparent" stroke="#0f172a" stroke-width="2.5" class="pointer-events-none"/>`;

                    // 3. Cột & Text
                    chunk.forEach((col, i) => {
                        let x = i * COL_W;
                        let y = TOP_M + MAX_COL_H - ((col.q1+col.q2) * BOX_H);

                        svgHtml += `<g transform="translate(${x}, 0)" class="pointer-events-none">`;
                        svgHtml += `<line x1="${COL_W}" y1="${y}" x2="${COL_W}" y2="${TOP_M + MAX_COL_H}" stroke="#0f172a" stroke-width="1.5" />`;

                        if (col.i2) {
                            let midY = y + (col.q2 * BOX_H);
                            svgHtml += `<line x1="0" y1="${midY}" x2="${COL_W}" y2="${midY}" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,4"/>`;
                            
                            svgHtml += drawCircle(COL_W*0.5, y+(col.q2*BOX_H)/2, col.q2, col.l2, true);
                            svgHtml += drawCircle(COL_W*0.5, midY+(col.q1*BOX_H)/2, col.q1, col.l1, false);
                        } else if (col.q1 > 0) {
                            svgHtml += drawCircle(COL_W/2, y + (col.q1*BOX_H)/2, col.q1, col.l1, false);
                        }

                        // Text dưới gầm
                        svgHtml += `<g transform="translate(${COL_W/2}, ${TOP_M + MAX_COL_H + 20})">`;
                        if (col.i2) {
                            svgHtml += `
                                <text x="0" y="0" font-size="10" font-weight="bold" text-anchor="middle" fill="#475569">${col.i2.type}</text>
                                <text x="0" y="14" font-size="12" font-weight="900" text-anchor="middle" fill="#2563eb">${col.i2.lot}</text>
                                <line x1="-30" y1="22" x2="30" y2="22" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
                                <text x="0" y="36" font-size="10" font-weight="bold" text-anchor="middle" fill="#475569">${col.i1.type}</text>
                                <text x="0" y="50" font-size="12" font-weight="900" text-anchor="middle" fill="#2563eb">${col.i1.lot}</text>
                            `;
                        } else if (col.i1) {
                             svgHtml += `
                                <text x="0" y="10" font-size="10" font-weight="bold" text-anchor="middle" fill="#475569">${col.i1.type}</text>
                                <text x="0" y="26" font-size="12" font-weight="900" text-anchor="middle" fill="#2563eb">${col.i1.lot}</text>
                            `;
                        }
                        svgHtml += `</g></g>`;
                    });
                    
                    svgHtml += `<rect x="0" y="${TOP_M + MAX_COL_H}" width="${svgW}" height="3" fill="#0f172a" />`;
                    svgHtml += `</svg></div>`;
                    html += svgHtml;
                });
            }
            container.innerHTML = html;
        }

        // --- CÁC HÀM CẬP NHẬT CHUNG ---
        function updateKPIs() {
            const wh = getActiveWH();
            if(!wh) return;
            let tItems = 0; let tBoxes = 0;
            wh.items.forEach(i => {
                tItems += Number(i.qty) || 0;
                let full = Math.floor((Number(i.qty)||0) / (Number(i.pack)||1));
                let left = (Number(i.qty)||0) % (Number(i.pack)||1);
                tBoxes += full + (left > 0 ? 1 : 0); 
            });
            document.getElementById('kpiLots').innerText = wh.items.length;
            document.getElementById('kpiBoxes').innerText = tBoxes.toLocaleString('vi-VN');
        }

        function triggerRender() {
            renderWarehouseTabs();
            renderInputPanel();
            renderDiagram();
            updateKPIs();
        }

        // --- TƯƠNG TÁC LÔ ĐẠN ---
        function openModal(id) {
            const modal = document.getElementById('itemModal');
            const content = document.getElementById('modalContent');
            const wh = getActiveWH();
            
            if (id) {
                const item = wh.items.find(i => i.id === id);
                document.getElementById('modalTitle').innerText = "CHỈNH SỬA LÔ";
                document.getElementById('modalId').value = id;
                document.getElementById('modalType').value = item.type;
                document.getElementById('modalLot').value = item.lot;
                document.getElementById('modalQty').value = item.qty;
                document.getElementById('modalPack').value = item.pack;
            } else {
                document.getElementById('modalTitle').innerText = "THÊM LÔ MỚI";
                document.getElementById('modalId').value = "";
                document.getElementById('modalType').value = "";
                document.getElementById('modalLot').value = "";
                document.getElementById('modalQty').value = "";
                document.getElementById('modalPack').value = wh.config.defaultPack;
            }
            
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('itemModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function saveModal() {
            const wh = getActiveWH();
            const id = document.getElementById('modalId').value;
            const itemObj = {
                type: document.getElementById('modalType').value.trim() || 'Chưa Đặt Tên',
                lot: document.getElementById('modalLot').value.trim() || 'N/A',
                qty: Number(document.getElementById('modalQty').value) || 0,
                pack: Number(document.getElementById('modalPack').value) || wh.config.defaultPack
            };

            if (id) {
                const idx = wh.items.findIndex(i => i.id == id);
                if (idx > -1) wh.items[idx] = { ...wh.items[idx], ...itemObj };
            } else {
                wh.items.push({ id: Date.now(), ...itemObj });
            }
            closeModal(); triggerRender();
        }

        function removeItem(id) {
            if(confirm('Xóa lô đạn này?')) {
                const wh = getActiveWH();
                wh.items = wh.items.filter(i => i.id !== id);
                if(state.activeLotId === id) state.activeLotId = null;
                triggerRender();
            }
        }
        
        function deleteAllItems() {
            const wh = getActiveWH();
            if(confirm(`Xóa toàn bộ danh sách trong kho [${wh.name}]?`)) {
                wh.items = []; state.activeLotId = null; triggerRender();
            }
        }

        function applyPackToAll() {
            const wh = getActiveWH();
            const p = wh.config.defaultPack;
            if(confirm(`Đồng bộ quy cách [${p}] cho toàn bộ kho [${wh.name}]?`)) {
                wh.items.forEach(i => i.pack = p); triggerRender();
            }
        }

        function highlightLot(e, id) {
            e.stopPropagation();
            state.activeLotId = (state.activeLotId === id) ? null : id;
            triggerRender();
        }
        
        function clearHighlight(e) {
            if (state.activeLotId !== null) { state.activeLotId = null; triggerRender(); }
        }

        // --- EXCEL ---
        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            const wh = getActiveWH();
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});
                    
                    let c = 0;
                    for(let i = 1; i < json.length; i++) {
                        const row = json[i];
                        if(!row || !row[0]) continue; 
                        wh.items.push({
                            id: Date.now() + i,
                            type: String(row[0]).trim(),
                            lot: row[1] ? String(row[1]).trim() : "N/A",
                            qty: Number(row[2]) || 0,
                            pack: Number(row[3]) || wh.config.defaultPack
                        });
                        c++;
                    }
                    if(c > 0) { triggerRender(); showToast(`Đã nhập ${c} lô vào ${wh.name}`); }
                } catch (err) { alert("Lỗi đọc Excel."); }
                document.getElementById('excelUpload').value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        // --- GIAO DIỆN CHUNG ---
        function switchPanel(panelId) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active', 'text-white', 'border-[#3b82f6]');
                b.classList.add('text-slate-400', 'border-transparent');
            });
            document.querySelectorAll('.panel-section').forEach(p => p.classList.remove('active'));

            if (panelId === 'data') {
                document.getElementById('tabData').classList.add('active', 'text-white', 'border-[#3b82f6]');
                document.getElementById('tabData').classList.remove('text-slate-400', 'border-transparent');
                document.getElementById('panelData').classList.add('active');
            } else {
                document.getElementById('tabSettings').classList.add('active', 'text-white', 'border-[#3b82f6]');
                document.getElementById('tabSettings').classList.remove('text-slate-400', 'border-transparent');
                document.getElementById('panelSettings').classList.add('active');
                syncConfigToUI();
            }
        }

        function toggleMobileSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            document.getElementById('toastText').innerText = msg;
            toast.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none'), 2500);
        }

        window.onload = () => {
            syncConfigToUI(); triggerRender();
            if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('-translate-x-full');
        };
    </script>
</body>
</html>
