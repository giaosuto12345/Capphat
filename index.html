<!DOCTYPE html>
<html lang="vi" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Aura Reader V6</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    
    <!-- React & DOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- PDF.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

    <!-- IndexedDB -->
    <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>

    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --ios-blur-light: rgba(255, 255, 255, 0.85);
            --ios-blur-dark: rgba(28, 28, 30, 0.85);
        }
        
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* Themes (Màu nền đọc sách) */
        .theme-light { background-color: #FFFFFF; color: #1C1C1E; }
        .theme-sepia { background-color: #F8F1E3; color: #5B4636; }
        .theme-dark { background-color: #121212; color: #E5E5EA; }
        
        .glass-light { background: var(--ios-blur-light); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid rgba(0,0,0,0.1); }
        .glass-dark { background: var(--ios-blur-dark); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid rgba(255,255,255,0.1); }
        
        .spinner { border: 3px solid rgba(150,150,150,0.2); border-left-color: #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Smooth UI Transitions */
        .ui-transition { transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease; }
        .bottom-sheet { transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
    </style>
</head>
<body class="text-slate-900 bg-black">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const DB = {
            async saveBook(bookData) {
                const books = await this.getBooks();
                const newBooks = [bookData, ...books.filter(b => b.id !== bookData.id)];
                await idbKeyval.set('ar_library_v6', newBooks);
            },
            async getBooks() { return await idbKeyval.get('ar_library_v6') || []; },
            async deleteBook(id) {
                const books = await this.getBooks();
                await idbKeyval.set('ar_library_v6', books.filter(b => b.id !== id));
                await idbKeyval.del(`file_${id}`);
                await idbKeyval.del(`prog_${id}`);
                await idbKeyval.del(`prefs_${id}`);
            },
            async saveFile(bookId, data) { await idbKeyval.set(`file_${bookId}`, data); },
            async getFile(bookId) { return await idbKeyval.get(`file_${bookId}`); },
            async saveProgress(bookId, data) { await idbKeyval.set(`prog_${bookId}`, data); },
            async getProgress(bookId) { return await idbKeyval.get(`prog_${bookId}`); },
            async savePrefs(prefs) { await idbKeyval.set('ar_global_prefs', prefs); },
            async getPrefs() { 
                return await idbKeyval.get('ar_global_prefs') || { theme: 'light', fontSize: 18, lineHeight: 1.6, readMode: 'scroll' }; 
            }
        };

        const Icon = ({ name, size = 24, className = '' }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px; stroke:currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none;"></i>`;
                    iconRef.current.appendChild(tempDiv.firstChild);
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, size]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        const Loader = ({ text }) => (
            <div className="fixed inset-0 z-[9999] bg-black/80 backdrop-blur-md flex flex-col items-center justify-center text-white transition-opacity">
                <div className="spinner mb-4 w-10 h-10 border-4 border-white/20 border-l-white"></div>
                <h2 className="text-lg font-medium animate-pulse">{text}</h2>
            </div>
        );

        // BỘ LỌC TEXT CỰC MẠNH: Sửa lỗi PDF font rời rạc, khoảng trắng thừa
        const cleanExtractedText = (text) => {
            if (!text) return "";
            
            // 1. Chuẩn hóa Unicode
            let s = text.normalize('NFC');
            
            // 2. Ép các dấu rời rạc (do font VNI/TCVN3 cũ tạo ra) dính vào chữ cái đứng trước
            // Ví dụ: "nê´ u" -> "nếu", "câ´ p" -> "cấp"
            s = s.replace(/([a-zA-ZăâêôơưđĂÂÊÔƠƯĐ])\s+([´`'’~?\.])/g, '$1$2');
            
            // 3. Xóa khoảng trắng thừa trước các dấu chấm phẩy
            s = s.replace(/\s+([.,!?:;’”'"])/g, '$1');
            
            // 4. Gom nhiều khoảng trắng thành 1
            s = s.replace(/\s{2,}/g, ' ');
            
            return s.trim();
        };

        const extractPDFText = async (pdfDoc, pageNum) => {
            try {
                const page = await pdfDoc.getPage(pageNum);
                const textContentData = await page.getTextContent();
                let paragraphs = [];
                let currentPara = "";
                let lastY = -1;
                for (const item of textContentData.items) {
                    if (!item.str || item.str.trim() === '') continue;
                    let cleanStr = cleanExtractedText(item.str);
                    const itemY = item.transform[5];
                    if (lastY !== -1 && Math.abs(lastY - itemY) > 5) {
                        if (currentPara.match(/[.!?:"']$/) || cleanStr.match(/^[A-ZĐ]/)) {
                            paragraphs.push(currentPara);
                            currentPara = cleanStr;
                        } else {
                            currentPara += " " + cleanStr;
                        }
                    } else {
                        currentPara += (currentPara ? " " : "") + cleanStr;
                    }
                    lastY = itemY;
                }
                if (currentPara) paragraphs.push(currentPara);
                return paragraphs;
            } catch (err) {
                console.error("Lỗi trích xuất trang", pageNum, err);
                return [];
            }
        };

        const parsePDFOutline = async (pdfDoc) => {
            try {
                const outline = await pdfDoc.getOutline();
                if (!outline || outline.length === 0) return [];
                const map = [];
                const processItems = async (items, depth = 0) => {
                    for (const item of items) {
                        let pageIndex = -1;
                        if (typeof item.dest === 'string') pageIndex = await pdfDoc.getPageIndex(await pdfDoc.getDestination(item.dest));
                        else if (Array.isArray(item.dest)) {
                            try { pageIndex = await pdfDoc.getPageIndex(item.dest[0]); } catch(e){}
                        }
                        if (pageIndex !== -1) map.push({ title: item.title, page: pageIndex + 1, depth });
                        if (item.items && item.items.length > 0) await processItems(item.items, depth + 1);
                    }
                };
                await processItems(outline);
                return map;
            } catch (err) { return []; }
        };

        const processFile = async (file, onProgress) => {
            const ext = file.name.split('.').pop().toLowerCase();
            const bookId = 'book_' + Date.now();
            let meta = { id: bookId, title: file.name.replace(/\.(pdf|txt)$/i, ''), type: ext.toUpperCase(), cover: `hsl(${Math.random()*360}, 60%, 30%)`, totalPages: 0 };

            if (ext === 'pdf') {
                onProgress("Đang phân tích cấu trúc Mục lục PDF...");
                const arrayBuffer = await file.arrayBuffer();
                // Phải dùng slice(0) để bảo toàn arrayBuffer không bị webworker phá hủy
                const pdfDoc = await window.pdfjsLib.getDocument(new Uint8Array(arrayBuffer.slice(0))).promise;
                meta.totalPages = pdfDoc.numPages;
                meta.toc = await parsePDFOutline(pdfDoc);
                await DB.saveFile(bookId, arrayBuffer);
            } 
            await DB.saveBook(meta);
            return meta;
        };

        function App() {
            const [books, setBooks] = useState([]);
            const [activeBook, setActiveBook] = useState(null);
            const [sys, setSys] = useState({ isLoading: true, text: "Đang tải thư viện..." });
            const fileRef = useRef(null);

            useEffect(() => {
                DB.getBooks().then(res => { setBooks(res); setSys({isLoading: false}); }).catch(()=>setSys({isLoading:false}));
            }, []);

            const onUpload = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                e.target.value = '';
                try {
                    setSys({ isLoading: true, text: "Đang đọc file..." });
                    const newBook = await processFile(file, txt => setSys({isLoading: true, text: txt}));
                    setBooks(p => [newBook, ...p]);
                } catch (error) {
                    alert("Lỗi tải sách. File quá lớn hoặc bị hỏng.");
                    console.error(error);
                } finally { setSys({ isLoading: false }); }
            };

            return (
                <div className="w-full h-full relative bg-gray-50 dark:bg-black font-sans">
                    {sys.isLoading && <Loader text={sys.text} />}
                    
                    {!activeBook ? (
                        <div className="w-full h-full overflow-y-auto pt-[var(--safe-top)] px-[var(--safe-left)] pr-[var(--safe-right)] pb-20">
                            <div className="max-w-6xl mx-auto px-6 py-8">
                                <div className="flex justify-between items-end mb-10">
                                    <div>
                                        <h1 className="text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight">Thư viện</h1>
                                        <p className="text-slate-500 mt-2 font-medium">Đã lưu trữ {books.length} cuốn sách</p>
                                    </div>
                                    <button onClick={() => fileRef.current?.click()} className="bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-xl shadow-blue-500/30 transition-transform active:scale-90">
                                        <Icon name="plus" size={28} />
                                    </button>
                                </div>
                                
                                {books.length === 0 ? (
                                    <div className="text-center mt-32 text-slate-400">
                                        <Icon name="book-open" size={64} className="mx-auto mb-4 opacity-20" />
                                        <p>Chưa có sách nào. Bấm dấu + để thêm file PDF.</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-6">
                                        {books.map(b => (
                                            <div key={b.id} className="group relative">
                                                <div onClick={() => setActiveBook(b)} className="w-full aspect-[2/3] rounded-2xl shadow-lg overflow-hidden cursor-pointer active:scale-95 transition-all duration-300 flex flex-col justify-center items-center p-5 relative" style={{backgroundColor: b.cover}}>
                                                    <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                                                    <span className="absolute top-3 right-3 bg-white/20 backdrop-blur-md px-2 py-1 rounded text-[10px] font-bold text-white uppercase tracking-wider">{b.type}</span>
                                                    <h3 className="text-white font-serif font-bold text-center text-lg line-clamp-4 z-10 leading-snug drop-shadow-md">{b.title}</h3>
                                                </div>
                                                <button onClick={(e) => { e.stopPropagation(); DB.deleteBook(b.id).then(()=>setBooks(books.filter(x=>x.id!==b.id))); }} className="absolute -top-3 -right-3 w-10 h-10 bg-red-500 rounded-full flex items-center justify-center text-white shadow-lg md:opacity-0 group-hover:opacity-100 transition-opacity z-20">
                                                    <Icon name="trash-2" size={18}/>
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <input type="file" accept=".pdf" ref={fileRef} onChange={onUpload} className="hidden" />
                        </div>
                    ) : (
                        <ReaderEngine book={activeBook} onClose={() => setActiveBook(null)} />
                    )}
                </div>
            );
        }

        function ReaderEngine({ book, onClose }) {
            const [uiVisible, setUiVisible] = useState(true);
            const [showToc, setShowToc] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [currentPage, setCurrentPage] = useState(1);
            
            // Cài đặt đọc sách (Cá nhân hóa)
            const [prefs, setPrefs] = useState({ theme: 'light', fontSize: 20, lineHeight: 1.8 });

            useEffect(() => {
                DB.getProgress(book.id).then(prog => { if (prog && prog.page) setCurrentPage(prog.page); });
                DB.getPrefs().then(p => { if(p) setPrefs(p); });
            }, [book.id]);

            const updatePrefs = (newPrefs) => {
                const merged = {...prefs, ...newPrefs};
                setPrefs(merged);
                DB.savePrefs(merged);
            };

            const updatePage = (p) => {
                if (p < 1 || p > book.totalPages) return;
                setCurrentPage(p);
                DB.saveProgress(book.id, { page: p });
            };

            const handleTapCenter = () => {
                if (showSettings) setShowSettings(false);
                else setUiVisible(!uiVisible);
            };

            return (
                <div className={`w-full h-full relative theme-${prefs.theme} transition-colors duration-500`}>
                    
                    {/* KHU VỰC ĐỌC (Reflow Text) */}
                    <PDFTextReflow 
                        book={book} 
                        currentPage={currentPage} 
                        onPageChange={updatePage} 
                        onTapCenter={handleTapCenter}
                        prefs={prefs}
                    />

                    {/* HEADER (Top Bar) */}
                    <div className={`absolute top-0 w-full pt-[var(--safe-top)] z-40 ui-transition ${uiVisible ? 'translate-y-0 opacity-100' : '-translate-y-full opacity-0 pointer-events-none'}`}>
                        <div className={`${prefs.theme === 'dark' ? 'glass-dark' : 'glass-light'} flex justify-between items-center px-2 pb-2 pt-2 shadow-sm`}>
                            <button onClick={onClose} className="p-3 active:opacity-50"><Icon name="chevron-left" /></button>
                            <div className="text-center flex-1 px-4 truncate font-semibold text-sm opacity-80">{book.title}</div>
                            <button onClick={() => setShowToc(true)} className="p-3 active:opacity-50"><Icon name="list" /></button>
                        </div>
                    </div>

                    {/* FOOTER (Bottom Controls) */}
                    <div className={`absolute bottom-0 w-full pb-[var(--safe-bottom)] z-40 ui-transition ${uiVisible ? 'translate-y-0 opacity-100' : 'translate-y-full opacity-0 pointer-events-none'}`}>
                        <div className={`${prefs.theme === 'dark' ? 'glass-dark' : 'glass-light'} p-4 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]`}>
                            
                            {/* Điều hướng trang */}
                            <div className="flex items-center justify-between max-w-md mx-auto mb-4">
                                <button onClick={() => updatePage(currentPage - 1)} disabled={currentPage <= 1} className="p-3 bg-gray-500/10 rounded-full disabled:opacity-20"><Icon name="chevron-left" /></button>
                                <div className="text-center">
                                    <span className="font-mono font-bold text-sm">Trang {currentPage}</span>
                                    <div className="text-xs opacity-50 font-medium mt-1">/ {book.totalPages}</div>
                                </div>
                                <button onClick={() => updatePage(currentPage + 1)} disabled={currentPage >= book.totalPages} className="p-3 bg-gray-500/10 rounded-full disabled:opacity-20"><Icon name="chevron-right" /></button>
                            </div>

                            {/* Nút cài đặt */}
                            <div className="flex justify-center border-t border-gray-500/20 pt-4">
                                <button onClick={() => setShowSettings(true)} className="flex flex-col items-center opacity-70 hover:opacity-100 active:scale-95">
                                    <Icon name="type" size={20} className="mb-1" />
                                    <span className="text-[10px] font-bold uppercase tracking-wider">Hiển thị</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* MỤC LỤC SIDEBAR */}
                    <div className={`fixed inset-0 z-50 transition-opacity duration-300 ${showToc ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
                        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowToc(false)}></div>
                        <div className={`absolute top-0 left-0 w-5/6 max-w-[380px] h-full ${prefs.theme === 'dark' ? 'bg-[#1C1C1E]' : 'bg-white'} shadow-2xl flex flex-col transition-transform duration-400 cubic-bezier(0.32, 0.72, 0, 1) ${showToc ? 'translate-x-0' : '-translate-x-full'}`}>
                            <div className="p-6 pt-[calc(var(--safe-top)+24px)] border-b border-gray-500/20 font-bold text-2xl flex justify-between items-center">
                                <span>Mục lục</span>
                                <button onClick={() => setShowToc(false)} className="p-2 bg-gray-500/10 rounded-full active:scale-90"><Icon name="x" size={20}/></button>
                            </div>
                            <div className="flex-1 overflow-y-auto hide-scroll p-4">
                                {book.toc && book.toc.length > 0 ? (
                                    book.toc.map((item, idx) => (
                                        <div key={idx} onClick={() => { updatePage(item.page); setShowToc(false); setUiVisible(false); }} className={`py-4 px-2 text-sm border-b border-gray-500/10 cursor-pointer active:bg-gray-500/10 hover:bg-gray-500/5 flex justify-between items-center`} style={{ paddingLeft: `${(item.depth*16) + 8}px` }}>
                                            <span className="flex-1 pr-4 leading-relaxed font-medium">{item.title}</span>
                                            <span className="text-xs opacity-40 font-mono bg-gray-500/10 px-2 py-1 rounded">Tr. {item.page}</span>
                                        </div>
                                    ))
                                ) : (
                                    <div className="p-8 text-center text-sm opacity-50 flex flex-col items-center">
                                        <Icon name="file-question" size={48} className="mb-4 opacity-20" />
                                        <p>File PDF này không có mục lục kỹ thuật số được nhúng sẵn.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* BẢNG CÀI ĐẶT (Bottom Sheet) */}
                    <div className={`fixed inset-0 z-50 transition-opacity duration-300 ${showSettings ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
                        <div className="absolute inset-0 bg-black/40" onClick={() => setShowSettings(false)}></div>
                        <div className={`absolute bottom-0 left-0 w-full rounded-t-3xl ${prefs.theme === 'dark' ? 'bg-[#2C2C2E]' : 'bg-white'} shadow-[0_-10px_40px_rgba(0,0,0,0.1)] p-6 pb-[calc(var(--safe-bottom)+24px)] bottom-sheet ${showSettings ? 'translate-y-0' : 'translate-y-full'}`}>
                            <div className="w-12 h-1.5 bg-gray-500/30 rounded-full mx-auto mb-6"></div>
                            
                            {/* Themes */}
                            <div className="mb-8">
                                <p className="text-xs font-bold uppercase tracking-widest opacity-50 mb-3">Màu nền</p>
                                <div className="grid grid-cols-3 gap-3">
                                    <button onClick={()=>updatePrefs({theme: 'light'})} className={`py-3 rounded-xl border-2 font-medium ${prefs.theme==='light' ? 'border-blue-500 bg-white text-black' : 'border-transparent bg-gray-100 text-black'}`}>Sáng</button>
                                    <button onClick={()=>updatePrefs({theme: 'sepia'})} className={`py-3 rounded-xl border-2 font-medium ${prefs.theme==='sepia' ? 'border-blue-500 bg-[#F8F1E3] text-[#5B4636]' : 'border-transparent bg-[#F8F1E3] text-[#5B4636]'}`}>Giấy úa</button>
                                    <button onClick={()=>updatePrefs({theme: 'dark'})} className={`py-3 rounded-xl border-2 font-medium ${prefs.theme==='dark' ? 'border-blue-500 bg-black text-white' : 'border-transparent bg-gray-800 text-white'}`}>Tối</button>
                                </div>
                            </div>

                            {/* Cỡ chữ */}
                            <div className="mb-8">
                                <p className="text-xs font-bold uppercase tracking-widest opacity-50 mb-3">Cỡ chữ</p>
                                <div className="flex items-center gap-4 bg-gray-500/10 p-2 rounded-2xl">
                                    <button onClick={()=>updatePrefs({fontSize: Math.max(14, prefs.fontSize - 2)})} className="w-12 h-12 flex items-center justify-center rounded-xl bg-white dark:bg-black shadow-sm active:scale-95 text-xl">A-</button>
                                    <div className="flex-1 text-center font-mono font-bold text-lg">{prefs.fontSize}px</div>
                                    <button onClick={()=>updatePrefs({fontSize: Math.min(36, prefs.fontSize + 2)})} className="w-12 h-12 flex items-center justify-center rounded-xl bg-white dark:bg-black shadow-sm active:scale-95 text-xl">A+</button>
                                </div>
                            </div>

                             {/* Giãn dòng */}
                             <div className="mb-8">
                                <p className="text-xs font-bold uppercase tracking-widest opacity-50 mb-3">Giãn dòng</p>
                                <div className="flex items-center gap-4 bg-gray-500/10 p-2 rounded-2xl">
                                    <button onClick={()=>updatePrefs({lineHeight: 1.4})} className={`flex-1 h-12 flex items-center justify-center rounded-xl font-bold shadow-sm active:scale-95 ${prefs.lineHeight === 1.4 ? 'bg-white dark:bg-black' : ''}`}>Hẹp</button>
                                    <button onClick={()=>updatePrefs({lineHeight: 1.8})} className={`flex-1 h-12 flex items-center justify-center rounded-xl font-bold shadow-sm active:scale-95 ${prefs.lineHeight === 1.8 ? 'bg-white dark:bg-black' : ''}`}>Vừa</button>
                                    <button onClick={()=>updatePrefs({lineHeight: 2.2})} className={`flex-1 h-12 flex items-center justify-center rounded-xl font-bold shadow-sm active:scale-95 ${prefs.lineHeight === 2.2 ? 'bg-white dark:bg-black' : ''}`}>Rộng</button>
                                </div>
                            </div>

                            {/* Chế độ đọc */}
                             <div>
                                <p className="text-xs font-bold uppercase tracking-widest opacity-50 mb-3">Kiểu cuộn trang</p>
                                <div className="flex items-center gap-4 bg-gray-500/10 p-2 rounded-2xl">
                                    <button onClick={()=>updatePrefs({readMode: 'scroll'})} className={`flex-1 h-12 flex items-center justify-center rounded-xl font-bold shadow-sm active:scale-95 ${prefs.readMode === 'scroll' ? 'bg-white dark:bg-black' : ''}`}><Icon name="arrow-down" size={16} className="mr-2"/> Cuộn dọc</button>
                                    <button onClick={()=>updatePrefs({readMode: 'paged'})} className={`flex-1 h-12 flex items-center justify-center rounded-xl font-bold shadow-sm active:scale-95 ${prefs.readMode === 'paged' ? 'bg-white dark:bg-black' : ''}`}><Icon name="arrow-right" size={16} className="mr-2"/> Lật ngang</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function PDFTextReflow({ book, currentPage, onPageChange, onTapCenter, prefs }) {
            const [pdfDoc, setPdfDoc] = useState(null);
            const [pagesData, setPagesData] = useState([]); // Array: [{page: 1, paragraphs: []}]
            const [isExtracting, setIsExtracting] = useState(true);
            const [fetchingNext, setFetchingNext] = useState(false);
            const containerRef = useRef(null);
            const observerRef = useRef(null);

            // Nạp PDF vào bộ nhớ ảo
            useEffect(() => {
                let active = true;
                DB.getFile(book.id).then(async arrayBuffer => {
                    if (!active || !arrayBuffer) return;
                    try {
                        const pdf = await window.pdfjsLib.getDocument(new Uint8Array(arrayBuffer.slice(0))).promise;
                        if(active) setPdfDoc(pdf);
                    } catch(e) { console.error("Lỗi nạp PDF", e); }
                });
                return () => { active = false; pdfDoc && pdfDoc.destroy(); };
            }, [book.id]);

            // Trích xuất trang (Khởi tạo khi đổi Chapter)
            useEffect(() => {
                if (!pdfDoc) return;
                let active = true;
                
                const initPage = async () => {
                    setIsExtracting(true);
                    if (containerRef.current) {
                        containerRef.current.scrollTop = 0;
                        containerRef.current.scrollLeft = 0;
                    }
                    
                    const paras = await extractPDFText(pdfDoc, currentPage);
                    if (active) {
                        setPagesData([{ page: currentPage, paragraphs: paras }]);
                        setIsExtracting(false);
                    }
                };
                initPage();
                return () => { active = false; };
            }, [pdfDoc, currentPage]);

            // Tải ngầm trang tiếp theo (Infinite Scroll)
            const loadNextPage = useCallback(async () => {
                if (!pdfDoc || fetchingNext) return;
                const lastLoadedPage = pagesData.length > 0 ? pagesData[pagesData.length - 1].page : currentPage;
                if (lastLoadedPage >= book.totalPages) return;

                setFetchingNext(true);
                const nextPageNum = lastLoadedPage + 1;
                const paras = await extractPDFText(pdfDoc, nextPageNum);
                
                setPagesData(prev => {
                    if (prev.some(p => p.page === nextPageNum)) return prev;
                    return [...prev, { page: nextPageNum, paragraphs: paras }];
                });
                
                // Cập nhật Database ngầm (không đổi State currentPage để tránh reload)
                DB.saveProgress(book.id, { page: nextPageNum });
                setFetchingNext(false);
            }, [pdfDoc, fetchingNext, pagesData, book.id, book.totalPages, currentPage]);

            // Intersection Observer (Cuộn dọc)
            useEffect(() => {
                if (prefs.readMode !== 'scroll' || isExtracting || fetchingNext) return;
                
                const options = { root: containerRef.current, rootMargin: '600px', threshold: 0 };
                const callback = (entries) => {
                    if (entries[0].isIntersecting) loadNextPage();
                };
                
                const observer = new IntersectionObserver(callback, options);
                if (observerRef.current) observer.observe(observerRef.current);
                
                return () => observer.disconnect();
            }, [prefs.readMode, isExtracting, fetchingNext, loadNextPage]);

            // Xử lý chạm màn hình (Vuốt/Chạm)
            const handleTap = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const width = rect.width;
                
                if(e.target.closest('button')) return;

                if (x < width * 0.25) {
                    if (prefs.readMode === 'paged') {
                        if (containerRef.current) containerRef.current.scrollBy({ left: -width, behavior: 'smooth' });
                    }
                } else if (x > width * 0.75) {
                    if (prefs.readMode === 'paged') {
                         if (containerRef.current) {
                            const maxScroll = containerRef.current.scrollWidth - containerRef.current.clientWidth;
                            if (containerRef.current.scrollLeft + width + 10 >= maxScroll) {
                                // Gần hết văn bản đã tải, nối thêm trang mới vào đuôi
                                loadNextPage().then(() => {
                                    setTimeout(() => containerRef.current.scrollBy({ left: width, behavior: 'smooth' }), 50);
                                });
                            } else {
                                containerRef.current.scrollBy({ left: width, behavior: 'smooth' });
                            }
                        }
                    } else {
                        // Chạm để cuộn 1 đoạn
                        if (containerRef.current) containerRef.current.scrollBy({ top: window.innerHeight * 0.8, behavior: 'smooth' });
                    }
                } else {
                    onTapCenter();
                }
            };

            const isPaged = prefs.readMode === 'paged';

            return (
                <div 
                    ref={containerRef}
                    onClick={handleTap}
                    className={`w-full h-full scroll-smooth transition-all duration-300 ${isPaged ? 'overflow-y-hidden overflow-x-hidden' : 'overflow-y-auto overflow-x-hidden'}`}
                >
                    <div 
                        className={isPaged ? 'w-full h-full' : 'max-w-3xl mx-auto min-h-full flex flex-col'}
                        style={isPaged ? {
                            columnWidth: '100vw', // Tự động chia cột ngang
                            columnGap: '0px',
                            height: '100vh',
                            paddingTop: 'calc(var(--safe-top) + 80px)',
                            paddingBottom: 'calc(var(--safe-bottom) + 80px)',
                        } : {
                            paddingTop: 'calc(var(--safe-top) + 100px)',
                            paddingBottom: 'calc(var(--safe-bottom) + 120px)',
                        }}
                    >
                        
                        {isExtracting && pagesData.length === 0 ? (
                            <div className="flex-1 flex flex-col items-center justify-center opacity-50 h-full w-full">
                                <div className="spinner mb-4 !border-current !border-l-transparent"></div>
                                <p className="font-medium animate-pulse">Đang trích xuất văn bản...</p>
                            </div>
                        ) : pagesData.length === 0 ? (
                            <div className="flex-1 flex flex-col items-center justify-center opacity-30 text-center h-full w-full">
                                <Icon name="file-image" size={64} className="mb-4" />
                                <p className="font-medium text-lg">Trang này chỉ có hình ảnh.</p>
                            </div>
                        ) : (
                            <div 
                                className="font-serif text-justify"
                                style={{
                                    fontSize: `${prefs.fontSize}px`,
                                    lineHeight: prefs.lineHeight,
                                    letterSpacing: '0.01em',
                                    paddingLeft: isPaged ? '0' : '1.5rem',
                                    paddingRight: isPaged ? '0' : '1.5rem',
                                }}
                            >
                                {pagesData.map(pageData => (
                                    <React.Fragment key={pageData.page}>
                                        {pageData.paragraphs.map((para, idx) => (
                                            <p 
                                                key={`${pageData.page}-${idx}`} 
                                                className={`mb-6 indent-8 break-words ${isPaged ? 'px-6 max-w-[100vw]' : ''}`}
                                            >
                                                {para}
                                            </p>
                                        ))}
                                    </React.Fragment>
                                ))}
                                
                                {/* Nút tải tiếp ở cuối trang (Dành cho Cuộn dọc) */}
                                {!isPaged && (
                                    <div ref={observerRef} className="mt-8 py-8 flex justify-center items-center opacity-80 h-32">
                                        {fetchingNext ? (
                                             <div className="flex items-center text-blue-500 font-medium">
                                                 <div className="spinner w-5 h-5 mr-3 !border-current !border-l-transparent"></div>
                                                 Đang tải trang sau...
                                             </div>
                                        ) : (
                                            <div className="w-16 h-1 rounded-full bg-gray-500/20"></div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
