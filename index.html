<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Sơ Đồ Kho Đạn Mặt Bằng</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f172a; margin: 0; overflow: hidden; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        input:focus, button:focus { outline: none; }
        
        /* Cuộn tùy chỉnh */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .light-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; }
        .light-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .blueprint-bg {
            background-color: #f8fafc;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .tab-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .panel-section { display: none; }
        .panel-section.active { display: flex; flex-direction: column; }
        
        .svg-container svg text { user-select: none; }
        .cell-hover:hover { fill: #e2e8f0; cursor: crosshair; }
    </style>
</head>
<body class="flex flex-col h-screen text-sm">

    <!-- HEADER -->
    <header class="bg-[#1e293b] text-white h-[60px] shrink-0 flex justify-between items-center px-4 border-b border-[#334155] z-30 shadow-md">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-2 rounded-lg shadow-lg">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            </div>
            <div>
                <h1 class="font-black text-base md:text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 m-0 leading-tight">AMMO PLANNER <span class="text-white text-xs bg-red-600 px-1.5 py-0.5 rounded ml-1">MẶT BẰNG</span></h1>
            </div>
        </div>

        <div class="hidden md:flex gap-6 text-xs font-bold bg-[#0f172a] px-5 py-2 rounded-full border border-[#334155]">
            <div class="flex items-center gap-2"><span class="text-slate-400">Lô:</span><span id="kpiLots" class="text-white text-base">0</span></div>
            <div class="flex items-center gap-2"><span class="text-slate-400">Viên:</span><span id="kpiItems" class="text-emerald-400 text-base">0</span></div>
            <div class="flex items-center gap-2"><span class="text-slate-400">Hòm:</span><span id="kpiBoxes" class="text-blue-400 text-base">0</span></div>
        </div>

        <div class="flex gap-2">
            <button onclick="deleteAllItems()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded font-bold transition-colors text-xs flex items-center gap-1 shadow-md">
                🗑️ Xóa Tất Cả
            </button>
            <button onclick="document.getElementById('excelUpload').click()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded font-bold flex items-center gap-2 transition-colors shadow-[0_0_10px_rgba(16,185,129,0.3)] text-xs">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <span class="hidden sm:inline">Nhập Excel</span>
            </button>
            <input type="file" id="excelUpload" accept=".xlsx, .xls" class="hidden" onchange="importExcel(event)">
        </div>
    </header>

    <!-- MAIN APP -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- SIDEBAR -->
        <aside class="w-full md:w-[420px] bg-[#1e293b] border-r border-[#334155] flex flex-col absolute md:relative z-20 h-full transition-transform duration-300 shadow-2xl md:shadow-none" id="sidebar">
            
            <div class="flex p-2 gap-1 bg-[#0f172a] shrink-0 border-b border-[#334155]">
                <button onclick="switchPanel('data')" id="tabData" class="tab-btn active flex-1 py-2.5 rounded font-bold text-xs border border-transparent bg-[#1e293b] text-slate-400 transition-colors uppercase tracking-wider">📦 Danh sách Lô</button>
                <button onclick="switchPanel('settings')" id="tabSettings" class="tab-btn flex-1 py-2.5 rounded font-bold text-xs border border-transparent bg-[#1e293b] text-slate-400 transition-colors uppercase tracking-wider">⚙️ Cài đặt Kho</button>
            </div>

            <!-- PANEL 1: DATA -->
            <div id="panelData" class="panel-section active flex-1 overflow-hidden">
                <div class="p-3 border-b border-[#334155] flex justify-between items-center bg-[#1e293b] shrink-0">
                    <span class="text-xs font-bold text-slate-400">Đang có: <span id="countItems" class="text-white bg-blue-600 px-2 py-0.5 rounded-full ml-1">0</span> lô</span>
                    <button onclick="addNewItem()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded text-xs font-bold transition-all shadow-md">
                        + THÊM LÔ
                    </button>
                </div>
                
                <!-- Khu vực Scroll -->
                <div class="flex-1 overflow-y-auto p-3 space-y-3 pb-20 md:pb-4" style="min-height: 0;" id="dataContainer">
                    <!-- Javascript Render -->
                </div>
            </div>

            <!-- PANEL 2: SETTINGS -->
            <div id="panelSettings" class="panel-section flex-1 overflow-y-auto p-4 pb-20 md:pb-4" style="min-height: 0;">
                
                <div class="bg-[#0f172a] p-4 rounded-xl border border-[#334155] mb-5">
                    <h3 class="text-xs font-black text-blue-400 mb-4 uppercase tracking-widest flex items-center gap-2">
                        <span>1</span> KÍCH THƯỚC 1 NHÀ KHO
                    </h3>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="text-[10px] text-slate-400 font-bold block mb-1">NGANG<br>(Chồng/Dãy)</label>
                            <input type="number" id="cfgMaxCols" value="8" onchange="updateConfig()" class="w-full bg-[#1e293b] text-white font-bold text-base p-2 rounded outline-none border border-[#334155] text-center">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 font-bold block mb-1">DỌC<br>(Dãy/Nhà)</label>
                            <input type="number" id="cfgMaxRows" value="6" onchange="updateConfig()" class="w-full bg-[#1e293b] text-white font-bold text-base p-2 rounded outline-none border border-[#334155] text-center">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 font-bold block mb-1">CAO<br>(Hòm/Chồng)</label>
                            <input type="number" id="cfgMaxHeight" value="24" onchange="updateConfig()" class="w-full bg-[#1e293b] text-white font-bold text-base p-2 rounded outline-none border border-[#334155] text-center">
                        </div>
                    </div>
                </div>

                <div class="bg-[#0f172a] p-4 rounded-xl border border-[#334155] mb-5">
                    <h3 class="text-xs font-black text-emerald-400 mb-4 uppercase tracking-widest flex items-center gap-2">
                        <span>2</span> THUẬT TOÁN XẾP
                    </h3>
                    <label class="flex items-center justify-between cursor-pointer group">
                        <div class="pr-4">
                            <span class="block text-sm font-bold text-white mb-1">Xếp chung Lô (Ghép Hòm)</span>
                            <span class="block text-[11px] text-slate-400 leading-snug">Cho phép 1 ô vuông (1 chồng) chứa 2 lô khác nhau nếu chưa chạm nóc.</span>
                        </div>
                        <div class="relative w-12 h-6 rounded-full transition-colors bg-emerald-500 shrink-0" id="toggleBg">
                            <input type="checkbox" id="cfgAllowMix" checked onchange="updateConfig()" class="sr-only">
                            <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform translate-x-6" id="toggleDot"></div>
                        </div>
                    </label>
                </div>

                <div class="bg-[#0f172a] p-4 rounded-xl border border-[#334155] mb-5">
                    <h3 class="text-xs font-black text-purple-400 mb-4 uppercase tracking-widest flex items-center gap-2">
                        <span>3</span> QUY CÁCH CHUNG
                    </h3>
                    <label class="text-[11px] text-slate-400 font-bold block mb-2">Bao gói mặc định (Viên/Hòm)</label>
                    <div class="flex gap-2">
                        <input type="number" id="cfgDefaultPack" value="1000" onchange="updateConfig()" class="w-1/2 bg-[#1e293b] text-white font-bold p-2 rounded outline-none border border-[#334155] text-center text-lg">
                        <button onclick="applyPackToAll()" class="w-1/2 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold rounded transition-colors shadow-lg">ĐỒNG BỘ TẤT CẢ</button>
                    </div>
                </div>
                
                <button onclick="downloadTemplate()" class="w-full mt-4 bg-slate-700 hover:bg-slate-600 text-white px-3 py-3 rounded-lg font-bold items-center justify-center gap-2 transition-colors border border-slate-600 text-xs flex">
                    ⬇️ Tải File Mẫu Excel Nhập Liệu
                </button>

            </div>

            <!-- Mobile Close Button -->
            <button onclick="toggleMobileSidebar()" class="md:hidden absolute bottom-4 left-4 right-4 bg-red-500 text-white font-bold py-3 rounded shadow-lg z-50">
                ĐÓNG BẢNG ĐIỀU KHIỂN
            </button>
        </aside>

        <!-- CANVAS RIGHT -->
        <main class="flex-1 blueprint-bg overflow-auto relative flex flex-col" id="canvasWrapper">
            
            <div class="md:hidden bg-white/90 backdrop-blur border-b border-slate-200 p-3 shrink-0 sticky top-0 z-20 flex justify-end shadow-sm">
                <button onclick="toggleMobileSidebar()" class="bg-slate-800 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-md">
                    ⚙️ MỞ CÀI ĐẶT LÔ ĐẠN
                </button>
            </div>

            <div class="flex-1 p-4 md:p-8 flex flex-col items-center">
                <div id="svgContainer" class="w-full flex flex-col items-center gap-12 pb-16">
                    <!-- SVG ROWS RENDER HERE -->
                </div>
            </div>
        </main>
    </div>

    <!-- Thông báo -->
    <div id="toastMsg" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl font-bold text-sm transition-all duration-300 opacity-0 pointer-events-none translate-y-4 z-50 flex items-center gap-2 border border-slate-600">
        ✅ <span id="toastText">Thành công!</span>
    </div>

    <script>
        // --- DATA STATE ---
        const state = {
            config: {
                maxHeight: 24,    // Cao (Số hòm / chồng)
                maxCols: 8,       // Ngang (Số chồng / dãy)
                maxRows: 6,       // Dọc (Số dãy / nhà)
                defaultPack: 1000,
                allowMix: true    
            },
            items: [] // Ban đầu trống trơn như yêu cầu
        };

        // --- ALGORITHM: TÍNH TOÁN CÁC CHỒNG VÀ NHÀ KHO ---
        function calculateWarehouses() {
            const stacks = [];
            let curStack = { i1: null, q1: 0, l1: 0, i2: null, q2: 0, l2: 0 };

            state.items.forEach(item => {
                let totalBoxes = Math.ceil((Number(item.qty)||0) / (Number(item.pack)||1));
                if (totalBoxes === 0) return;
                
                let leftover = (Number(item.qty)||0) % (Number(item.pack)||1);
                let boxesLeftToPlace = totalBoxes;

                while (boxesLeftToPlace > 0) {
                    let spaceLeft = state.config.maxHeight - (curStack.q1 + curStack.q2);

                    // Chuyển sang ô vuông (chồng) mới nếu ô hiện tại đầy HOẶC không cho phép ghép lô
                    if (spaceLeft === 0 || (!state.config.allowMix && curStack.q1 > 0 && curStack.i1.id !== item.id)) {
                        if (curStack.q1 > 0 || curStack.q2 > 0) stacks.push({...curStack});
                        curStack = { i1: null, q1: 0, l1: 0, i2: null, q2: 0, l2: 0 };
                        spaceLeft = state.config.maxHeight;
                    }

                    let take = Math.min(boxesLeftToPlace, spaceLeft);
                    
                    // Xử lý đơn vị lẻ (viên) vào ô vật lý cuối cùng của lô
                    let isLastPlacement = (boxesLeftToPlace === take);
                    let leftoverForThisPlacement = (isLastPlacement && leftover > 0) ? leftover : 0;

                    if (curStack.i1 === null || curStack.i1.id === item.id) {
                        curStack.i1 = item;
                        curStack.q1 += take;
                        if (leftoverForThisPlacement) curStack.l1 = leftoverForThisPlacement;
                    } else {
                        curStack.i2 = item;
                        curStack.q2 += take;
                        if (leftoverForThisPlacement) curStack.l2 = leftoverForThisPlacement;
                    }

                    boxesLeftToPlace -= take;
                }
            });
            if (curStack.q1 > 0 || curStack.q2 > 0) stacks.push(curStack);

            // Chia các chồng đạn vào các "Nhà" dựa trên maxCols * maxRows
            const houses = [];
            const capacityPerHouse = state.config.maxCols * state.config.maxRows;
            
            for (let i = 0; i < stacks.length; i += capacityPerHouse) {
                houses.push(stacks.slice(i, i + capacityPerHouse));
            }
            return houses;
        }

        // --- KIỂM TRA CHUNG Ranh Giới Lô (Tạo nét đậm) ---
        function hasSharedLot(cellA, cellB) {
            if (!cellA || !cellB) return false; // Nếu 1 ô k tồn tại (rìa) -> K có chung lô
            let lotsA = [cellA.i1?.id, cellA.i2?.id].filter(Boolean);
            let lotsB = [cellB.i1?.id, cellB.i2?.id].filter(Boolean);
            return lotsA.some(id => lotsB.includes(id));
        }

        // --- RENDER DANH SÁCH NHẬP LIỆU BÊN TRÁI ---
        function renderInputPanel() {
            const container = document.getElementById('dataContainer');
            let html = '';

            if (state.items.length === 0) {
                container.innerHTML = `<div class="text-center p-8 text-slate-500 italic border border-dashed border-slate-600 rounded-lg mx-2">Chưa có lô đạn nào.<br>Hãy bấm "THÊM LÔ" hoặc "Nhập Excel"</div>`;
                document.getElementById('countItems').innerText = 0;
                return;
            }

            state.items.forEach((item, idx) => {
                const pck = Number(item.pack)||1;
                const boxes = Math.floor(item.qty / pck);
                const leftover = item.qty % pck;
                
                let leftoverText = leftover > 0 ? `<div class="mt-2 bg-red-500/10 text-red-400 text-[11px] font-bold px-2 py-1 rounded border border-red-500/20 w-max">Lẻ ${leftover} viên</div>` : '';

                html += `
                    <div class="bg-[#1e293b] border border-[#334155] rounded-xl p-4 relative transition-colors focus-within:border-blue-500 shadow-sm">
                        <div class="absolute -top-2.5 -left-2.5 w-6 h-6 bg-slate-700 text-white rounded-full flex items-center justify-center text-[11px] font-bold shadow-md border border-[#334155]">
                            ${idx + 1}
                        </div>
                        <button onclick="removeItem(${item.id})" class="absolute top-2 right-2 text-slate-500 hover:text-red-400 p-1.5 hover:bg-red-500/10 rounded-lg transition-colors" title="Xóa lô này">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                        
                        <div class="grid grid-cols-2 gap-3 mb-3 pr-6 mt-1">
                            <div>
                                <label class="text-[10px] text-slate-500 font-bold block mb-1">Loại đạn</label>
                                <input type="text" placeholder="Loại đạn..." value="${item.type}" onchange="updateItem(${item.id}, 'type', this.value)" class="w-full bg-[#0f172a] border border-[#334155] focus:border-blue-500 text-white text-sm font-bold px-2 py-1.5 rounded outline-none transition-colors">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-500 font-bold block mb-1">Mã Lô</label>
                                <input type="text" placeholder="Mã lô..." value="${item.lot}" onchange="updateItem(${item.id}, 'lot', this.value)" class="w-full bg-[#0f172a] border border-[#334155] focus:border-blue-500 text-[#38bdf8] text-sm font-black px-2 py-1.5 rounded outline-none transition-colors">
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] text-slate-500 font-bold block mb-1">T.Số Viên</label>
                                <input type="number" value="${item.qty}" onchange="updateItem(${item.id}, 'qty', this.value)" class="w-full bg-[#0f172a] border border-[#334155] focus:border-emerald-500 text-emerald-400 font-bold px-2 py-1.5 rounded outline-none text-sm">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-500 font-bold block mb-1">Bao gói</label>
                                <input type="number" value="${item.pack}" onchange="updateItem(${item.id}, 'pack', this.value)" class="w-full bg-[#0f172a] border border-[#334155] focus:border-purple-500 text-purple-400 font-bold px-2 py-1.5 rounded outline-none text-sm">
                            </div>
                        </div>
                        
                        <div class="mt-3 pt-3 border-t border-[#334155] flex justify-between items-start">
                            <div>
                                <span class="text-xs text-slate-400">Quy ra: <b class="text-base text-white">${boxes}</b> hòm chẵn</span>
                                ${leftoverText}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('countItems').innerText = state.items.length;
        }

        // --- RENDER SVG CANVAS (MẶT BẰNG 100%) ---
        function renderDiagram() {
            const houses = calculateWarehouses();
            const container = document.getElementById('svgContainer');
            
            if (houses.length === 0) {
                container.innerHTML = `<div class="bg-white p-10 rounded-xl shadow border border-slate-200 text-slate-400 text-center flex flex-col items-center justify-center min-w-[300px] mt-10"><span class="text-4xl mb-2">📐</span><span>Khu vực bản vẽ đang trống.</span></div>`;
                return;
            }

            const maxC = state.config.maxCols;
            const maxR = state.config.maxRows;
            const maxH = state.config.maxHeight;

            // Kích thước 1 ô vuông (1 chồng)
            const CELL_W = 100; 
            const CELL_H = 80;
            
            const svgWidth = maxC * CELL_W;
            const svgHeight = maxR * CELL_H;

            let html = '';

            houses.forEach((houseStacks, houseIdx) => {
                // Biến đổi mảng 1 chiều thành lưới 2D để dễ truy xuất đường viền
                let grid = Array(maxR).fill().map(() => Array(maxC).fill(null));
                houseStacks.forEach((stack, idx) => {
                    let r = Math.floor(idx / maxC);
                    let c = idx % maxC;
                    if (r < maxR) grid[r][c] = stack;
                });

                let svgHtml = `<div class="relative bg-white shadow-2xl rounded-lg border-[3px] border-slate-800 p-0 overflow-hidden w-max mx-auto mb-10">
                                <div class="bg-slate-800 text-white text-center py-2 font-black tracking-widest text-lg">NHÀ KHO SỐ ${houseIdx + 1}</div>
                                <svg width="${svgWidth}" height="${svgHeight}" style="font-family: Arial, sans-serif;">`;
                
                // 1. Vẽ ô vuông nền và dữ liệu hòm
                for (let r = 0; r < maxR; r++) {
                    for (let c = 0; c < maxC; c++) {
                        let stack = grid[r][c];
                        let x = c * CELL_W;
                        let y = r * CELL_H;

                        // Khung ô vuông mờ
                        svgHtml += `<rect x="${x}" y="${y}" width="${CELL_W}" height="${CELL_H}" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" class="cell-hover transition-colors" />`;

                        if (stack) {
                            if (stack.i2) {
                                // Ô ghép lô -> Vẽ đường gạch chéo
                                svgHtml += `<line x1="${x}" y1="${y}" x2="${x + CELL_W}" y2="${y + CELL_H}" stroke="#0f172a" stroke-width="3" />`;
                                
                                // Lô cũ (Góc trái dưới)
                                let textL1 = stack.q1;
                                if (stack.l1 > 0) textL1 += ` (+${stack.l1}v)`;
                                svgHtml += `<text x="${x + CELL_W * 0.25}" y="${y + CELL_H * 0.75 + 5}" font-size="14" font-weight="900" text-anchor="middle" fill="#0f172a">${textL1}</text>`;
                                
                                // Lô mới (Góc phải trên)
                                let textL2 = stack.q2;
                                if (stack.l2 > 0) textL2 += ` (+${stack.l2}v)`;
                                svgHtml += `<text x="${x + CELL_W * 0.75}" y="${y + CELL_H * 0.25 + 5}" font-size="14" font-weight="900" text-anchor="middle" fill="#0f172a">${textL2}</text>`;
                            } else {
                                // Ô 1 lô -> Chỉ ghi số nếu ô đó bị vơi (Hoặc có lẻ), nếu full 100% thì in chữ mờ
                                let text = stack.q1;
                                let isFull = (stack.q1 === maxH && stack.l1 === 0);
                                if (stack.l1 > 0) text += ` (+${stack.l1}v)`;
                                
                                let textColor = isFull ? "#94a3b8" : "#0f172a";
                                let fontWeight = isFull ? "bold" : "900";
                                
                                svgHtml += `<text x="${x + CELL_W/2}" y="${y + CELL_H/2 + 5}" font-size="16" font-weight="${fontWeight}" text-anchor="middle" fill="${textColor}">${text}</text>`;
                            }
                        }
                    }
                }

                // 2. Vẽ NÉT ĐẬM PHÂN CÁCH LÔ
                svgHtml += `<g stroke="#0f172a" stroke-width="4" stroke-linecap="round">`;
                for (let r = 0; r < maxR; r++) {
                    for (let c = 0; c < maxC; c++) {
                        let cell = grid[r][c];
                        let x = c * CELL_W;
                        let y = r * CELL_H;

                        // Ranh giới phải
                        if (c < maxC - 1) {
                            let rightCell = grid[r][c+1];
                            if (!hasSharedLot(cell, rightCell)) {
                                svgHtml += `<line x1="${x + CELL_W}" y1="${y}" x2="${x + CELL_W}" y2="${y + CELL_H}" />`;
                            }
                        }
                        // Ranh giới dưới
                        if (r < maxR - 1) {
                            let bottomCell = grid[r+1][c];
                            if (!hasSharedLot(cell, bottomCell)) {
                                svgHtml += `<line x1="${x}" y1="${y + CELL_H}" x2="${x + CELL_W}" y2="${y + CELL_H}" />`;
                            }
                        }
                    }
                }
                svgHtml += `</g>`;

                // 3. TẠO OVERLAY TEXT THÔNG TIN TỪNG LÔ TRỰC TIẾP LÊN LƯỚI
                // Gom nhóm các ô thuộc về 1 lô trong Nhà này
                const lotBounds = {};
                houseStacks.forEach((stack, idx) => {
                    let r = Math.floor(idx / maxC);
                    let c = idx % maxC;
                    
                    const processLot = (item, qty, leftover) => {
                        if (!item) return;
                        if (!lotBounds[item.id]) {
                            lotBounds[item.id] = { item: item, cells: [], fullStacks: 0, partialQty: 0, leftoverSum: 0, minR: 99, maxR: -1, minC: 99, maxC: -1 };
                        }
                        let lb = lotBounds[item.id];
                        lb.cells.push({r, c});
                        
                        if (qty === maxH && leftover === 0) lb.fullStacks += 1;
                        else lb.partialQty += qty;
                        
                        lb.leftoverSum += leftover;

                        if (r < lb.minR) lb.minR = r;
                        if (r > lb.maxR) lb.maxR = r;
                        if (c < lb.minC) lb.minC = c;
                        if (c > lb.maxC) lb.maxC = c;
                    };

                    processLot(stack.i1, stack.q1, stack.l1);
                    processLot(stack.i2, stack.q2, stack.l2);
                });

                // Chèn Text
                Object.values(lotBounds).forEach(lb => {
                    let totalBoxes = lb.fullStacks * maxH + lb.partialQty;
                    let eqStr = lb.fullStacks > 0 ? `(${lb.fullStacks} x ${maxH})` : ``;
                    if (lb.partialQty > 0) eqStr += eqStr ? ` + ${lb.partialQty}` : `${lb.partialQty}`;
                    let leftoverStr = lb.leftoverSum > 0 ? `<span style="color:#dc2626; font-size:11px;"> (+ lẻ ${lb.leftoverSum}v)</span>` : '';
                    
                    // Tính tọa độ hình chữ nhật bao quanh lô này
                    let x = lb.minC * CELL_W;
                    let y = lb.minR * CELL_H;
                    let w = (lb.maxC - lb.minC + 1) * CELL_W;
                    let h = (lb.maxR - lb.minR + 1) * CELL_H;

                    svgHtml += `
                        <foreignObject x="${x}" y="${y}" width="${w}" height="${h}">
                            <div style="display:flex; justify-content:center; align-items:center; width:100%; height:100%; pointer-events:none;">
                                <div style="background:rgba(255,255,255,0.92); border:2px solid #1e293b; padding:8px 12px; border-radius:6px; text-align:center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); pointer-events:auto; max-width:90%;">
                                    <strong style="color:#1d4ed8; font-size:14px; display:block;">${lb.item.type}</strong>
                                    <span style="color:#475569; font-size:13px; display:block; margin: 2px 0;">Lô: <b>${lb.item.lot}</b></span>
                                    <span style="color:#0f172a; font-size:13px; font-weight:900;">SL: ${eqStr} = ${totalBoxes}h</span>
                                    ${leftoverStr}
                                </div>
                            </div>
                        </foreignObject>
                    `;
                });

                svgHtml += `</svg></div>`;
                html += svgHtml;
            });

            container.innerHTML = html;
        }

        // --- CÁC HÀM CẬP NHẬT ---
        function updateKPIs() {
            let tLots = state.items.length;
            let tItems = 0; let tBoxes = 0;
            state.items.forEach(i => {
                tItems += Number(i.qty) || 0;
                tBoxes += Math.ceil((Number(i.qty)||0) / (Number(i.pack)||1)); // Dùng ceil vì ô lẻ vẫn là 1 hòm vật lý
            });
            document.getElementById('kpiLots').innerText = tLots;
            document.getElementById('kpiItems').innerText = tItems.toLocaleString('vi-VN');
            document.getElementById('kpiBoxes').innerText = tBoxes.toLocaleString('vi-VN');
        }

        function triggerRender() {
            renderInputPanel();
            renderDiagram();
            updateKPIs();
        }

        function updateConfig() {
            state.config.maxHeight = Math.max(1, Number(document.getElementById('cfgMaxHeight').value));
            state.config.maxCols = Math.max(1, Number(document.getElementById('cfgMaxCols').value));
            state.config.maxRows = Math.max(1, Number(document.getElementById('cfgMaxRows').value));
            state.config.defaultPack = Math.max(1, Number(document.getElementById('cfgDefaultPack').value));
            state.config.allowMix = document.getElementById('cfgAllowMix').checked;
            
            const toggleBg = document.getElementById('toggleBg');
            const toggleDot = document.getElementById('toggleDot');
            if (state.config.allowMix) {
                toggleBg.classList.replace('bg-slate-600', 'bg-emerald-500');
                toggleDot.classList.replace('translate-x-1', 'translate-x-6');
            } else {
                toggleBg.classList.replace('bg-emerald-500', 'bg-slate-600');
                toggleDot.classList.replace('translate-x-6', 'translate-x-1');
            }
            triggerRender();
            showToast("Đã cập nhật cấu hình kho!");
        }

        // --- ACTIONS THAO TÁC DATA ---
        function addNewItem() {
            state.items.push({ id: Date.now(), type: '', lot: '', qty: 1000, pack: state.config.defaultPack });
            triggerRender();
            const container = document.getElementById('dataContainer');
            setTimeout(() => container.scrollTop = container.scrollHeight, 50);
        }

        function removeItem(id) {
            if(confirm('Xóa lô đạn này?')) {
                state.items = state.items.filter(i => i.id !== id);
                triggerRender();
            }
        }
        
        function deleteAllItems() {
            if(confirm('CẢNH BÁO: Bạn có chắc chắn muốn xóa toàn bộ danh sách lô đạn hiện tại không?')) {
                state.items = [];
                triggerRender();
                showToast("Đã làm sạch bản vẽ!");
            }
        }

        function updateItem(id, field, value) {
            const item = state.items.find(i => i.id === id);
            if (item) {
                item[field] = value;
                triggerRender();
            }
        }

        function applyPackToAll() {
            const newPack = state.config.defaultPack;
            if(confirm(`Đồng bộ quy cách đóng gói [${newPack} viên/hòm] cho TẤT CẢ các lô?`)) {
                state.items.forEach(i => i.pack = newPack);
                triggerRender();
                showToast("Đã đồng bộ quy cách!");
            }
        }

        // --- NHẬP EXCEL NÂNG CAO ---
        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                    
                    let count = 0;
                    for(let i = 1; i < json.length; i++) {
                        const row = json[i];
                        if(!row || row.length === 0) continue; 
                        
                        const typeStr = row[0] ? String(row[0]).trim() : "Trống";
                        const lotStr = row[1] ? String(row[1]).trim() : "Chưa có mã";
                        const qtyNum = Number(row[2]) || 0;
                        const packNum = Number(row[3]) || state.config.defaultPack;

                        if(typeStr === "Trống" && lotStr === "Chưa có mã" && qtyNum === 0) continue;

                        state.items.push({
                            id: Date.now() + i,
                            type: typeStr,
                            lot: lotStr,
                            qty: qtyNum,
                            pack: packNum
                        });
                        count++;
                    }

                    if(count > 0) {
                        triggerRender();
                        showToast(`Nhập thành công ${count} lô từ Excel!`);
                    } else {
                        alert("File không có dữ liệu hợp lệ. Xem cấu trúc file mẫu.");
                    }
                } catch (error) {
                    alert("Lỗi đọc file Excel.");
                }
                document.getElementById('excelUpload').value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        function downloadTemplate() {
            const data = [
                ["Loại Đạn", "Mã Lô", "Tổng Số Lượng (Viên)", "Quy cách (Viên/Hòm) - Tùy chọn"],
                ["ĐẠN CX14.5", "0312-1975-41", 20404, 1000],
                ["ĐẠN AK47", "011-85-11", 5000, ""]
            ];
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Mau_Nhap_Lieu");
            XLSX.writeFile(wb, "Mau_Nhap_Kho.xlsx");
        }

        // --- GIAO DIỆN ---
        function switchPanel(panelId) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active', 'text-white', 'border-[#3b82f6]');
                b.classList.add('text-slate-400', 'border-transparent');
            });
            document.querySelectorAll('.panel-section').forEach(p => p.classList.remove('active'));

            if (panelId === 'data') {
                document.getElementById('tabData').classList.add('active', 'text-white', 'border-[#3b82f6]');
                document.getElementById('tabData').classList.remove('text-slate-400', 'border-transparent');
                document.getElementById('panelData').classList.add('active');
            } else {
                document.getElementById('tabSettings').classList.add('active', 'text-white', 'border-[#3b82f6]');
                document.getElementById('tabSettings').classList.remove('text-slate-400', 'border-transparent');
                document.getElementById('panelSettings').classList.add('active');
            }
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('-translate-x-full')) sidebar.classList.remove('-translate-x-full');
            else sidebar.classList.add('-translate-x-full');
        }

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            document.getElementById('toastText').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 3000);
        }

        window.onload = () => {
            triggerRender();
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        };
    </script>
</body>
