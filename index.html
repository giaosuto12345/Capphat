        const cleanData = (data) => data.map((q, idx) => ({
            id: idx + 1,
            question: q.question,
            options: q.options.map(opt => opt.replace(/^[A-D][\.\)]\s*/, '')),
            answer: q.answer
        }));

        const initialQuestionsData = cleanData(rawQuestionsData);
        const optionLabels = ["A", "B", "C", "D", "E"];

        // Âm thanh Web Audio API 
        const playSound = (type) => {
            if(localStorage.getItem('quizSound') === 'false') return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'tick') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'success') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch(e) {}
        };

            const [soundEnabled, setSoundEnabled] = useState(true);
            const [toast, setToast] = useState({ visible: false, message: '', type: 'success' });

            useEffect(() => {
                const savedHistory = localStorage.getItem('quizHistory');
                const savedStats = localStorage.getItem('quizStats');
                const savedQuestions = localStorage.getItem('quizQuestions');
                const savedDark = localStorage.getItem('quizDarkMode') === 'true';
                const savedSound = localStorage.getItem('quizSound') !== 'false';

                if (savedHistory) setHistory(JSON.parse(savedHistory));
                if (savedStats) setStats(JSON.parse(savedStats));
                if (savedQuestions) setQuestions(JSON.parse(savedQuestions));
                
                setDarkMode(savedDark);
                setSoundEnabled(savedSound);
                if(savedDark) document.documentElement.classList.add('dark');
            }, []);

            useEffect(() => {
                if(history.length > 0) localStorage.setItem('quizHistory', JSON.stringify(history));
                if(Object.keys(stats).length > 0) localStorage.setItem('quizStats', JSON.stringify(stats));
                localStorage.setItem('quizQuestions', JSON.stringify(questions));
                localStorage.setItem('quizDarkMode', darkMode);
                localStorage.setItem('quizSound', soundEnabled);
                
                if(darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [history, stats, questions, darkMode, soundEnabled]);

            // Timer Loop
            useEffect(() => {
                let timer;
                if (view === 'QUIZ' && timeLeft !== null && timeLeft > 0) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) { clearInterval(timer); handleAutoSubmit(); return 0; }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [view, timeLeft]);

            // Auto-scroll Dot Navigation
            useEffect(() => {
                if (view === 'QUIZ') {
                    const dotContainer = document.getElementById('dot-container');
                    const activeDot = document.getElementById(`dot-${currentQuestion}`);
                    if (dotContainer && activeDot) {
                        const scrollPos = activeDot.offsetLeft - dotContainer.offsetWidth / 2 + activeDot.offsetWidth / 2;
                        dotContainer.scrollTo({ left: scrollPos, behavior: 'smooth' });
                    }
                }
            }, [currentQuestion, view]);

            // === HÀM HỖ TRỢ ===
            const showToast = (message, type = 'success') => {
                setToast({ visible: true, message, type });
                setTimeout(() => setToast({ visible: false, message: '', type: 'success' }), 2500);
            };

            const openConfirm = (title, message, confirmText, isDanger, onConfirm) => {
                setConfirmDialog({ visible: true, title, message, confirmText, isDanger, onConfirm });
            };

            const shuffleArray = (array) => {
                let shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            };

            const formatTime = (sec) => `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;

            // === THUẬT TOÁN BỐC ĐỀ THÔNG MINH (ADAPTIVE ALGORITHM) ===
            const startQuiz = () => {
                // Bước 1: Tìm số lần xuất hiện ít nhất để cân bằng (Exposure Balancing)
                let minAttempts = Infinity;
                const qStatsList = questions.map(q => {
                    const right = stats[q.id]?.right || 0;
                    const wrong = stats[q.id]?.wrong || 0;
                    const attempts = right + wrong;
                    if (attempts < minAttempts) minAttempts = attempts;
                    return { q, attempts, wrongRatio: attempts > 0 ? wrong / attempts : 0 };
                });
                
                if (minAttempts === Infinity) minAttempts = 0;

                // Bước 2: Tạo bể bốc thăm với trọng số (Weighted Lottery Pool)
                let lotteryPool = [];
                qStatsList.forEach(({ q, attempts, wrongRatio }) => {
                    let weight = 1; // Mặc định mỗi câu có 1 "vé"

                    // Quy tắc 1: Cân bằng hiển thị (Ưu tiên câu ít gặp nhất)
                    if (attempts === minAttempts) weight += 5; // Cực kỳ ưu tiên câu chưa/ít làm
                    else if (attempts === minAttempts + 1) weight += 2;

                    // Quy tắc 2: Khoét sâu điểm yếu (Ưu tiên câu sai nhiều)
                    if (attempts > 0) {
                        if (wrongRatio >= 0.5) weight += 6; // Sai trên 50% => Ép vào đề liên tục
                        else if (wrongRatio >= 0.3) weight += 3;
                    }

                    // Bỏ "vé" vào lồng bốc thăm
                    for(let i=0; i<weight; i++) {
                        lotteryPool.push(q);
                    }
                });

                // Bước 3: Rút ngẫu nhiên từ bể bốc thăm (không trùng lặp)
                lotteryPool = shuffleArray(lotteryPool);
                const selected = [];
                const ids = new Set();
                for (let q of lotteryPool) {
                    if (selected.length >= quizConfig.count && quizConfig.count !== 'all') break;
                    if (!ids.has(q.id)) { 
                        selected.push(q); 
                        ids.add(q.id); 
                    }
                }
                
                let finalSel = quizConfig.count === 'all' ? questions : selected;

                // Bước 4: Đảo thứ tự đáp án A, B, C cho đề thi
                const randomizedQuiz = finalSel.map(q => {
                    let optsWithFlag = q.options.map((txt, i) => ({ txt, isC: i === q.answer }));
                    optsWithFlag = shuffleArray(optsWithFlag);
                    return { ...q, options: optsWithFlag.map(o => o.txt), answer: optsWithFlag.findIndex(o => o.isC) };
                });

                setActiveQuestions(randomizedQuiz);
                setCurrentQuestion(0);
                setUserAnswers({});
                setScore(0);
                setTimeLeft(quizConfig.time > 0 ? quizConfig.time * 60 : null);
                setView('QUIZ');
            };

            const handleAnswer = (idx) => {
                playSound('tick');
                setUserAnswers({...userAnswers, [currentQuestion]: idx});
            };

            const handleAutoSubmit = () => {
                processSubmit();
                showToast('Hết giờ! Tự động nộp bài.', 'info');
            };

            const requestSubmit = () => {
                const ansCount = Object.keys(userAnswers).length;
                if (ansCount < activeQuestions.length) {
                    openConfirm('Chưa hoàn thành', `Đồng chí mới làm ${ansCount}/${activeQuestions.length} câu. Bạn có chắc chắn muốn nộp bài sớm không?`, 'Nộp bài', false, processSubmit);
                } else {
                    processSubmit();
                }
            };

            const processSubmit = () => {
                playSound('success');
                let finalScore = 0;
                let newStats = { ...stats };

                activeQuestions.forEach((q, i) => {
                    const uA = userAnswers[i];
                    const isC = uA === q.answer;
                    if (isC) finalScore++;
                    if (uA !== undefined) {
                        if (!newStats[q.id]) newStats[q.id] = { right: 0, wrong: 0 };
                        if (isC) newStats[q.id].right++; else newStats[q.id].wrong++;
                    }
                });

                setHistory([{ date: new Date().toLocaleString('vi-VN'), score: finalScore, total: activeQuestions.length, percent: Math.round((finalScore / activeQuestions.length) * 100) }, ...history].slice(0, 15));
                setStats(newStats);
                setScore(finalScore);
                setView('RESULT');
            };

            // === MANAGE / CRUD LOGIC ===
            const handleSaveQuestion = (qData) => {
                if(!qData.question.trim() || qData.options.some(o => !o.trim())) { 
                    openConfirm('Lỗi nhập liệu', 'Vui lòng điền đầy đủ nội dung câu hỏi và các đáp án!', 'Đã hiểu', false, ()=>{});
                    return; 
                }
                
                if (editModal.isNew) {
                    const newId = questions.length > 0 ? Math.max(...questions.map(q => q.id)) + 1 : 1;
                    setQuestions([...questions, { ...qData, id: newId }]);
                    showToast('Đã thêm câu hỏi mới');
                } else {
                    setQuestions(questions.map(q => q.id === qData.id ? qData : q));
                    showToast('Đã cập nhật câu hỏi');
                }
                setEditModal({ visible: false, isNew: false, data: null });
            };

            const handleDeleteQuestion = (id) => {
                openConfirm('Xóa câu hỏi', 'Bạn có chắc chắn muốn xóa câu hỏi này không? Thao tác không thể hoàn tác.', 'Xóa', true, () => {
                    setQuestions(questions.filter(q => q.id !== id));
                    showToast('Đã xóa câu hỏi');
                    setEditModal({ visible: false, isNew: false, data: null });
                });
            };

            const resetToDefault = () => {
                openConfirm('Khôi phục dữ liệu', 'Khôi phục lại toàn bộ 40 câu hỏi gốc? Mọi câu hỏi bạn đã tự thêm sẽ bị xóa mất.', 'Khôi phục', true, () => {
                    setQuestions(initialQuestionsData);
                    showToast('Đã khôi phục dữ liệu gốc');
                });
            };

            // === RENDERERS ===
            const renderHome = () => {
                // Tính toán phần trăm tiến độ bao phủ ngân hàng đề
                const seenCount = questions.filter(q => {
                    const s = stats[q.id];
                    return s && (s.right + s.wrong) > 0;
                }).length;
                const seenPercent = Math.round((seenCount / questions.length) * 100) || 0;

                return (
                    <div className="animate-slide-up">
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-800 rounded-b-3xl shadow-lg border-b border-blue-900/50">
                            <div className="pt-12 pb-8 px-6 text-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]"></div>
                                <div className="w-20 h-20 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-inner text-white text-3xl rotate-3">
                                    <i className="fas fa-layer-group"></i>
                                </div>
                                <h2 className="text-2xl font-extrabold mb-1 text-white relative z-10">Đoàn Giỏi 2026</h2>
                                
                                {/* Nâng cấp: Progress Bar Độ Bao Phủ Đề */}
                                <div className="mt-4 bg-white/10 p-3.5 rounded-2xl backdrop-blur-md border border-white/20 text-left relative z-10 max-w-[280px] mx-auto">
                                    <div className="flex justify-between text-white/90 text-xs font-bold mb-2">
                                        <span>Tiến độ quét đề:</span>
                                        <span>{seenCount}/{questions.length} câu</span>
                                    </div>
                                    <div className="w-full h-2 bg-black/20 rounded-full overflow-hidden">
                                        <div className="h-full bg-green-400 transition-all duration-1000 shadow-[0_0_8px_rgba(74,222,128,0.6)]" style={{width: `${seenPercent}%`}}></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="p-5 space-y-5">
                            <div className="bg-ios-card dark:bg-ios-darkcard p-4 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800">
                                <label className="block text-xs font-bold text-slate-400 dark:text-slate-500 mb-3 uppercase tracking-wider">Số câu hỏi</label>
                                <div className="flex bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl">
                                    {[10, 20, 30, 'all'].map(num => (
                                        <button key={num} onClick={() => setQuizConfig({...quizConfig, count: num})} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all ${quizConfig.count === num ? 'bg-white dark:bg-slate-600 shadow-md text-blue-600 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700'}`}>
                                            {num === 'all' ? 'Tất cả' : num}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-ios-card dark:bg-ios-darkcard p-4 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800">
                                <label className="block text-xs font-bold text-slate-400 dark:text-slate-500 mb-3 uppercase tracking-wider">Thời gian (Phút)</label>
                                <div className="flex bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl">
                                    {[0, 10, 15, 20].map(time => (
                                        <button key={time} onClick={() => setQuizConfig({...quizConfig, time})} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all ${quizConfig.time === time ? 'bg-white dark:bg-slate-600 shadow-md text-indigo-600 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700'}`}>
                                            {time === 0 ? 'Không' : time}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <button onClick={startQuiz} className="w-full py-4 bg-blue-600 text-white text-lg font-bold rounded-2xl hover:bg-blue-700 active:scale-95 transition-all shadow-lg shadow-blue-600/30">
                                Bắt đầu thi ngay
                            </button>
                        </div>
                    </div>
                );
            }

            const renderQuiz = () => {
                const timePct = timeLeft !== null && quizConfig.time > 0 ? (timeLeft / (quizConfig.time * 60)) * 100 : 100;
                return (
                    <div className="animate-fade-in min-h-screen bg-ios-card dark:bg-ios-darkcard flex flex-col">
                        <div className="sticky top-0 z-30 bg-ios-card/95 dark:bg-ios-darkcard/95 backdrop-blur-md border-b border-slate-100 dark:border-slate-800">
                            {timeLeft !== null && <div className="w-full h-1.5 bg-slate-200 dark:bg-slate-700"><div className={`h-full transition-all duration-1000 ${timePct<20?'bg-red-500':'bg-blue-500'}`} style={{width: `${timePct}%`}}></div></div>}
                            
                            <div className="px-5 py-3 flex justify-between items-center">
                                <span className="font-bold text-slate-500 dark:text-slate-400 text-sm">Câu {currentQuestion + 1}/{activeQuestions.length}</span>
                                {timeLeft !== null && <span className={`font-mono font-bold text-sm bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-lg ${timePct<20?'text-red-500 animate-pulse':'text-blue-500'}`}><i className="far fa-clock"></i> {formatTime(timeLeft)}</span>}
                            </div>
                            
                            {/* Navigation Dots (Pill) To Mượt */}
                            <div className="px-5 pb-4 flex gap-2.5 overflow-x-auto hide-scrollbar items-center scroll-smooth" id="dot-container">
                                {activeQuestions.map((_, idx) => {
                                    const isActive = idx === currentQuestion;
                                    const isAnswered = userAnswers[idx] !== undefined;
                                    let dotClasses = "h-3.5 rounded-full flex-shrink-0 transition-all duration-300 ";
                                    if (isActive) dotClasses += "w-10 bg-blue-600 shadow-md shadow-blue-500/40";
                                    else if (isAnswered) dotClasses += "w-3.5 bg-blue-400 opacity-60";
                                    else dotClasses += "w-3.5 bg-slate-200 dark:bg-slate-700";
                                    
                                    return (
                                        <button 
                                            key={idx} 
                                            id={`dot-${idx}`}
                                            onClick={() => setCurrentQuestion(idx)} 
                                            className={dotClasses}
                                            aria-label={`Câu ${idx + 1}`}
                                        ></button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="p-5 pb-32 flex-1">
                            <h2 className="text-xl font-bold leading-relaxed mb-6 dark:text-white">{activeQuestions[currentQuestion].question}</h2>
                            <div className="space-y-4">
                                {activeQuestions[currentQuestion].options.map((opt, i) => {
                                    const isSel = userAnswers[currentQuestion] === i;
                                    return (
                                        <button key={i} onClick={() => handleAnswer(i)} className={`w-full text-left p-5 rounded-3xl border-2 transition-all flex items-start ${isSel ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/30 shadow-md shadow-blue-500/10' : 'border-slate-200 dark:border-slate-700 bg-transparent hover:border-blue-300'}`}>
                                            <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center mr-4 shrink-0 text-sm font-bold ${isSel ? 'border-blue-500 bg-blue-500 text-white' : 'border-slate-300 dark:border-slate-600 text-slate-400'}`}>{optionLabels[i]}</div>
                                            <span className={`text-[1.05rem] mt-1 ${isSel ? 'text-blue-900 dark:text-blue-100 font-bold' : 'text-slate-700 dark:text-slate-300'}`}>{opt}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="fixed bottom-0 left-0 w-full glass-panel border-t border-slate-200 dark:border-slate-800 p-4 pb-safe z-30">
                            <div className="max-w-md mx-auto flex gap-3">
                                <button onClick={() => setCurrentQuestion(p=>Math.max(0,p-1))} disabled={currentQuestion===0} className="w-16 h-14 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 active:bg-slate-200 disabled:opacity-40 transition-colors shadow-sm"><i className="fas fa-chevron-left text-lg"></i></button>
                                
                                {currentQuestion === activeQuestions.length - 1 ? 
                                    <button onClick={requestSubmit} className="flex-1 bg-green-500 text-white font-bold rounded-2xl active:scale-95 transition-transform shadow-lg shadow-green-500/30 text-lg">Nộp Bài</button> : 
                                    <button onClick={()=>setCurrentQuestion(p=>p+1)} className="flex-1 bg-blue-600 text-white font-bold rounded-2xl active:scale-95 transition-transform shadow-lg shadow-blue-600/30 text-lg">Câu Tiếp</button>
                                }
                            </div>
                        </div>
                    </div>
                );
            };

            const renderHistory = () => {
                let hardQ = Object.entries(stats).filter(([_, d]) => d.wrong > 0).map(([id, d]) => ({ id: parseInt(id), ...d, r: d.wrong/(d.right+d.wrong) })).sort((a,b) => b.r - a.r || b.wrong - a.wrong).slice(0, 5);
                return (
                    <div className="animate-slide-up p-5 space-y-6">
                        <h2 className="text-3xl font-extrabold mt-4 mb-2">Thống kê</h2>
                        
                        <div className="bg-ios-card dark:bg-ios-darkcard rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-800">
                            <h3 className="font-bold text-red-500 flex items-center gap-2 mb-4 text-lg"><i className="fas fa-fire"></i> Top 5 câu hay sai</h3>
                            {hardQ.length === 0 ? <p className="text-slate-400 text-sm font-medium">Chưa có dữ liệu sai sót. Tuyệt vời!</p> : 
                                <div className="space-y-3">
                                    {hardQ.map((s,i) => {
                                        const q = questions.find(x => x.id === s.id);
                                        return q ? (
                                            <div key={i} className="p-4 bg-red-50 dark:bg-red-900/20 rounded-2xl border border-red-100 dark:border-red-900/30">
                                                <p className="text-sm font-medium text-slate-700 dark:text-slate-300 line-clamp-2 mb-2">{q.question}</p>
                                                <span className="text-xs font-bold bg-white dark:bg-red-900/50 text-red-600 dark:text-red-400 px-2 py-1 rounded-md shadow-sm">Sai {s.wrong} lần</span>
                                            </div>
                                        ) : null;
                                    })}
                                </div>
                            }
                        </div>

                        <div className="bg-ios-card dark:bg-ios-darkcard rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-800">
                            <h3 className="font-bold flex items-center gap-2 mb-4 text-lg"><i className="fas fa-history text-blue-500"></i> Lịch sử thi</h3>
                            {history.length === 0 ? <p className="text-slate-400 text-sm font-medium">Chưa có lịch sử làm bài.</p> : 
                                <div className="space-y-0 divide-y divide-slate-100 dark:divide-slate-800/50">
                                    {history.map((h,i) => (
                                        <div key={i} className="flex justify-between items-center py-4">
                                            <div>
                                                <div className="font-bold text-slate-800 dark:text-white">{h.score}/{h.total} câu</div>
                                                <div className="text-xs text-slate-400 mt-1">{h.date}</div>
                                            </div>
                                            <span className={`text-sm font-bold px-3 py-1.5 rounded-lg ${h.percent>=80?'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400':h.percent>=50?'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400':'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'}`}>{h.percent}%</span>
                                        </div>
                                    ))}
                                </div>
                            }
                        </div>
                    </div>
                );
            };

            const renderSettings = () => (
                <div className="animate-slide-up p-5 space-y-6">
                    <h2 className="text-3xl font-extrabold mt-4 mb-6">Cài đặt</h2>

                    <div className="bg-ios-card dark:bg-ios-darkcard rounded-3xl overflow-hidden shadow-sm border border-slate-100 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800">
                        <div className="p-5 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="w-10 h-10 rounded-xl bg-slate-800 text-white flex items-center justify-center shadow-md"><i className="fas fa-moon"></i></div>
                                <span className="font-medium text-lg">Chế độ tối (Dark Mode)</span>
                            </div>
                            <label className="flex items-center">
                                <input type="checkbox" className="hidden toggle-checkbox" checked={darkMode} onChange={()=>setDarkMode(!darkMode)} />
                                <div className="toggle-label"></div>
                            </label>
                        </div>
                        <div className="p-5 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="w-10 h-10 rounded-xl bg-blue-500 text-white flex items-center justify-center shadow-md shadow-blue-500/30"><i className="fas fa-volume-up"></i></div>
                                <span className="font-medium text-lg">Âm thanh chạm</span>
                            </div>
                            <label className="flex items-center">
                                <input type="checkbox" className="hidden toggle-checkbox" checked={soundEnabled} onChange={()=>setSoundEnabled(!soundEnabled)} />
                                <div className="toggle-label"></div>
                            </label>
                        </div>
                    </div>

                    <div className="bg-ios-card dark:bg-ios-darkcard rounded-3xl overflow-hidden shadow-sm border border-slate-100 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800">
                        <button onClick={() => setView('MANAGE')} className="w-full p-5 flex justify-between items-center hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                            <div className="flex items-center gap-4">
                                <div className="w-10 h-10 rounded-xl bg-indigo-500 text-white flex items-center justify-center shadow-md shadow-indigo-500/30"><i className="fas fa-database"></i></div>
                                <span className="font-medium text-lg">Quản lý kho đề</span>
                            </div>
                            <div className="flex items-center gap-2 text-slate-400">
                                <span className="text-sm font-medium">{questions.length} câu</span>
                                <i className="fas fa-chevron-right text-xs"></i>
                            </div>
                        </button>
                        <button onClick={resetToDefault} className="w-full p-5 flex justify-between items-center hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors text-red-500">
                            <div className="flex items-center gap-4">
                                <div className="w-10 h-10 rounded-xl bg-red-100 dark:bg-red-900/30 flex items-center justify-center"><i className="fas fa-undo"></i></div>
                                <span className="font-medium text-lg">Khôi phục 40 câu gốc</span>
                            </div>
                        </button>
                    </div>
                </div>
            );

            const renderManage = () => (
                <div className="animate-slide-up p-5 space-y-4">
                    <div className="flex items-center justify-between mb-4 mt-4">
                        <button onClick={() => setView('SETTINGS')} className="text-blue-500 flex items-center gap-1 text-lg font-medium active:opacity-70">
                            <i className="fas fa-chevron-left"></i> Trở về
                        </button>
                        <button onClick={() => setEditModal({visible: true, isNew: true, data: {question: '', options: ['','',''], answer: 0}})} className="bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 px-3 py-1.5 rounded-lg font-bold">
                            <i className="fas fa-plus mr-1"></i> Thêm mới
                        </button>
                    </div>
                    <h2 className="text-3xl font-extrabold mb-4">Kho câu hỏi</h2>

                    <div className="space-y-4 pb-20">
                        {questions.map((q, idx) => (
                            <button key={q.id} onClick={() => setEditModal({visible: true, isNew: false, data: q})} className="w-full bg-ios-card dark:bg-ios-darkcard p-5 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 text-left flex gap-4 active:scale-[0.98] transition-transform">
                                <span className="text-blue-500 font-bold shrink-0 mt-0.5">{idx + 1}.</span>
                                <span className="font-medium line-clamp-2 flex-1 text-slate-700 dark:text-slate-200 leading-relaxed">{q.question}</span>
                                <i className="fas fa-chevron-right text-slate-300 text-sm mt-1"></i>
                            </button>
                        ))}
                    </div>
                </div>
            );

            const renderResultReview = () => {
                if(view === 'RESULT') return (
                    <div className="animate-fade-in flex flex-col items-center justify-center min-h-[85vh] p-6 pb-20">
                        <div className="w-32 h-32 bg-gradient-to-tr from-yellow-400 to-amber-300 rounded-full flex items-center justify-center mb-8 shadow-2xl shadow-yellow-400/40 animate-slide-up">
                            <i className="fas fa-star text-6xl text-white"></i>
                        </div>
                        <h2 className="text-4xl font-black mb-8 text-slate-800 dark:text-white tracking-tight">Kết Quả</h2>
                        <div className="bg-ios-card dark:bg-ios-darkcard px-10 py-10 rounded-3xl shadow-xl mb-10 text-center w-full max-w-sm border border-slate-100 dark:border-slate-800">
                            <div className="text-7xl font-black text-blue-600 dark:text-blue-400 mb-2">{score}<span className="text-4xl text-slate-300 dark:text-slate-600">/{activeQuestions.length}</span></div>
                        </div>
                        <div className="flex w-full max-w-sm gap-4">
                            <button onClick={()=>setView('REVIEW')} className="flex-1 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white font-bold py-4 rounded-2xl active:opacity-80 transition-opacity text-lg">Xem chi tiết</button>
                            <button onClick={()=>setView('HOME')} className="flex-1 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/30 active:scale-95 transition-all text-lg">Hoàn tất</button>
                        </div>
                    </div>
                );

                return (
                    <div className="animate-fade-in pb-24 p-5 space-y-6 pt-8">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-2xl font-extrabold">Xem lại bài</h2>
                            <button onClick={()=>setView('RESULT')} className="bg-slate-200 dark:bg-slate-800 px-4 py-2 rounded-xl font-bold text-slate-700 dark:text-slate-300">Trở lại</button>
                        </div>
                        {activeQuestions.map((q, idx) => {
                            const uA = userAnswers[idx]; const isC = uA === q.answer;
                            return (
                                <div key={idx} className="bg-ios-card dark:bg-ios-darkcard p-5 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800">
                                    <h3 className="font-bold mb-5 flex gap-3 text-base leading-relaxed">
                                        <span className={`w-7 h-7 flex items-center justify-center rounded-full text-white text-xs shrink-0 mt-0.5 ${isC?'bg-green-500':(uA===undefined?'bg-slate-300 dark:bg-slate-600':'bg-red-500')}`}>{idx+1}</span>
                                        {q.question}
                                    </h3>
                                    <div className="space-y-3">
                                        {q.options.map((opt, i) => {
                                            let st = "bg-slate-50 dark:bg-slate-800/50 text-slate-500"; let ic = null;
                                            if (i === q.answer) { st = "bg-green-50 dark:bg-green-900/20 border border-green-400 text-green-700 dark:text-green-400 font-bold shadow-sm"; ic = <i className="fas fa-check text-green-500"></i>; }
                                            else if (i === uA && !isC) { st = "bg-red-50 dark:bg-red-900/20 border border-red-200 text-red-600 dark:text-red-400 opacity-90 font-medium"; ic = <i className="fas fa-times text-red-400"></i>; }
                                            return <div key={i} className={`p-4 rounded-xl flex justify-between gap-3 text-[1.05rem] ${st}`}><span>{opt}</span>{ic}</div>;
                                        })}
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                );
            };

            // === MAIN RENDER ===
            return (
                <div className="max-w-md mx-auto min-h-screen relative">
                    
                    {/* TOAST */}
                    <div className={`fixed top-6 left-1/2 -translate-x-1/2 z-[100] transition-all duration-300 ${toast.visible ? 'translate-y-0 opacity-100 scale-100' : '-translate-y-10 opacity-0 scale-95 pointer-events-none'}`}>
                        <div className="glass-panel px-6 py-3.5 rounded-full shadow-xl flex items-center gap-3 border border-white/20 dark:border-slate-700">
                            <i className={`fas ${toast.type==='success'?'fa-check-circle text-green-500':'fa-info-circle text-blue-500'} text-lg`}></i>
                            <span className="text-sm font-bold dark:text-white whitespace-nowrap">{toast.message}</span>
                        </div>
                    </div>

                    {/* CONFIRM DIALOG CHUẨN IOS */}
                    {confirmDialog.visible && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center bg-black/40 backdrop-blur-sm animate-fade-in px-4">
                            <div className="bg-ios-card dark:bg-ios-darkcard w-full max-w-[320px] rounded-3xl shadow-2xl flex flex-col animate-scale-in overflow-hidden border border-slate-100 dark:border-slate-800">
                                <div className="p-6 text-center">
                                    <h3 className="text-xl font-bold mb-2 dark:text-white">{confirmDialog.title}</h3>
                                    <p className="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">{confirmDialog.message}</p>
                                </div>
                                <div className="flex border-t border-slate-200 dark:border-slate-800">
                                    <button onClick={() => setConfirmDialog({...confirmDialog, visible: false})} className="flex-1 py-4 border-r border-slate-200 dark:border-slate-800 text-blue-500 font-medium active:bg-slate-50 dark:active:bg-slate-800 text-lg">Hủy</button>
                                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog({...confirmDialog, visible: false}); }} className={`flex-1 py-4 font-bold active:bg-slate-50 dark:active:bg-slate-800 text-lg ${confirmDialog.isDanger ? 'text-red-500' : 'text-blue-600'}`}>{confirmDialog.confirmText}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'HOME' && renderHome()}
                    {view === 'QUIZ' && renderQuiz()}
                    {(view === 'RESULT' || view === 'REVIEW') && renderResultReview()}
                    {view === 'HISTORY' && renderHistory()}
                    {view === 'SETTINGS' && renderSettings()}
                    {view === 'MANAGE' && renderManage()}

                    {/* Bottom Navbar */}
                    {['HOME', 'HISTORY', 'SETTINGS', 'MANAGE'].includes(view) && (
                        <div className="fixed bottom-0 left-0 w-full z-40 pb-safe glass-panel border-t border-slate-200 dark:border-slate-800">
                            <div className="max-w-md mx-auto flex justify-around pt-3 pb-5">
                                {[ {id:'HOME', icon:'fa-home', label:'Trang chủ'}, {id:'HISTORY', icon:'fa-chart-pie', label:'Thống kê'}, {id:'SETTINGS', icon:'fa-cog', label:'Cài đặt'} ].map(tab => (
                                    <button key={tab.id} onClick={() => setView(tab.id)} className={`flex flex-col items-center gap-1.5 w-16 transition-colors ${view===tab.id || (tab.id==='SETTINGS'&&view==='MANAGE') ? 'text-blue-600 dark:text-blue-400' : 'text-slate-400 hover:text-slate-600'}`}>
                                        <i className={`fas ${tab.icon} text-xl`}></i><span className="text-[11px] font-bold">{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* MODAL THÊM/SỬA */}
                    {editModal.visible && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-ios-card dark:bg-ios-darkcard w-full max-w-md h-[95vh] sm:h-auto sm:max-h-[90vh] rounded-t-[2rem] sm:rounded-3xl overflow-y-auto flex flex-col animate-slide-up border border-slate-100 dark:border-slate-800">
                                <div className="sticky top-0 bg-ios-card/95 dark:bg-ios-darkcard/95 backdrop-blur-md p-5 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center z-10">
                                    <button onClick={()=>setEditModal({...editModal, visible:false})} className="text-slate-500 font-medium text-lg">Hủy</button>
                                    <h3 className="font-extrabold text-lg">{editModal.isNew ? 'Thêm câu hỏi' : 'Sửa câu hỏi'}</h3>
                                    <button onClick={()=>handleSaveQuestion(editModal.data)} className="text-blue-600 font-bold text-lg">Lưu</button>
                                </div>
                                <div className="p-6 space-y-6">
                                    <div>
                                        <label className="text-sm font-bold text-slate-500 uppercase mb-3 block">Nội dung câu hỏi</label>
                                        <textarea value={editModal.data.question} onChange={e=>setEditModal({visible:true, isNew:editModal.isNew, data:{...editModal.data, question:e.target.value}})} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-blue-500 min-h-[120px] text-base" placeholder="Nhập câu hỏi..."></textarea>
                                    </div>
                                    <div>
                                        <label className="text-sm font-bold text-slate-500 uppercase mb-3 block">Các đáp án (Tích chọn đáp án đúng)</label>
                                        <div className="space-y-4">
                                            {editModal.data.options.map((opt, i) => (
                                                <div key={i} className="flex items-center gap-4">
                                                    <input type="radio" name="correct" checked={editModal.data.answer === i} onChange={()=>setEditModal({visible:true, isNew:editModal.isNew, data:{...editModal.data, answer:i}})} className="w-6 h-6 accent-blue-600"/>
                                                    <input type="text" value={opt} onChange={e=>{const newOpts=[...editModal.data.options]; newOpts[i]=e.target.value; setEditModal({visible:true, isNew:editModal.isNew, data:{...editModal.data, options:newOpts}})}} className={`flex-1 bg-slate-50 dark:bg-slate-800 border rounded-2xl p-4 outline-none focus:ring-2 text-base ${editModal.data.answer === i ? 'border-blue-400 focus:ring-blue-500' : 'border-slate-200 dark:border-slate-700 focus:ring-slate-400'}`} placeholder={`Đáp án ${i+1}`}/>
                                                </div>
                                            ))}
                                        </div>
                                        {editModal.data.options.length < 5 && (
                                            <button onClick={()=>{const newOpts=[...editModal.data.options, '']; setEditModal({visible:true, isNew:editModal.isNew, data:{...editModal.data, options:newOpts}})}} className="mt-4 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-4 py-2 rounded-xl text-sm font-bold active:scale-95 transition-transform"><i className="fas fa-plus"></i> Thêm ô đáp án</button>
                                        )}
                                    </div>
                                    {!editModal.isNew && (
                                        <button onClick={()=>handleDeleteQuestion(editModal.data.id)} className="w-full py-4 text-red-500 font-bold bg-red-50 dark:bg-red-900/20 rounded-2xl mt-8 border border-red-100 dark:border-red-900/50 active:scale-95 transition-transform">Xóa câu hỏi này</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
