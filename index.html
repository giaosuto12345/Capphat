<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aura Reader</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 47px);
            --safe-bottom: env(safe-area-inset-bottom, 34px);
        }
        
        body { 
            margin: 0; 
            background-color: #000; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow: hidden;
        }

        .font-ui { font-family: 'Inter', sans-serif; }
        .font-book { font-family: 'Lora', serif; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Hiệu ứng phần cứng cho 120Hz */
        .will-change-transform { will-change: transform, opacity; }
        
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Themes */
        .theme-light { background-color: #FFFFFF; color: #1C1C1E; }
        .theme-sepia { background-color: #F4ECD8; color: #5B4636; }
        .theme-dark { background-color: #1C1C1E; color: #D1D1D6; }
        .theme-oled { background-color: #000000; color: #8E8E93; }
        
        .theme-oled h1, .theme-oled h2 { color: #E5E5EA; }
        .theme-dark h1, .theme-dark h2 { color: #FFFFFF; }

        /* Audio Bars */
        .playing-bar {
            width: 3px; background-color: currentColor; border-radius: 3px;
            animation: bounce 1s infinite ease-in-out;
            transform-origin: bottom;
        }
        .playing-bar:nth-child(1) { animation-delay: 0s; }
        .playing-bar:nth-child(2) { animation-delay: 0.2s; }
        .playing-bar:nth-child(3) { animation-delay: 0.4s; }
        .playing-bar:nth-child(4) { animation-delay: 0.1s; }
        @keyframes bounce { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 24, className = '', color = 'currentColor', fill="none" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px; stroke:${color}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: ${fill};"></i>`;
                    iconRef.current.appendChild(tempDiv.firstChild);
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, size, color, fill]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        const INITIAL_BOOK = { 
            id: 'mock-1', 
            title: "Sapiens: Lược Sử Loài Người", 
            author: "Yuval Noah Harari", 
            cover: "bg-gradient-to-br from-slate-800 to-slate-900", 
            type: "MẪU",
            content: `Khoảng 14 tỷ năm trước, vật chất, năng lượng, thời gian và không gian đã xuất hiện trong một điểm kỳ dị được gọi là Vụ nổ lớn (Big Bang). Câu chuyện về những đặc tính cơ bản của vũ trụ chúng ta được gọi là vật lý học.\n\nKhoảng 300.000 năm sau khi xuất hiện, vật chất và năng lượng bắt đầu kết hợp thành những cấu trúc phức tạp, được gọi là các nguyên tử, sau đó chúng lại kết hợp thành các phân tử. Câu chuyện về các nguyên tử, phân tử, và các tương tác của chúng được gọi là hóa học.\n\nKhoảng 3,8 tỷ năm trước, trên một hành tinh được gọi là Trái Đất, các phân tử nhất định đã kết hợp với nhau để tạo thành các cấu trúc đặc biệt lớn và phức tạp gọi là các sinh vật. Câu chuyện về các sinh vật được gọi là sinh học.\n\nKhoảng 70.000 năm trước, các sinh vật thuộc loài Homo sapiens (Người tinh khôn) bắt đầu hình thành nên các cấu trúc thậm chí còn phức tạp hơn, được gọi là các nền văn hóa. Sự phát triển tiếp theo của những nền văn hóa con người này được gọi là lịch sử.`
        };

        function App() {
            const [view, setView] = useState('library'); 
            const [books, setBooks] = useState(() => {
                const saved = localStorage.getItem('aura_books');
                return saved ? JSON.parse(saved) : [INITIAL_BOOK];
            });
            const [activeBook, setActiveBook] = useState(null);
            
            // Cài đặt Reader
            const [theme, setTheme] = useState(() => localStorage.getItem('aura_theme') || 'oled');
            const [fontSize, setFontSize] = useState(() => parseInt(localStorage.getItem('aura_font')) || 18);
            const [uiVisible, setUiVisible] = useState(true);
            const [showSettings, setShowSettings] = useState(false);

            // TTS State
            const [isSpeaking, setIsSpeaking] = useState(false);
            const synth = window.speechSynthesis;
            const fileInputRef = useRef(null);

            useEffect(() => { localStorage.setItem('aura_theme', theme); }, [theme]);
            useEffect(() => { localStorage.setItem('aura_font', fontSize); }, [fontSize]);
            useEffect(() => { localStorage.setItem('aura_books', JSON.stringify(books)); }, [books]);

            // Dọn dẹp TTS khi unmount
            useEffect(() => {
                return () => { if (synth.speaking) synth.cancel(); }
            }, []);

            // --- XỬ LÝ NHẬP FILE TEXT ---
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const content = evt.target.result;
                    const newBook = {
                        id: 'book-' + Date.now(),
                        title: file.name.replace('.txt', ''),
                        author: "Tài liệu nạp vào",
                        cover: "bg-gradient-to-br from-indigo-500 to-purple-700",
                        type: "TXT",
                        content: content
                    };
                    setBooks([newBook, ...books]);
                };
                reader.readAsText(file);
            };

            const toggleUI = (e) => {
                // Chỉ toggle UI nếu bấm vào nền (không phải bấm vào nút/văn bản đang bôi đen)
                if (showSettings) {
                    setShowSettings(false);
                    return;
                }
                setUiVisible(!uiVisible);
            };

            const handlePlayTTS = (e) => {
                e.stopPropagation();
                if (!activeBook) return;

                if (isSpeaking) {
                    synth.pause();
                    setIsSpeaking(false);
                } else if (synth.paused) {
                    synth.resume();
                    setIsSpeaking(true);
                } else {
                    synth.cancel();
                    const utterance = new SpeechSynthesisUtterance(activeBook.content.substring(0, 1000)); // Đọc thử 1000 ký tự đầu
                    utterance.lang = 'vi-VN';
                    utterance.rate = 0.95;
                    utterance.onend = () => setIsSpeaking(false);
                    synth.speak(utterance);
                    setIsSpeaking(true);
                }
            };

            const closeReader = (e) => {
                e.stopPropagation();
                synth.cancel();
                setIsSpeaking(false);
                setActiveBook(null);
                setView('library');
            };

            const deleteBook = (e, id) => {
                e.stopPropagation();
                setBooks(books.filter(b => b.id !== id));
            };

            return (
                <div className="w-full h-full md:max-w-[428px] mx-auto bg-black md:rounded-[40px] md:shadow-2xl overflow-hidden relative font-ui md:border-[8px] border-slate-800 flex flex-col">
                    
                    {/* =========================================
                        LIBRARY VIEW
                        ========================================= */}
                    {view === 'library' && (
                        <div className="flex-1 flex flex-col bg-[#F2F2F7] fade-in">
                            <div className="pt-[env(safe-area-inset-top,47px)] px-6 pb-2 bg-[#F2F2F7]/90 backdrop-blur-md z-10 sticky top-0">
                                <div className="flex justify-between items-center mt-4">
                                    <h1 className="text-[32px] font-black text-slate-900 tracking-tight">Thư viện</h1>
                                    <button onClick={() => fileInputRef.current.click()} className="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-md active:scale-90 transition-transform">
                                        <Icon name="plus" size={20}/>
                                    </button>
                                    <input type="file" accept=".txt" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto hide-scrollbar px-6 pb-32">
                                {books.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center h-64 opacity-50">
                                        <Icon name="book-x" size={48} className="mb-4"/>
                                        <p>Chưa có sách nào.</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 gap-x-4 gap-y-6 mt-4">
                                        {books.map(book => (
                                            <div key={book.id} className="flex flex-col cursor-pointer group relative" onClick={() => { setActiveBook(book); setView('reader'); setUiVisible(true); }}>
                                                <div className={`w-full aspect-[2/3] ${book.cover} rounded-[16px] shadow-[0_8px_20px_rgba(0,0,0,0.12)] mb-3 flex items-center justify-center relative overflow-hidden group-active:scale-95 transition-transform duration-300`}>
                                                    <span className="absolute top-2 right-2 bg-black/30 backdrop-blur-md px-2 py-1 rounded-md text-[9px] text-white font-bold uppercase tracking-wider">{book.type}</span>
                                                    <Icon name={book.type === 'TXT' ? "file-text" : "book-open"} size={36} color="white" className="opacity-30"/>
                                                </div>
                                                <h3 className="font-bold text-[14px] text-slate-800 leading-snug line-clamp-2">{book.title}</h3>
                                                <p className="text-[12px] text-slate-500 mt-1 line-clamp-1">{book.author}</p>
                                                
                                                {book.id !== 'mock-1' && (
                                                    <button onClick={(e) => deleteBook(e, book.id)} className="absolute top-2 left-2 w-8 h-8 bg-black/40 backdrop-blur-md rounded-full text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <Icon name="trash-2" size={14}/>
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="absolute bottom-0 w-full pb-[env(safe-area-inset-bottom,20px)] pt-3 px-6 z-20">
                                <div className="bg-white/95 backdrop-blur-xl border border-slate-200 shadow-[0_10px_40px_rgba(0,0,0,0.08)] rounded-[28px] flex justify-around p-1">
                                    <button className="flex flex-col items-center p-2.5 w-20 text-blue-600 bg-blue-50/50 rounded-[20px]">
                                        <Icon name="library" size={24} fill="currentColor" className="opacity-20 absolute"/>
                                        <Icon name="library" size={22}/>
                                        <span className="text-[10px] font-bold mt-1">Sách</span>
                                    </button>
                                    <button className="flex flex-col items-center p-2.5 w-20 text-slate-400">
                                        <Icon name="headphones" size={22}/>
                                        <span className="text-[10px] font-semibold mt-1">Nghe</span>
                                    </button>
                                    <button className="flex flex-col items-center p-2.5 w-20 text-slate-400">
                                        <Icon name="settings" size={22}/>
                                        <span className="text-[10px] font-semibold mt-1">Cài đặt</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* =========================================
                        READER VIEW (GIAO DIỆN ĐỌC SÁCH)
                        ========================================= */}
                    {view === 'reader' && activeBook && (
                        <div className={`flex-1 flex flex-col relative transition-colors duration-500 theme-${theme}`}>
                            
                            {/* Khu vực chạm để toggle UI */}
                            <div className="absolute inset-0 z-0" onClick={toggleUI}></div>

                            {/* NỘI DUNG SÁCH */}
                            <div className="absolute inset-0 overflow-y-auto hide-scrollbar pt-[env(safe-area-inset-top,60px)] pb-[150px] px-6 z-10 pointer-events-none">
                                <div className="max-w-[600px] mx-auto pointer-events-auto selection:bg-blue-500/30">
                                    <h1 className="font-book font-bold text-3xl mb-2 mt-4 leading-tight">{activeBook.title}</h1>
                                    <p className="font-ui text-sm uppercase tracking-widest opacity-40 mb-12">{activeBook.author}</p>
                                    
                                    <div className="font-book leading-[1.8] text-justify" style={{ fontSize: `${fontSize}px` }}>
                                        {activeBook.content.split('\n').map((para, idx) => (
                                            para.trim() ? <p key={idx} className="mb-6 indent-6">{para.trim()}</p> : null
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* --- UI OVERLAY (HEADER & FOOTER) --- */}
                            <div className={`absolute inset-0 pointer-events-none z-20 will-change-transform transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] ${uiVisible ? 'opacity-100' : 'opacity-0'}`}>
                                
                                {/* Header */}
                                <div className={`absolute top-0 w-full pt-[env(safe-area-inset-top,47px)] pb-4 px-4 flex justify-between items-center pointer-events-auto transition-transform duration-400 ${uiVisible ? 'translate-y-0' : '-translate-y-full'}`}
                                     style={{ background: theme === 'oled' || theme === 'dark' ? 'linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, transparent 100%)' : 'linear-gradient(to bottom, rgba(255,255,255,0.95) 0%, transparent 100%)' }}
                                >
                                    <button onClick={closeReader} className={`w-10 h-10 rounded-full flex items-center justify-center active:scale-90 transition-transform ${theme==='oled'||theme==='dark'?'bg-white/10 text-white':'bg-slate-200/50 text-slate-800'}`}><Icon name="chevron-left" size={24}/></button>
                                    <div className="flex gap-2">
                                        <button onClick={(e) => { e.stopPropagation(); setShowSettings(!showSettings); }} className={`w-10 h-10 rounded-full flex items-center justify-center active:scale-90 transition-transform ${theme==='oled'||theme==='dark'?'bg-white/10 text-white':'bg-slate-200/50 text-slate-800'}`}><Icon name="type" size={20}/></button>
                                    </div>
                                </div>

                                {/* Footer (Trình phát Audio) */}
                                <div className={`absolute bottom-0 w-full pb-[calc(env(safe-area-inset-bottom,34px)+10px)] pt-10 px-6 pointer-events-auto transition-transform duration-400 ${uiVisible ? 'translate-y-0' : 'translate-y-full'}`}
                                     style={{ background: theme === 'oled' || theme === 'dark' ? 'linear-gradient(to top, rgba(0,0,0,1) 10%, rgba(0,0,0,0.8) 50%, transparent 100%)' : 'linear-gradient(to top, rgba(255,255,255,1) 10%, rgba(255,255,255,0.8) 50%, transparent 100%)' }}
                                >
                                    {/* Audio Player Capsule */}
                                    <div className={`p-1.5 pl-5 rounded-full flex items-center justify-between shadow-2xl backdrop-blur-xl ${theme === 'oled' || theme === 'dark' ? 'bg-slate-800/80 border border-slate-700' : 'bg-white/90 border border-slate-200'}`}>
                                        <div className="flex items-center gap-4">
                                            {isSpeaking ? (
                                                <div className="flex items-end gap-1 h-5 w-6 justify-center text-blue-500">
                                                    <div className="playing-bar h-2"></div><div className="playing-bar h-5"></div><div className="playing-bar h-3"></div><div className="playing-bar h-4"></div>
                                                </div>
                                            ) : (
                                                <Icon name="headphones" size={24} className="opacity-50" />
                                            )}
                                            <div className="flex flex-col">
                                                <span className="text-[14px] font-bold leading-tight">{isSpeaking ? 'Siri Đang đọc' : 'Nghe Sách Nói'}</span>
                                                <span className="text-[10px] opacity-50 uppercase tracking-widest font-semibold mt-0.5">Giọng Tiếng Việt AI</span>
                                            </div>
                                        </div>
                                        <button onClick={handlePlayTTS} className={`w-12 h-12 rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform ${isSpeaking ? 'bg-slate-200 text-slate-800' : 'bg-blue-600 text-white'}`}>
                                            <Icon name={isSpeaking ? "pause" : "play"} size={20} fill="currentColor" className={isSpeaking ? "" : "ml-1"}/>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* --- BẢNG CÀI ĐẶT FONT/THEME (MODAL) --- */}
                            {showSettings && (
                                <div className="absolute inset-0 z-50 flex items-end justify-center pointer-events-auto">
                                    <div className="absolute inset-0" onClick={() => setShowSettings(false)}></div>
                                    <div className={`w-full rounded-t-[40px] p-6 slide-up-modal shadow-[0_-10px_50px_rgba(0,0,0,0.3)] ${theme === 'oled' || theme === 'dark' ? 'bg-[#1C1C1E] text-white border-t border-slate-800' : 'bg-white text-slate-900 border-t border-slate-200'} pb-[calc(env(safe-area-inset-bottom,34px)+20px)] relative z-10`}>
                                        <div className="w-12 h-1.5 bg-slate-500/30 rounded-full mx-auto mb-8"></div>
                                        
                                        <h3 className="text-[11px] font-bold uppercase tracking-widest opacity-40 mb-3">Độ sáng & Chủ đề</h3>
                                        <div className="flex justify-between gap-3 mb-8">
                                            <button onClick={() => setTheme('light')} className={`flex-1 aspect-square rounded-[20px] bg-[#FFFFFF] border-2 flex items-center justify-center text-slate-900 font-bold text-xl shadow-sm ${theme==='light' ? 'border-blue-500' : 'border-slate-200'}`}>Aa</button>
                                            <button onClick={() => setTheme('sepia')} className={`flex-1 aspect-square rounded-[20px] bg-[#F4ECD8] border-2 flex items-center justify-center text-[#5B4636] font-bold text-xl shadow-sm ${theme==='sepia' ? 'border-blue-500' : 'border-transparent'}`}>Aa</button>
                                            <button onClick={() => setTheme('dark')} className={`flex-1 aspect-square rounded-[20px] bg-[#1C1C1E] border-2 flex items-center justify-center text-white font-bold text-xl shadow-sm ${theme==='dark' ? 'border-blue-500' : 'border-slate-700'}`}>Aa</button>
                                            <button onClick={() => setTheme('oled')} className={`flex-1 aspect-square rounded-[20px] bg-[#000000] border-2 flex items-center justify-center text-white font-bold text-xl shadow-sm ${theme==='oled' ? 'border-blue-500' : 'border-slate-800'}`}>Aa</button>
                                        </div>

                                        <h3 className="text-[11px] font-bold uppercase tracking-widest opacity-40 mb-3">Kích thước chữ</h3>
                                        <div className={`flex items-center rounded-[24px] p-2 ${theme === 'oled' || theme === 'dark' ? 'bg-[#2C2C2E]' : 'bg-slate-100'}`}>
                                            <button onClick={() => setFontSize(Math.max(14, fontSize - 2))} className="w-16 h-14 flex items-center justify-center font-book text-lg active:opacity-50">A-</button>
                                            <div className="flex-1 text-center font-bold text-[16px]">{fontSize}</div>
                                            <button onClick={() => setFontSize(Math.min(36, fontSize + 2))} className="w-16 h-14 flex items-center justify-center font-book text-2xl active:opacity-50">A+</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
