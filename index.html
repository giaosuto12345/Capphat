<!DOCTYPE html>
<html lang="vi" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Aura Reader V5</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    
    <!-- React & DOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- PDF.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

    <!-- IndexedDB -->
    <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>

    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --ios-blur-light: rgba(255, 255, 255, 0.85);
            --ios-blur-dark: rgba(28, 28, 30, 0.85);
        }
        
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            touch-action: pan-x pan-y; /* Cho phép zoom trên canvas */
        }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .bottom-sheet { transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
        .bottom-sheet-hidden { transform: translateY(100%); }
        .bottom-sheet-visible { transform: translateY(0); }

        .sidebar { transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
        .sidebar-hidden { transform: translateX(-100%); }
        .sidebar-visible { transform: translateX(0); }

        /* TXT Themes */
        .theme-light { background-color: #FFFFFF; color: #1C1C1E; }
        .theme-sepia { background-color: #F8F1E3; color: #5B4636; }
        .theme-dark { background-color: #2C2C2E; color: #E5E5EA; }
        
        .glass-light { background: var(--ios-blur-light); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid rgba(0,0,0,0.1); }
        .glass-dark { background: var(--ios-blur-dark); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #fff; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Canvas Wrapper cho PDF */
        .pdf-canvas-container {
            display: flex; justify-content: center; align-items: center;
            min-height: 100%; width: 100%;
            background-color: #E5E5EA; /* Nền xám bao quanh viền trang PDF */
            overflow: auto;
        }
        
        .dark .pdf-canvas-container { background-color: #1C1C1E; }
        
        canvas {
            max-width: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            background: white; /* Bắt buộc trang PDF nền trắng */
        }
    </style>
</head>
<body class="text-slate-900 bg-black">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback, useLayoutEffect } = React;

        // NEW DATABASE ENGINE: PDF lưu nguyên file (ArrayBuffer)
        const DB = {
            async saveBook(bookData) {
                const books = await this.getBooks();
                const newBooks = [bookData, ...books.filter(b => b.id !== bookData.id)];
                await idbKeyval.set('ar_library_v5', newBooks);
            },
            async getBooks() { return await idbKeyval.get('ar_library_v5') || []; },
            async deleteBook(id) {
                const books = await this.getBooks();
                await idbKeyval.set('ar_library_v5', books.filter(b => b.id !== id));
                await idbKeyval.del(`file_${id}`); // Xóa file thật
                await idbKeyval.del(`prog_${id}`); // Xóa tiến trình
            },
            async saveFile(bookId, data) { await idbKeyval.set(`file_${bookId}`, data); },
            async getFile(bookId) { return await idbKeyval.get(`file_${bookId}`); },
            async saveProgress(bookId, data) { await idbKeyval.set(`prog_${bookId}`, data); },
            async getProgress(bookId) { return await idbKeyval.get(`prog_${bookId}`); }
        };

        const Icon = ({ name, size = 24, className = '' }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px; stroke:currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none;"></i>`;
                    iconRef.current.appendChild(tempDiv.firstChild);
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, size]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        const Loader = ({ text }) => (
            <div className="fixed inset-0 z-[9999] bg-black/80 backdrop-blur-md flex flex-col items-center justify-center text-white transition-opacity">
                <div className="spinner mb-4"></div>
                <h2 className="text-xl font-bold animate-pulse">{text}</h2>
            </div>
        );

        const parsePDFOutline = async (pdfDoc) => {
            try {
                const outline = await pdfDoc.getOutline();
                if (!outline || outline.length === 0) return [];
                const map = [];
                const processItems = async (items, depth = 0) => {
                    for (const item of items) {
                        let pageIndex = -1;
                        if (typeof item.dest === 'string') pageIndex = await pdfDoc.getPageIndex(await pdfDoc.getDestination(item.dest));
                        else if (Array.isArray(item.dest)) {
                            try { pageIndex = await pdfDoc.getPageIndex(item.dest[0]); } catch(e){}
                        }
                        if (pageIndex !== -1) map.push({ title: item.title, page: pageIndex + 1, depth });
                        if (item.items && item.items.length > 0) await processItems(item.items, depth + 1);
                    }
                };
                await processItems(outline);
                return map;
            } catch (err) { return []; }
        };

        const processFile = async (file, onProgress) => {
            const ext = file.name.split('.').pop().toLowerCase();
            const bookId = 'book_' + Date.now();
            let meta = { id: bookId, title: file.name.replace(/\.(pdf|txt)$/i, ''), type: ext.toUpperCase(), cover: `hsl(${Math.random()*360}, 70%, 20%)`, totalPages: 0 };

            if (ext === 'pdf') {
                onProgress("Đang phân tích cấu trúc PDF...");
                const arrayBuffer = await file.arrayBuffer();
                
                // Mở thử để lấy số trang và mục lục (Dùng bản sao slice(0) để tránh detach buffer)
                const pdfDoc = await window.pdfjsLib.getDocument(new Uint8Array(arrayBuffer.slice(0))).promise;
                meta.totalPages = pdfDoc.numPages;
                meta.toc = await parsePDFOutline(pdfDoc);
                
                // Lưu NGUYÊN GỐC file nhị phân vào DB (Chìa khóa để không hỏng định dạng)
                await DB.saveFile(bookId, arrayBuffer);
            } 
            else if (ext === 'txt') {
                onProgress("Đang phân tích văn bản...");
                let content = await file.text();
                // Phân tích chương cơ bản cho TXT
                const chapters = [];
                const regex = /(?:^|\n)(?:\s*)(Chương|Hồi|Quyển)(?:\s+)([\d\w]+)[^\n]*/gi;
                let matches = [...content.matchAll(regex)];
                
                if (matches.length === 0) {
                    chapters.push({ title: "Toàn bộ nội dung", content: content, order: 0 });
                } else {
                    for (let i = 0; i < matches.length; i++) {
                        const start = matches[i].index;
                        const end = (i + 1 < matches.length) ? matches[i + 1].index : content.length;
                        chapters.push({ title: matches[i][0].trim(), content: content.slice(start, end).trim(), order: i });
                    }
                }
                meta.totalPages = chapters.length; // Trong txt, totalPages đại diện số chương
                await DB.saveFile(bookId, chapters);
            }

            await DB.saveBook(meta);
            return meta;
        };

        function App() {
            const [books, setBooks] = useState([]);
            const [activeBook, setActiveBook] = useState(null);
            const [sys, setSys] = useState({ isLoading: true, text: "Đang tải thư viện..." });
            const fileRef = useRef(null);

            useEffect(() => {
                DB.getBooks().then(res => { setBooks(res); setSys({isLoading: false}); }).catch(()=>setSys({isLoading:false}));
            }, []);

            const onUpload = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                e.target.value = '';
                try {
                    setSys({ isLoading: true, text: "Đang đọc file..." });
                    const newBook = await processFile(file, txt => setSys({isLoading: true, text: txt}));
                    setBooks(p => [newBook, ...p]);
                } catch (error) {
                    alert("Lỗi tải sách. File quá lớn hoặc bị hỏng.");
                    console.error(error);
                } finally { setSys({ isLoading: false }); }
            };

            return (
                <div className="w-full h-full relative bg-[#F2F2F7] dark:bg-black font-sans">
                    {sys.isLoading && <Loader text={sys.text} />}
                    
                    {!activeBook ? (
                        <div className="w-full h-full overflow-y-auto pt-[var(--safe-top)] px-[var(--safe-left)] pr-[var(--safe-right)]">
                            <div className="max-w-6xl mx-auto px-6 py-8">
                                <div className="flex justify-between items-end mb-10">
                                    <div>
                                        <h1 className="text-4xl font-extrabold text-slate-900 dark:text-white">Thư viện</h1>
                                        <p className="text-slate-500 mt-1">Đã lưu trữ {books.length} cuốn</p>
                                    </div>
                                    <button onClick={() => fileRef.current?.click()} className="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg active:scale-95">
                                        <Icon name="plus" />
                                    </button>
                                </div>
                                
                                <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 pb-20">
                                    {books.map(b => (
                                        <div key={b.id} className="group relative">
                                            <div onClick={() => setActiveBook(b)} className="w-full aspect-[2/3] rounded-xl shadow-md overflow-hidden cursor-pointer active:scale-95 transition-transform flex flex-col justify-center items-center p-4" style={{backgroundColor: b.cover}}>
                                                <span className="absolute top-2 left-2 bg-black/40 px-1.5 py-0.5 rounded text-[10px] font-bold text-white uppercase">{b.type}</span>
                                                <h3 className="text-white font-serif font-bold text-center line-clamp-4 drop-shadow-md">{b.title}</h3>
                                            </div>
                                            <button onClick={() => DB.deleteBook(b.id).then(()=>setBooks(books.filter(x=>x.id!==b.id)))} className="absolute -top-2 -right-2 w-8 h-8 bg-red-500 rounded-full flex items-center justify-center text-white shadow-lg md:opacity-0 group-hover:opacity-100 transition-opacity">
                                                <Icon name="trash-2" size={16}/>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <input type="file" accept=".txt,.pdf" ref={fileRef} onChange={onUpload} className="hidden" />
                        </div>
                    ) : (
                        <ReaderEngine book={activeBook} onClose={() => setActiveBook(null)} />
                    )}
                </div>
            );
        }

        function ReaderEngine({ book, onClose }) {
            const [uiVisible, setUiVisible] = useState(true);
            const [showToc, setShowToc] = useState(false);
            const [currentPage, setCurrentPage] = useState(1);
            
            // Lấy tiến trình
            useEffect(() => {
                DB.getProgress(book.id).then(prog => {
                    if (prog && prog.page) setCurrentPage(prog.page);
                });
            }, [book.id]);

            const updatePage = (p) => {
                setCurrentPage(p);
                DB.saveProgress(book.id, { page: p });
            };

            const toggleUI = () => setUiVisible(!uiVisible);

            return (
                <div className="w-full h-full relative bg-white dark:bg-[#1C1C1E]">
                    
                    {/* KHU VỰC ĐỌC (Tách biệt PDF và TXT) */}
                    {book.type === 'PDF' ? (
                        <PDFRenderer book={book} currentPage={currentPage} onPageChange={updatePage} onToggleUI={toggleUI} />
                    ) : (
                        <TXTRenderer book={book} currentPage={currentPage} onPageChange={updatePage} onToggleUI={toggleUI} />
                    )}

                    {/* OVERLAY UI (HEADER / FOOTER) */}
                    <div className={`absolute top-0 w-full pt-[var(--safe-top)] z-20 transition-transform duration-300 ${uiVisible ? 'translate-y-0' : '-translate-y-full'}`}>
                        <div className="glass-light dark:glass-dark text-slate-900 dark:text-white flex justify-between items-center px-2 pb-2 pt-2">
                            <button onClick={onClose} className="p-3 active:opacity-50"><Icon name="chevron-left" /></button>
                            <div className="text-center flex-1 px-4 truncate font-semibold text-sm">{book.title}</div>
                            <button onClick={() => setShowToc(true)} className="p-3 active:opacity-50"><Icon name="list" /></button>
                        </div>
                    </div>

                    {/* PDF FOOTER (Điều hướng trang) */}
                    <div className={`absolute bottom-0 w-full pb-[var(--safe-bottom)] z-20 transition-transform duration-300 ${uiVisible ? 'translate-y-0' : 'translate-y-full'}`}>
                        <div className="glass-light dark:glass-dark text-slate-900 dark:text-white p-4">
                            <div className="flex items-center justify-between max-w-md mx-auto">
                                <button onClick={() => updatePage(Math.max(1, currentPage - 1))} disabled={currentPage <= 1} className="p-3 disabled:opacity-20"><Icon name="arrow-left" /></button>
                                <span className="font-mono font-medium text-sm">Trang {currentPage} / {book.totalPages}</span>
                                <button onClick={() => updatePage(Math.min(book.totalPages, currentPage + 1))} disabled={currentPage >= book.totalPages} className="p-3 disabled:opacity-20"><Icon name="arrow-right" /></button>
                            </div>
                        </div>
                    </div>

                    {/* SIDEBAR MỤC LỤC */}
                    <div className={`fixed inset-0 z-50 transition-opacity ${showToc ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
                        <div className="absolute inset-0 bg-black/50" onClick={() => setShowToc(false)}></div>
                        <div className={`absolute top-0 left-0 w-4/5 max-w-[350px] h-full bg-white dark:bg-[#1C1C1E] shadow-2xl flex flex-col transition-transform duration-300 ${showToc ? 'translate-x-0' : '-translate-x-full'}`}>
                            <div className="p-5 pt-[calc(var(--safe-top)+20px)] border-b dark:border-slate-800 text-slate-900 dark:text-white font-bold text-xl flex justify-between">
                                <span>Mục lục</span>
                                <button onClick={() => setShowToc(false)}><Icon name="x" size={20}/></button>
                            </div>
                            <div className="flex-1 overflow-y-auto hide-scroll p-2">
                                {book.type === 'PDF' && book.toc ? (
                                    book.toc.map((item, idx) => (
                                        <div key={idx} onClick={() => { updatePage(item.page); setShowToc(false); }} className={`p-3 text-sm border-b dark:border-slate-800 cursor-pointer active:bg-slate-100 dark:active:bg-slate-800 text-slate-800 dark:text-slate-300`} style={{ paddingLeft: `${(item.depth*12) + 12}px` }}>
                                            {item.title} <span className="text-xs opacity-50 float-right">Tr.{item.page}</span>
                                        </div>
                                    ))
                                ) : (
                                    <div className="p-4 text-center text-sm opacity-50 text-slate-900 dark:text-white">Không có mục lục cụ thể</div>
                                )}
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        function PDFRenderer({ book, currentPage, onPageChange, onToggleUI }) {
            const canvasRef = useRef(null);
            const [pdfDoc, setPdfDoc] = useState(null);
            const [scale, setScale] = useState(1.0); // Mặc định vừa màn hình
            const [loadingPage, setLoadingPage] = useState(true);

            // Tải raw data và khởi tạo PDFjs
            useEffect(() => {
                let active = true;
                DB.getFile(book.id).then(async arrayBuffer => {
                    if (!active || !arrayBuffer) return;
                    try {
                        // Tránh lỗi detach ArrayBuffer khi load lại
                        const pdf = await window.pdfjsLib.getDocument(new Uint8Array(arrayBuffer.slice(0))).promise;
                        if(active) setPdfDoc(pdf);
                    } catch(e) { console.error("Lỗi nạp PDF", e); }
                });
                return () => { active = false; pdfDoc && pdfDoc.destroy(); };
            }, [book.id]);

            // Hàm render 1 trang ra Canvas
            const renderPage = useCallback(async (pageNum) => {
                if (!pdfDoc || !canvasRef.current) return;
                setLoadingPage(true);
                try {
                    const page = await pdfDoc.getPage(pageNum);
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    
                    // Tính toán Scale để vừa chiều rộng màn hình thiết bị
                    const viewportTheoTyLe1 = page.getViewport({ scale: 1 });
                    const screenWidth = window.innerWidth;
                    // Lấy tỷ lệ scale sao cho bề rộng trang PDF fit bề rộng màn hình
                    const fitScale = screenWidth / viewportTheoTyLe1.width;
                    const finalScale = fitScale * scale; 
                    
                    const viewport = page.getViewport({ scale: finalScale });
                    
                    // Tăng độ nét (Resolution) cho màn hình Retina
                    const outputScale = window.devicePixelRatio || 1;
                    canvas.width = Math.floor(viewport.width * outputScale);
                    canvas.height = Math.floor(viewport.height * outputScale);
                    canvas.style.width = Math.floor(viewport.width) + "px";
                    canvas.style.height =  Math.floor(viewport.height) + "px";

                    const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                    const renderContext = { canvasContext: ctx, transform: transform, viewport: viewport };
                    await page.render(renderContext).promise;
                } catch(e) { console.error("Render Page Error", e); }
                setLoadingPage(false);
            }, [pdfDoc, scale]);

            useEffect(() => {
                renderPage(currentPage);
            }, [currentPage, renderPage]);

            // Chạm lật trang PDF
            const handleTap = (e) => {
                const w = window.innerWidth;
                const x = e.clientX;
                if (x < w * 0.2) { // Cạnh trái
                    if(currentPage > 1) onPageChange(currentPage - 1);
                } else if (x > w * 0.8) { // Cạnh phải
                    if(currentPage < book.totalPages) onPageChange(currentPage + 1);
                } else {
                    onToggleUI(); // Giữa màn hình
                }
            };

            return (
                <div className="pdf-canvas-container" onClick={handleTap}>
                    {loadingPage && <div className="absolute inset-0 flex items-center justify-center bg-white/50 dark:bg-black/50 z-10"><div className="spinner !border-blue-500"></div></div>}
                    <canvas ref={canvasRef} className="transition-opacity duration-300" style={{opacity: loadingPage ? 0.3 : 1}}></canvas>
                </div>
            );
        }

        function TXTRenderer({ book, currentPage, onPageChange, onToggleUI }) {
            const [content, setContent] = useState("");
            
            useEffect(() => {
                DB.getFile(book.id).then(chapters => {
                    if (chapters && chapters[currentPage - 1]) {
                        setContent(chapters[currentPage - 1].content);
                    }
                });
            }, [book.id, currentPage]);

            return (
                <div className="w-full h-full overflow-y-auto bg-[#F8F1E3] dark:bg-[#2C2C2E] text-[#5B4636] dark:text-[#E5E5EA]" onClick={onToggleUI}>
                    <div className="max-w-2xl mx-auto px-6 pt-[calc(var(--safe-top)+80px)] pb-[calc(var(--safe-bottom)+100px)] text-lg leading-relaxed font-serif text-justify">
                        {content.split('\n').map((p, i) => (
                            <p key={i} className="mb-4 indent-6">{p}</p>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
