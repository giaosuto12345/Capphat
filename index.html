<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Sơ Đồ Kho Đạn Chuyên Nghiệp</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f172a; margin: 0; overflow: hidden; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        input:focus, button:focus, select:focus { outline: none; }
        
        /* Cuộn tùy chỉnh */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .light-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; }
        .light-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .blueprint-bg {
            background-color: #f8fafc;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .tab-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .panel-section { display: none; }
        .panel-section.active { display: flex; flex-direction: column; }
        
        .svg-container svg text { user-select: none; }
        .hover-group:hover rect.cell-bg { fill: #f1f5f9; cursor: crosshair; }
    </style>
</head>
<body class="flex flex-col h-screen text-sm">

    <!-- HEADER -->
    <header class="bg-[#1e293b] text-white h-[60px] shrink-0 flex justify-between items-center px-4 border-b border-[#334155] z-30 shadow-md">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-2 rounded-lg shadow-lg">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            </div>
            <div>
                <h1 class="font-black text-base md:text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 m-0 leading-tight">AMMO PLANNER</h1>
                <p class="text-[10px] text-slate-400 font-bold m-0 tracking-widest uppercase hidden md:block">Quản lý sơ đồ xếp kho</p>
            </div>
        </div>

        <div class="hidden md:flex gap-6 text-xs font-bold bg-[#0f172a] px-5 py-2 rounded-full border border-[#334155]">
            <div class="flex items-center gap-2"><span class="text-slate-400">Lô:</span><span id="kpiLots" class="text-white text-base">0</span></div>
            <div class="flex items-center gap-2"><span class="text-slate-400">Viên:</span><span id="kpiItems" class="text-emerald-400 text-base">0</span></div>
            <div class="flex items-center gap-2"><span class="text-slate-400">Hòm:</span><span id="kpiBoxes" class="text-blue-400 text-base">0</span></div>
        </div>

        <div class="flex gap-2">
            <button onclick="downloadTemplate()" class="hidden md:flex bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded font-bold items-center gap-2 transition-colors border border-slate-600 text-xs">
                ⬇️ File Mẫu
            </button>
            <button onclick="document.getElementById('excelUpload').click()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded font-bold flex items-center gap-2 transition-colors shadow-[0_0_10px_rgba(16,185,129,0.3)] text-xs">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <span class="hidden sm:inline">Nhập Excel</span>
            </button>
            <input type="file" id="excelUpload" accept=".xlsx, .xls" class="hidden" onchange="importExcel(event)">
        </div>
    </header>

    <!-- MAIN APP -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- SIDEBAR -->
        <aside class="w-full md:w-[450px] bg-[#1e293b] border-r border-[#334155] flex flex-col absolute md:relative z-20 h-full transition-transform duration-300 shadow-2xl md:shadow-none" id="sidebar">
            
            <div class="flex p-2 gap-1 bg-[#0f172a] shrink-0 border-b border-[#334155]">
                <button onclick="switchPanel('data')" id="tabData" class="tab-btn active flex-1 py-2.5 rounded font-bold text-xs border border-transparent bg-[#1e293b] text-slate-400 transition-colors uppercase tracking-wider">📦 Danh sách Lô</button>
                <button onclick="switchPanel('settings')" id="tabSettings" class="tab-btn flex-1 py-2.5 rounded font-bold text-xs border border-transparent bg-[#1e293b] text-slate-400 transition-colors uppercase tracking-wider">⚙️ Cài đặt Kho</button>
            </div>

            <!-- PANEL 1: DATA -->
            <div id="panelData" class="panel-section active flex-1 overflow-hidden">
                <div class="p-3 border-b border-[#334155] flex justify-between items-center bg-[#1e293b] shrink-0">
                    <span class="text-xs font-bold text-slate-400">Đang có: <span id="countItems" class="text-white bg-blue-600 px-2 py-0.5 rounded-full ml-1">0</span> lô</span>
                    <button onclick="addNewItem()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded text-xs font-bold transition-all shadow-md">
                        + THÊM LÔ THỦ CÔNG
                    </button>
                </div>
                
                <!-- Khu vực Scroll -->
                <div class="flex-1 overflow-y-auto p-3 space-y-3 pb-20 md:pb-4" style="min-height: 0;" id="dataContainer">
                    <!-- Javascript Render -->
                </div>
            </div>

            <!-- PANEL 2: SETTINGS -->
            <div id="panelSettings" class="panel-section flex-1 overflow-y-auto p-4 pb-20 md:pb-4" style="min-height: 0;">
                
                <div class="bg-[#0f172a] p-4 rounded-xl border border-[#334155] mb-5">
                    <h3 class="text-xs font-black text-blue-400 mb-4 uppercase tracking-widest flex items-center gap-2">
                        <span>1</span> KÍCH THƯỚC KHÔNG GIAN
                    </h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[11px] text-slate-400 font-bold block mb-1">DỌC (Số Hòm / Chồng)</label>
                            <input type="number" id="cfgMaxHeight" value="24" onchange="updateConfig()" class="w-full bg-[#1e293b] text-white font-bold text-lg p-2 rounded outline-none focus:ring-1 focus:ring-blue-500 border border-[#334155] text-center">
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400 font-bold block mb-1">NGANG (Số Chồng / Dãy)</label>
                            <input type="number" id="cfgMaxCols" value="10" onchange="updateConfig()" class="w-full bg-[#1e293b] text-white font-bold text-lg p-2 rounded outline-none focus:ring-1 focus:ring-blue-500 border border-[#334155] text-center">
                        </div>
                    </div>
                </div>

                <div class="bg-[#0f172a] p-4 rounded-xl border border-[#334155] mb-5">
                    <h3 class="text-xs font-black text-emerald-400 mb-4 uppercase tracking-widest flex items-center gap-2">
                        <span>2</span> THUẬT TOÁN XẾP
                    </h3>
                    <label class="flex items-center justify-between cursor-pointer group">
                        <div class="pr-4">
                            <span class="block text-sm font-bold text-white mb-1">Xếp chung Lô (Ghép Hòm)</span>
                            <span class="block text-[11px] text-slate-400 leading-snug">Nếu 1 chồng chưa đạt tối đa chiều dọc, phần mềm sẽ tự lấy lô tiếp theo xếp đè lên cho đủ.</span>
                        </div>
                        <div class="relative w-12 h-6 rounded-full transition-colors bg-emerald-500 shrink-0" id="toggleBg">
                            <input type="checkbox" id="cfgAllowMix" checked onchange="updateConfig()" class="sr-only">
                            <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform translate-x-6" id="toggleDot"></div>
                        </div>
                    </label>
                </div>

                <div class="bg-[#0f172a] p-4 rounded-xl border border-[#334155] mb-5">
                    <h3 class="text-xs font-black text-purple-400 mb-4 uppercase tracking-widest flex items-center gap-2">
                        <span>3</span> QUY CÁCH CHUNG
                    </h3>
                    <label class="text-[11px] text-slate-400 font-bold block mb-2">Bao gói mặc định (Viên/Hòm)</label>
                    <div class="flex gap-2">
                        <input type="number" id="cfgDefaultPack" value="1000" onchange="updateConfig()" class="w-1/2 bg-[#1e293b] text-white font-bold p-2 rounded outline-none focus:ring-1 focus:ring-purple-500 border border-[#334155] text-center text-lg">
                        <button onclick="applyPackToAll()" class="w-1/2 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold rounded transition-colors shadow-lg">ĐỒNG BỘ TẤT CẢ</button>
                    </div>
                </div>

            </div>

            <!-- Mobile Close Button -->
            <button onclick="toggleMobileSidebar()" class="md:hidden absolute bottom-4 left-4 right-4 bg-red-500 text-white font-bold py-3 rounded shadow-lg z-50">
                ĐÓNG BẢNG ĐIỀU KHIỂN
            </button>
        </aside>

        <!-- CANVAS RIGHT -->
        <main class="flex-1 blueprint-bg overflow-auto relative flex flex-col" id="canvasWrapper">
            
            <!-- Toolbar Trực Quan -->
            <div class="bg-white/90 backdrop-blur border-b border-slate-200 p-3 shrink-0 sticky top-0 z-20 flex flex-wrap justify-between items-center shadow-sm gap-3">
                <div class="flex items-center gap-3">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Chế độ xem:</span>
                    <select id="viewMode" onchange="triggerRender()" class="bg-blue-50 border border-blue-200 text-blue-700 text-sm font-bold rounded-lg px-3 py-1.5 outline-none cursor-pointer hover:bg-blue-100 transition-colors">
                        <option value="1">Sơ đồ Khối (Lưới Ô vuông)</option>
                        <option value="2">Sơ đồ Mặt cắt (Ziczac)</option>
                    </select>
                </div>

                <div class="md:hidden flex gap-2">
                    <button onclick="toggleMobileSidebar()" class="bg-slate-800 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-md">
                        ⚙️ MỞ CÀI ĐẶT
                    </button>
                </div>
            </div>

            <div class="flex-1 p-4 md:p-8 flex flex-col items-center">
                <div id="svgContainer" class="w-full flex flex-col items-center gap-12">
                    <!-- SVG ROWS RENDER HERE -->
                </div>
            </div>
        </main>
    </div>

    <!-- Thông báo -->
    <div id="toastMsg" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl font-bold text-sm transition-all duration-300 opacity-0 pointer-events-none translate-y-4 z-50 flex items-center gap-2 border border-slate-600">
        ✅ <span id="toastText">Thành công!</span>
    </div>

    <script>
        // --- DATA STATE ---
        const state = {
            config: {
                maxHeight: 24,    
                maxCols: 10,      
                defaultPack: 1000,
                allowMix: true    
            },
            items: [
                { id: 1, type: 'ĐẠN CX14.5', lot: '0312-1975-41', qty: 20404, pack: 1000 },
                { id: 2, type: 'ĐẠN CX14.5', lot: '0038-75-41', qty: 2048, pack: 100 },
                { id: 3, type: 'ĐẠN CX14.5', lot: '0308-1975-71', qty: 12866, pack: 1000 },
                { id: 4, type: 'ĐẠN CX14.5', lot: '0071-1975-71', qty: 10865, pack: 1000 },
                { id: 5, type: 'ĐẠN CX14.5', lot: '0074-75-41', qty: 4668, pack: 1000 },
            ]
        };

        // --- ALGORITHM ---
        function calculateStacks() {
            const stacks = [];
            let currentStack = [];
            let currentStackCount = 0;

            state.items.forEach((item) => {
                let totalQty = Number(item.qty) || 0;
                let pack = Number(item.pack) || 1;
                let boxes = Math.floor(totalQty / pack);
                let leftover = totalQty % pack;

                while (boxes > 0) {
                    if (currentStackCount === state.config.maxHeight || (!state.config.allowMix && currentStackCount > 0 && currentStack.length > 0)) {
                        stacks.push([...currentStack]);
                        currentStack = [];
                        currentStackCount = 0;
                    }

                    let spaceLeft = state.config.maxHeight - currentStackCount;
                    let takeBoxes = Math.min(boxes, spaceLeft);

                    currentStack.push({ ...item, boxesInCol: takeBoxes, showLeftover: (boxes - takeBoxes === 0) ? leftover : 0 });
                    currentStackCount += takeBoxes;
                    boxes -= takeBoxes;
                }
                
                if (Math.floor(totalQty / pack) === 0 && leftover > 0) {
                    if (currentStackCount === state.config.maxHeight || (!state.config.allowMix && currentStackCount > 0)) {
                        stacks.push([...currentStack]);
                        currentStack = [];
                        currentStackCount = 0;
                    }
                    currentStack.push({ ...item, boxesInCol: 0, showLeftover: leftover });
                }
            });

            if (currentStack.length > 0) stacks.push([...currentStack]);
            return stacks;
        }

        // --- RENDER INPUT LIST ---
        function renderInputPanel() {
            const container = document.getElementById('dataContainer');
            let html = '';

            state.items.forEach((item, idx) => {
                const pck = Number(item.pack)||1;
                const boxes = Math.floor(item.qty / pck);
                const leftover = item.qty % pck;
                
                let leftoverText = leftover > 0 ? `<div class="mt-2 bg-red-500/10 text-red-400 text-[11px] font-bold px-2 py-1 rounded border border-red-500/20 w-max">⚠️ Lẻ ${leftover} viên</div>` : '';

                html += `
                    <div class="bg-[#1e293b] border border-[#334155] rounded-xl p-4 relative transition-colors focus-within:border-blue-500 shadow-sm">
                        <div class="absolute -top-2.5 -left-2.5 w-6 h-6 bg-slate-700 text-white rounded-full flex items-center justify-center text-[11px] font-bold shadow-md border border-[#334155]">
                            ${idx + 1}
                        </div>
                        <button onclick="removeItem(${item.id})" class="absolute top-2 right-2 text-slate-500 hover:text-red-400 p-1.5 hover:bg-red-500/10 rounded-lg transition-colors" title="Xóa lô này">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                        
                        <div class="grid grid-cols-2 gap-3 mb-3 pr-6 mt-1">
                            <div>
                                <label class="text-[10px] text-slate-500 font-bold block mb-1">Loại đạn</label>
                                <input type="text" placeholder="Loại đạn..." value="${item.type}" onchange="updateItem(${item.id}, 'type', this.value)" class="w-full bg-[#0f172a] border border-[#334155] focus:border-blue-500 text-white text-sm font-bold px-2 py-1.5 rounded outline-none transition-colors">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-500 font-bold block mb-1">Mã Lô</label>
                                <input type="text" placeholder="Mã lô..." value="${item.lot}" onchange="updateItem(${item.id}, 'lot', this.value)" class="w-full bg-[#0f172a] border border-[#334155] focus:border-blue-500 text-[#38bdf8] text-sm font-black px-2 py-1.5 rounded outline-none transition-colors">
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] text-slate-500 font-bold block mb-1">T.Số Viên</label>
                                <input type="number" value="${item.qty}" onchange="updateItem(${item.id}, 'qty', this.value)" class="w-full bg-[#0f172a] border border-[#334155] focus:border-emerald-500 text-emerald-400 font-bold px-2 py-1.5 rounded outline-none text-sm">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-500 font-bold block mb-1">Bao gói</label>
                                <input type="number" value="${item.pack}" onchange="updateItem(${item.id}, 'pack', this.value)" class="w-full bg-[#0f172a] border border-[#334155] focus:border-purple-500 text-purple-400 font-bold px-2 py-1.5 rounded outline-none text-sm">
                            </div>
                        </div>
                        
                        <div class="mt-3 pt-3 border-t border-[#334155] flex justify-between items-start">
                            <div>
                                <span class="text-xs text-slate-400">Quy ra: <b class="text-base text-white">${boxes}</b> hòm chẵn</span>
                                ${leftoverText}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('countItems').innerText = state.items.length;
        }

        // --- RENDER SVG CANVAS ---
        function renderDiagram() {
            const allStacks = calculateStacks();
            const container = document.getElementById('svgContainer');
            const viewMode = document.getElementById('viewMode').value; // 1: Block, 2: Ziczac
            
            const maxCols = state.config.maxCols;
            const maxH = state.config.maxHeight;

            const rows = [];
            for (let i = 0; i < allStacks.length; i += maxCols) {
                rows.push(allStacks.slice(i, i + maxCols));
            }

            if (rows.length === 0) {
                container.innerHTML = `<div class="bg-white p-10 rounded-xl shadow border border-slate-200 text-slate-400 text-center flex flex-col items-center justify-center min-w-[300px]"><span class="text-4xl mb-2">📦</span><span>Chưa có dữ liệu để vẽ sơ đồ.</span></div>`;
                return;
            }

            // --- THÔNG SỐ ĐỒ HỌA ---
            const COL_W = viewMode === "1" ? 160 : 140; 
            const MAX_COL_H = viewMode === "1" ? 180 : 350; // Dạng lưới ô thì thấp hơn
            const BOX_H = viewMode === "1" ? 0 : MAX_COL_H / maxH; // Dạng lưới không tính tỷ lệ cao
            
            const svgWidth = maxCols * COL_W;

            let html = '';

            rows.forEach((rowStacks, rowIdx) => {
                // Info block height
                const infoHeight = 120;
                const topMargin = 40;
                const svgHeight = topMargin + MAX_COL_H + infoHeight;
                
                let svgHtml = `<div class="relative bg-white shadow-xl rounded-lg border-2 border-slate-800 p-2 overflow-x-auto light-scroll max-w-[95vw]">
                                <div class="absolute top-0 left-0 bg-slate-800 text-white text-[10px] px-3 py-1.5 font-bold tracking-widest uppercase rounded-br-lg shadow-sm">DÃY SỐ ${rowIdx + 1}</div>
                                <svg width="${svgWidth}" height="${svgHeight}" style="font-family: Arial, sans-serif;">`;
                
                // Lưới nền mờ
                svgHtml += `<g opacity="0.3">`;
                for (let i = 0; i <= maxCols; i++) {
                    svgHtml += `<line x1="${i * COL_W}" y1="${topMargin}" x2="${i * COL_W}" y2="${topMargin + MAX_COL_H}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>`;
                }
                if (viewMode === "2") {
                    for (let i = 0; i <= 5; i++) {
                        svgHtml += `<line x1="0" y1="${topMargin + (i * (MAX_COL_H/5))}" x2="${maxCols * COL_W}" y2="${topMargin + (i * (MAX_COL_H/5))}" stroke="#94a3b8" stroke-width="1"/>`;
                    }
                }
                svgHtml += `</g>`;

                // VẼ ĐƯỜNG ZICZAC (NẾU LÀ VIEW 2)
                if (viewMode === "2") {
                    let profilePath = `M 0 ${topMargin + MAX_COL_H}`;
                    rowStacks.forEach((col, i) => {
                        const colTotalBoxes = col.reduce((sum, c) => sum + c.boxesInCol, 0);
                        const colH = colTotalBoxes * BOX_H;
                        const y = topMargin + MAX_COL_H - colH;
                        const x = i * COL_W;
                        profilePath += ` L ${x} ${y} L ${x + COL_W} ${y}`;
                    });
                    profilePath += ` L ${rowStacks.length * COL_W} ${topMargin + MAX_COL_H} L ${maxCols * COL_W} ${topMargin + MAX_COL_H}`;
                    svgHtml += `<path d="${profilePath}" fill="#f8fafc" stroke="#0f172a" stroke-width="3" stroke-linejoin="miter" />`;
                }

                // VẼ TỪNG CỘT
                rowStacks.forEach((col, i) => {
                    const x = i * COL_W;
                    const totalBoxes = col.reduce((sum, c) => sum + c.boxesInCol, 0);
                    
                    const isMixed = col.length > 1;

                    // Xác định Y và H của khối vẽ dựa trên ViewMode
                    let rectY, rectH;
                    if (viewMode === "1") {
                        // Chế độ khối đồng nhất
                        rectH = MAX_COL_H;
                        rectY = topMargin;
                    } else {
                        // Chế độ ziczac
                        rectH = totalBoxes * BOX_H;
                        rectY = topMargin + MAX_COL_H - rectH;
                    }

                    svgHtml += `<g transform="translate(${x}, 0)" class="hover-group">`;
                    
                    // Nền hover và viền
                    if (viewMode === "1") {
                        // Khung ô vuông chuẩn
                        svgHtml += `<rect x="0" y="${rectY}" width="${COL_W}" height="${rectH}" fill="transparent" stroke="#0f172a" stroke-width="2" class="cell-bg transition-colors"/>`;
                    } else {
                        // Vách ngăn ziczac
                        svgHtml += `<line x1="${COL_W}" y1="${rectY}" x2="${COL_W}" y2="${topMargin + MAX_COL_H}" stroke="#0f172a" stroke-width="2" />`;
                    }

                    // NỘI DUNG BÊN TRONG CỘT
                    if (isMixed) {
                        // Vẽ gạch chéo
                        svgHtml += `<line x1="0" y1="${rectY}" x2="${COL_W}" y2="${rectY + rectH}" stroke="#0f172a" stroke-width="2" />`;
                        
                        // Lô mới (Ở trên)
                        svgHtml += `
                            <circle cx="${COL_W * 0.75}" cy="${rectY + rectH * 0.25}" r="18" fill="white" stroke="#0f172a" stroke-width="2" />
                            <text x="${COL_W * 0.75}" y="${rectY + rectH * 0.25 + 5}" font-size="14" font-weight="900" text-anchor="middle" fill="#0f172a">${col[1].boxesInCol}</text>
                        `;
                        // Lô cũ (Ở dưới)
                        svgHtml += `
                            <circle cx="${COL_W * 0.25}" cy="${rectY + rectH * 0.75}" r="18" fill="white" stroke="#0f172a" stroke-width="2" />
                            <text x="${COL_W * 0.25}" y="${rectY + rectH * 0.75 + 5}" font-size="14" font-weight="900" text-anchor="middle" fill="#0f172a">${col[0].boxesInCol}</text>
                        `;
                    } else if (col[0]?.boxesInCol > 0) {
                        // Một lô
                        svgHtml += `
                            <g transform="translate(${COL_W / 2}, ${rectY + rectH/2})">
                                <circle cx="0" cy="0" r="22" fill="white" stroke="#0f172a" stroke-width="2" />
                                <text x="0" y="6" font-size="18" font-weight="900" text-anchor="middle" fill="#0f172a">${col[0].boxesInCol}</text>
                            </g>
                        `;
                    }

                    // CHÚ THÍCH HÒM LẺ (TRÊN ĐỈNH CỘT)
                    let offsetLeftover = 0;
                    col.forEach((item) => {
                        if (item.showLeftover > 0) {
                            svgHtml += `
                                <g transform="translate(${COL_W / 2}, ${rectY - 15 - offsetLeftover})">
                                    <text x="0" y="0" font-size="13" font-style="italic" font-weight="bold" text-anchor="middle" fill="#dc2626">lẻ ${item.showLeftover} V</text>
                                    <line x1="40" y1="-4" x2="65" y2="-4" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead)"/>
                                </g>
                            `;
                            offsetLeftover += 20;
                        }
                    });

                    // TEXT CHI TIẾT DƯỚI GẦM CỘT
                    const textY = topMargin + MAX_COL_H + 20;
                    svgHtml += `<g transform="translate(10, ${textY})">`;
                    
                    svgHtml += `<text x="0" y="0" font-size="11" font-weight="bold" fill="#0f172a">Tổng: ${totalBoxes} hòm</text>`;
                    
                    if (isMixed) {
                        svgHtml += `
                            <text x="0" y="20" font-size="11" fill="#475569">- Lô: <tspan fill="#2563eb" font-weight="bold">${col[1].lot}</tspan></text>
                            <text x="8" y="36" font-size="10" fill="#64748b">▸ ${col[1].boxesInCol} hòm (SL: ${Number(col[1].qty).toLocaleString('vi-VN')})</text>
                            
                            <text x="0" y="56" font-size="11" fill="#475569">- Lô: <tspan fill="#2563eb" font-weight="bold">${col[0].lot}</tspan></text>
                            <text x="8" y="72" font-size="10" fill="#64748b">▸ ${col[0].boxesInCol} hòm (SL: ${Number(col[0].qty).toLocaleString('vi-VN')})</text>
                        `;
                    } else if (col[0]) {
                         svgHtml += `
                            <text x="0" y="20" font-size="11" fill="#475569">- Lô: <tspan fill="#2563eb" font-weight="bold">${col[0].lot}</tspan></text>
                            <text x="8" y="36" font-size="10" fill="#64748b">▸ ${col[0].boxesInCol} hòm</text>
                            <text x="8" y="50" font-size="10" fill="#64748b">▸ Tổng SL: ${Number(col[0].qty).toLocaleString('vi-VN')} V</text>
                        `;
                    }
                    svgHtml += `</g></g>`;
                });
                
                // Nền đen đáy
                svgHtml += `<rect x="0" y="${topMargin + MAX_COL_H}" width="${svgWidth}" height="4" fill="#0f172a" />`;
                svgHtml += `</svg></div>`;
                
                html += svgHtml;
            });

            container.innerHTML = html;
        }

        // --- CÁC HÀM CẬP NHẬT ---
        function updateKPIs() {
            let tLots = state.items.length;
            let tItems = 0; let tBoxes = 0;
            state.items.forEach(i => {
                tItems += Number(i.qty) || 0;
                tBoxes += Math.floor((Number(i.qty)||0) / (Number(i.pack)||1));
            });
            document.getElementById('kpiLots').innerText = tLots;
            document.getElementById('kpiItems').innerText = tItems.toLocaleString('vi-VN');
            document.getElementById('kpiBoxes').innerText = tBoxes.toLocaleString('vi-VN');
        }

        function triggerRender() {
            renderInputPanel();
            renderDiagram();
            updateKPIs();
        }

        function updateConfig() {
            state.config.maxHeight = Math.max(1, Number(document.getElementById('cfgMaxHeight').value));
            state.config.maxCols = Math.max(1, Number(document.getElementById('cfgMaxCols').value));
            state.config.defaultPack = Math.max(1, Number(document.getElementById('cfgDefaultPack').value));
            state.config.allowMix = document.getElementById('cfgAllowMix').checked;
            
            const toggleBg = document.getElementById('toggleBg');
            const toggleDot = document.getElementById('toggleDot');
            if (state.config.allowMix) {
                toggleBg.classList.replace('bg-slate-600', 'bg-emerald-500');
                toggleDot.classList.replace('translate-x-1', 'translate-x-6');
            } else {
                toggleBg.classList.replace('bg-emerald-500', 'bg-slate-600');
                toggleDot.classList.replace('translate-x-6', 'translate-x-1');
            }
            triggerRender();
            showToast("Đã cập nhật cài đặt!");
        }

        // --- ACTIONS THAO TÁC DATA ---
        function addNewItem() {
            state.items.push({ id: Date.now(), type: '', lot: '', qty: 1000, pack: state.config.defaultPack });
            triggerRender();
            const container = document.getElementById('dataContainer');
            setTimeout(() => container.scrollTop = container.scrollHeight, 50);
        }

        function removeItem(id) {
            if(confirm('Xóa lô đạn này?')) {
                state.items = state.items.filter(i => i.id !== id);
                triggerRender();
            }
        }

        function updateItem(id, field, value) {
            const item = state.items.find(i => i.id === id);
            if (item) {
                item[field] = value;
                triggerRender();
            }
        }

        function applyPackToAll() {
            const newPack = state.config.defaultPack;
            if(confirm(`Đồng bộ quy cách đóng gói [${newPack} viên/hòm] cho TẤT CẢ các lô?`)) {
                state.items.forEach(i => i.pack = newPack);
                triggerRender();
                showToast("Đã đồng bộ quy cách!");
            }
        }

        // --- NHẬP EXCEL NÂNG CAO ---
        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                    
                    let count = 0;
                    // Duyệt từ dòng 2 (bỏ dòng header)
                    for(let i = 1; i < json.length; i++) {
                        const row = json[i];
                        if(!row || row.length === 0) continue; // Bỏ qua dòng trống hoàn toàn
                        
                        // Lấy dữ liệu an toàn, nếu ô trống thì gán mặc định
                        const typeStr = row[0] ? String(row[0]).trim() : "Trống";
                        const lotStr = row[1] ? String(row[1]).trim() : "Chưa có mã";
                        const qtyNum = Number(row[2]) || 0;
                        const packNum = Number(row[3]) || state.config.defaultPack;

                        // Chỉ bỏ qua nếu cả 3 cột chính đều không có dữ liệu
                        if(typeStr === "Trống" && lotStr === "Chưa có mã" && qtyNum === 0) continue;

                        state.items.push({
                            id: Date.now() + i,
                            type: typeStr,
                            lot: lotStr,
                            qty: qtyNum,
                            pack: packNum
                        });
                        count++;
                    }

                    if(count > 0) {
                        triggerRender();
                        showToast(`Nhập thành công ${count} lô từ Excel!`);
                    } else {
                        alert("File không có dữ liệu hợp lệ. Xem cấu trúc file mẫu.");
                    }
                } catch (error) {
                    alert("Lỗi đọc file Excel.");
                }
                document.getElementById('excelUpload').value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        function downloadTemplate() {
            const data = [
                ["Loại Đạn", "Mã Lô", "Tổng Số Lượng (Viên)", "Quy cách (Viên/Hòm) - Tùy chọn"],
                ["ĐẠN CX14.5", "0312-1975-41", 20404, 1000],
                ["ĐẠN AK47", "011-85-11", 5000, ""]
            ];
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Mau_Nhap_Lieu");
            XLSX.writeFile(wb, "Mau_Nhap_Kho.xlsx");
        }

        // --- GIAO DIỆN ---
        function switchPanel(panelId) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active', 'text-white');
                b.classList.add('text-slate-400');
            });
            document.querySelectorAll('.panel-section').forEach(p => p.classList.remove('active'));

            if (panelId === 'data') {
                document.getElementById('tabData').classList.add('active', 'text-white');
                document.getElementById('tabData').classList.remove('text-slate-400');
                document.getElementById('panelData').classList.add('active');
            } else {
                document.getElementById('tabSettings').classList.add('active', 'text-white');
                document.getElementById('tabSettings').classList.remove('text-slate-400');
                document.getElementById('panelSettings').classList.add('active');
            }
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('-translate-x-full')) sidebar.classList.remove('-translate-x-full');
            else sidebar.classList.add('-translate-x-full');
        }

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            document.getElementById('toastText').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 3000);
        }

        // Khởi chạy
        window.onload = () => {
            triggerRender();
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        };
    </script>
</body>
